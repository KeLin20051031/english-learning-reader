<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语学习阅读器 EnglishReader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ========== 全局变量与基础 ========== */
:root{
  --bg:#f0f2f5; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#fafbfc;
  --primary:#4f6df5; --primary-light:#e8edfe; --primary-dark:#3b56d4; --primary-glow:rgba(79,109,245,.15);
  --text:#1a1f36; --text-2:#5a6378; --text-3:#9aa3b8; --text-4:#c5cad6;
  --border:#e4e7ed; --border-light:#f0f2f5; --border-dark:#d0d3d8;
  --success:#10b981; --success-light:#d1fae5; --warning:#f59e0b; --warning-light:#fef3c7; --danger:#ef4444; --danger-light:#fee2e2;
  --radius-sm:6px; --radius:12px; --radius-lg:16px; --radius-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --shadow:0 2px 8px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.03);
  --shadow-md:0 4px 12px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08),0 16px 48px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;}
/* 触屏：禁用双击缩放与长按高亮，保留滚动与捏合缩放 */
button,input,textarea,.word-bubble,.toc-item,.mode-btn,.btn,.btn-icon,.doc-card,.folder-card{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{overscroll-behavior-y:none;}
input,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#c5cad6;border-radius:3px;transition:background .2s;}
::-webkit-scrollbar-thumb:hover{background:#a8adb8;}
::-webkit-scrollbar-track{background:transparent;}
::selection{background:var(--primary-glow);color:var(--primary);}

/* ========== 动画 ========== */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.animate-fade-in{animation:fadeIn .3s ease-out;}
.animate-slide-right{animation:slideInRight .3s ease-out;}
.animate-slide-left{animation:slideInLeft .3s ease-out;}
.animate-scale-in{animation:scaleIn .2s ease-out;}

/* ========== 通用按钮 ========== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius);font-size:14px;font-weight:500;transition:all .2s ease;background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn:hover{background:var(--surface-2);border-color:var(--border-dark);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--primary-glow);}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-dark),var(--primary));box-shadow:0 4px 16px var(--primary-glow);transform:translateY(-1px);}
.btn-secondary{background:var(--surface-2);border-color:var(--border);}
.btn-secondary:hover{background:var(--surface-3);}
.btn-danger{color:var(--danger);border-color:var(--border);}
.btn-danger:hover{background:var(--danger-light);border-color:rgba(239,68,68,.3);}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:var(--radius-sm);}
.btn-sm:hover{transform:none;}
.btn-icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:transparent;border:none;color:var(--text-2);font-size:18px;transition:all .2s;}
.btn-icon:hover{background:var(--surface-2);color:var(--text);}
.btn-icon.active{background:var(--primary);color:#fff;}

/* ========== 卡片组件 ========== */
.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);transition:all .3s;}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border-dark);}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:20px;}
.card-title{font-size:15px;font-weight:600;color:var(--text);}

/* ========== 视图容器 ========== */
.view{display:none;height:100vh;flex-direction:column;}
.view.active{display:flex;}

/* ========== 顶部栏 ========== */
.topbar{display:flex;align-items:center;gap:16px;padding:0 28px;height:64px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.03);}
.topbar-title{font-size:19px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);letter-spacing:-0.3px;}
.topbar-subtitle{font-size:13px;color:var(--text-3);margin-left:8px;font-weight:400;}
.topbar-back{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;padding:6px 10px;border-radius:var(--radius-sm);transition:all .2s;}
.topbar-back:hover{color:var(--primary);background:var(--primary-light);}

/* ========== 首页 ========== */
.home-content{flex:1;overflow-y:auto;padding:40px 60px;background:var(--bg);}
.home-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:20px;}
.home-header h1{font-size:30px;font-weight:700;color:var(--text);letter-spacing:-0.5px;}
.home-header p{color:var(--text-2);font-size:15px;margin-top:6px;}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.folder-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;}
.folder-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px);}
.folder-icon{font-size:36px;margin-bottom:10px;}
.folder-name{font-size:16px;font-weight:600;margin-bottom:4px;word-break:break-word;}
.folder-meta{font-size:12px;color:var(--text-3);}
.folder-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:opacity .2s;z-index:10;}
.folder-card:hover .folder-actions{opacity:1;}
.folder-icon{pointer-events:none;}
.empty-state{text-align:center;padding:80px 20px;color:var(--text-3);}
.empty-state .icon{font-size:56px;margin-bottom:12px;}
.empty-state h3{font-size:18px;color:var(--text-2);margin-bottom:6px;}

/* ========== 文件夹视图 ========== */
.folder-content{flex:1;overflow-y:auto;padding:24px 48px;}
.doc-list{display:flex;flex-direction:column;gap:10px;}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;position:relative;}
.doc-card:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.doc-icon{font-size:24px;color:var(--primary);width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);border-radius:8px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-subname{font-size:13px;color:var(--text-2);margin-bottom:2px;line-height:1.4;word-break:break-all;}
.doc-meta{font-size:12px;color:var(--text-3);margin-top:2px;}
.progress-bar{width:100px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;flex-shrink:0;}
.progress-fill{height:100%;background:var(--primary);transition:width .3s;}
.doc-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s;}
.doc-card:hover .doc-actions{opacity:1;}

/* ========== 阅读视图 ========== */
.reader-view{flex-direction:row;background:var(--bg);}
.reader-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);margin:16px;margin-left:0;margin-right:0;border-radius:var(--radius-xl);box-shadow:var(--shadow);}
.reader-toolbar{display:flex;align-items:center;gap:16px;padding:0 28px;height:56px;background:var(--surface);border-bottom:1px solid var(--border-light);flex-shrink:0;}
.mode-switch{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;}
.mode-btn{padding:7px 16px;border-radius:5px;font-size:13px;font-weight:500;color:var(--text-2);background:transparent;transition:all .2s;}
.mode-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(79,109,245,.15);}
/* 文档目录面板 */
.toc-toggle-btn{flex-shrink:0;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s;}
.toc-toggle-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.toc-panel{position:absolute;top:56px;right:20px;width:300px;max-height:62vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:500;padding:12px 10px;}
.toc-panel h4{margin:0 6px 8px;font-size:14px;color:var(--text-1);}
.toc-item{display:block;width:100%;text-align:left;padding:6px 10px;font-size:13px;line-height:1.45;color:var(--text-2);border-radius:6px;cursor:pointer;background:none;border:none;transition:background .15s;}
.toc-item:hover{background:var(--surface-2);color:var(--primary);}
.toc-item.level-2{padding-left:22px;font-size:12.5px;}
.toc-item.level-3{padding-left:34px;font-size:12px;color:var(--text-3);}
.toc-item .toc-num{color:var(--text-3);margin-right:6px;font-size:12px;}
/* 目录页码重命名（PDF原版视图） */
.toc-panel h4{display:flex;align-items:center;justify-content:space-between;}
.toc-clear-all{border:none;background:var(--surface-2);color:var(--text-3);font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;margin-left:8px;flex-shrink:0;}
.toc-clear-all:hover{color:var(--danger,#e05c5c);background:rgba(224,92,92,.12);}
.toc-page-item{display:flex;align-items:center;min-width:0;}
.toc-page-item .toc-item{flex:1;min-width:0;width:auto;}
.toc-page-item .toc-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:180px;vertical-align:bottom;}
.toc-item-actions{display:none;gap:2px;flex-shrink:0;margin-left:4px;}
.toc-page-item:hover .toc-item-actions{display:inline-flex;}
.toc-rename-btn,.toc-reset-btn{width:20px;height:20px;border:none;border-radius:4px;background:var(--surface-2);color:var(--text-3);font-size:11px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.toc-rename-btn:hover{color:var(--primary);background:var(--primary-light);}
.toc-reset-btn:hover{color:var(--danger,#e05c5c);background:rgba(224,92,92,.12);}
.toc-empty{color:var(--text-3);font-size:12px;padding:10px;text-align:center;}
.reader-content{flex:1;overflow-y:auto;padding:40px 56px;background:var(--surface);}
.reader-content.intensive{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;max-width:850px;margin:0 auto;}

/* PDF原版视图 */
.reader-content.pdf-original{padding:20px;background:#f5f5f5;}
.pdf-original-container{display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:40px;}
.pdf-page-wrapper{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:4px;overflow:hidden;}
.pdf-page-wrapper canvas{display:block;}
.pdf-zoom-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:8px 16px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.pdf-zoom-bar button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.pdf-zoom-bar button:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
.pdf-zoom-level{font-size:13px;font-weight:600;color:var(--text);min-width:60px;text-align:center;}
.pdf-page-indicator{font-size:12px;color:var(--text-3);cursor:pointer;user-select:none;} .pdf-page-cur{font-weight:700;color:var(--primary);} .pdf-page-cur:hover{text-decoration:underline;} .pdf-page-printed{margin-left:8px;font-size:11px;color:var(--text-3);} .pdf-page-printed.hidden{display:none;} .pdf-page-input{width:44px;border:1px solid var(--primary);border-radius:6px;padding:2px 6px;font-size:12px;text-align:center;outline:none;background:var(--surface);color:var(--text);box-sizing:border-box;}
.pdf-view-toggle{display:flex;gap:3px;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;margin-left:auto;}
.pdf-view-toggle .mode-btn{padding:5px 12px;font-size:12px;border-radius:4px;cursor:pointer;border:none;background:transparent;color:var(--text-3);transition:all .15s;}
.pdf-view-toggle .mode-btn.active{background:var(--primary);color:#fff;}
.pdf-view-toggle .mode-btn:hover:not(.active){background:var(--surface);}

/* PDF原版视图文本层（叠加在Canvas上实现单词交互） */
.pdf-page-wrapper{position:relative;}
.pdf-text-layer{position:absolute;left:0;top:0;overflow:hidden;line-height:1;pointer-events:none;z-index:2;transform-origin:0 0;-webkit-text-size-adjust:none;text-size-adjust:none;}
.pdf-text-layer span[role="presentation"]{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;cursor:pointer;user-select:none;}
.pdf-text-layer .pdf-word-bubble{display:inline;padding:0;margin:0;border-radius:2px;transition:background .15s,box-shadow .15s;color:transparent;cursor:pointer;pointer-events:auto;}
.pdf-text-layer .pdf-word-bubble:hover{background:rgba(79,109,245,.22);box-shadow:0 0 0 1px rgba(79,109,245,.4);color:transparent;}
.pdf-text-layer .pdf-word-bubble.saved{border-bottom:2px solid var(--success,#10b981);background:transparent;}
.pdf-text-layer .pdf-word-bubble.saved:hover{background:rgba(16,185,129,.18);}
.pdf-text-layer .pdf-word-bubble.phrase-selected{background:rgba(245,158,11,.28);box-shadow:0 0 0 1px rgba(245,158,11,.5);}

/* 精读模式 */
.intensive-box{max-width:720px;width:100%;text-align:center;padding:24px 0;}
.intensive-text{font-size:24px;line-height:2;color:var(--text);margin:28px 0;min-height:70px;letter-spacing:-0.3px;font-weight:400;}
.intensive-text.highlight{background:var(--primary-light);padding:16px 24px;border-radius:var(--radius);border-left:4px solid var(--primary);}
.intensive-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--border-light);}
.intensive-counter{font-size:13px;color:var(--text-3);}

/* ===== 精读模式语法分析可视化 ===== */
.intensive-grammar{margin-top:20px;text-align:left;}
.grammar-panel{background:linear-gradient(135deg,#faf8ff,#f3eeff);border:1px solid #d4c5f9;border-radius:12px;padding:16px 18px;position:relative;overflow:visible;}
.grammar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed #d4c5f9;}
.grammar-title{font-size:14px;font-weight:700;color:#5b3a8c;display:flex;align-items:center;gap:6px;}
.grammar-close{background:transparent;border:none;color:#9ca3af;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:all .2s;}
.grammar-close:hover{background:#fee2e2;color:#ef4444;}
.grammar-structure{background:rgba(255,255,255,.6);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
.grammar-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.6;}
.grammar-key{flex-shrink:0;min-width:60px;color:#6b4c9a;font-weight:600;background:#f3eeff;padding:1px 8px;border-radius:4px;font-size:12px;}
.grammar-val{color:#374151;flex:1;}
.grammar-tree{font-size:17px;line-height:2.4;letter-spacing:0.2px;color:#1f2937;padding:12px 8px;background:#fff;border-radius:8px;border:1px solid #ede9fe;margin-bottom:12px;}
.gram-comp{display:inline;position:relative;cursor:help;transition:background .15s;border-radius:3px;padding:1px 0;}
.gram-comp:hover{background:color-mix(in srgb, var(--gc) 12%, transparent);}
.gram-bracket{color:var(--gc);font-weight:700;font-size:0.92em;opacity:0.85;}
.gram-label{font-size:10px;font-weight:700;vertical-align:super;line-height:0;padding:0 2px;letter-spacing:0.3px;opacity:0.9;text-transform:uppercase;}
.gram-text{color:#1f2937;}
.gram-connector{color:#6b7280;}
.gram-head-word{font-weight:700;border-bottom:2px solid var(--gc);background:color-mix(in srgb, var(--gc) 15%, transparent);padding:0 1px;border-radius:2px;}
.gram-head-label{font-size:9px;font-weight:600;vertical-align:super;line-height:0;padding:0 2px;opacity:0.75;margin-left:-2px;}
.gram-comp:hover .gram-bracket,
.gram-comp:hover .gram-label{opacity:1;}
.gram-comp:hover .gram-text{background:color-mix(in srgb, var(--gc) 10%, transparent);}
.grammar-tip{background:linear-gradient(90deg,#fef3c7,#fde68a);border-left:3px solid #f59e0b;padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;color:#78350f;margin-bottom:10px;line-height:1.6;}
.grammar-legend{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed #d4c5f9;}
.legend-item{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#6b7280;background:#fff;padding:2px 8px;border-radius:10px;border:1px solid #e5e7eb;}
.legend-item i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.grammar-sentence-trans{font-size:12.5px;color:#9ca3af;line-height:1.65;padding:8px 10px;margin:8px 8px 4px;background:#fafafa;border-radius:4px;border-top:1px dashed #e5e7eb;display:flex;gap:6px;align-items:flex-start;}
.grammar-sentence-trans .gst-label{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:18px;height:18px;font-size:10px;color:#fff;background:#9ca3af;border-radius:3px;margin-top:1px;}
.grammar-loading{padding:16px;text-align:center;color:#6b4c9a;font-size:14px;background:#f3eeff;border-radius:8px;animation:grammar-pulse 1.2s ease-in-out infinite;}
@keyframes grammar-pulse{0%,100%{opacity:0.6;}50%{opacity:1;}}
.grammar-error{padding:12px;text-align:center;color:#ef4444;font-size:13px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;}

/* ===== 泛读模式 ===== */
.skim-content{max-width:850px;margin:0 auto;}

/* HTML 文档内容样式 */
.html-content{max-width:100%;overflow-x:auto;padding:16px 20px;line-height:1.8;color:var(--text);}
.html-content img{max-width:100%;height:auto;border-radius:4px;}
.html-content table{max-width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;}
.html-content table,.html-content th,.html-content td{border:1px solid var(--border,#d0d5dd);padding:8px 12px;}
.html-content th{background:var(--bg-2,#f0f2f5);font-weight:600;}
.html-content pre{background:var(--surface-2,#f5f7fa);padding:12px 16px;border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.5;}
.html-content code{background:var(--surface-2,#f5f7fa);padding:2px 6px;border-radius:3px;font-size:.9em;}
.html-content blockquote{border-left:4px solid var(--primary,#4a90d9);padding:8px 16px;margin:12px 0;background:var(--bg-2,#f5f7fa);border-radius:0 4px 4px 0;}
.html-content a{color:var(--primary,#4a90d9);text-decoration:underline;}
.html-content h1,.html-content h2,.html-content h3,.html-content h4,.html-content h5,.html-content h6{margin:16px 0 8px;color:var(--text);line-height:1.4;}
.html-content ul,.html-content ol{padding-left:24px;margin:8px 0;}
.html-content p{margin:8px 0;}
.html-content .word-bubble{cursor:pointer;padding:0 1px;border-radius:2px;transition:all .15s;}
.html-content .word-bubble:hover{background:var(--hover-bg,rgba(74,144,217,.12));color:var(--primary,#4a90d9);}
.html-content .word-bubble.saved{text-decoration:underline;text-decoration-color:var(--success,#52c41a);text-underline-offset:3px;text-decoration-thickness:2px;}
.paragraph{margin-bottom:24px;line-height:2;font-size:16px;color:var(--text);padding:16px 20px;border-radius:var(--radius);transition:all .2s;}
.paragraph:hover{background:var(--surface-3);}

/* 单词气泡 */
.word-bubble{display:inline;padding:3px 6px;border-radius:6px;cursor:pointer;transition:all .2s;margin:0 2px;}
.word-bubble:hover{background:var(--primary-light);box-shadow:0 1px 4px rgba(79,109,245,.15);}
.word-bubble.saved{border-bottom:2px dotted var(--success);background:rgba(16,185,129,.08);}
/* 词组/句子已收藏：直线标记 */
.word-bubble.phrase-saved{border-bottom:2px solid #2196f3;background:rgba(33,150,243,.08);border-radius:6px;}
.sentence-box.has-phrase-saved{border-left:3px solid #2196f3;background:rgba(33,150,243,.04);padding-left:12px;border-radius:0 8px 8px 0;}
/* 泛读模式词组标记 */
.read-para .phrase-mark{border-bottom:2px solid #2196f3;background:rgba(33,150,243,.08);cursor:pointer;border-radius:3px;padding:0 2px;}
.read-para .phrase-mark:hover{background:rgba(33,150,243,.18);}
.word-bubble.selected{background:#fffbeb;border:1px solid #f59e0b;border-radius:6px;}
.word-bubble.translating{opacity:.5;}
.word-tooltip{position:absolute;background:var(--surface);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:13px;z-index:1000;pointer-events:none;max-width:320px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.word-tooltip .tt-word{font-weight:600;margin-bottom:4px;color:var(--primary);font-size:14px;}
.word-tooltip .tt-trans{color:var(--text);font-size:13px;}
/* ===== 悬浮释义浮层（已收藏/已注释单词 hover 显示中文释义） ===== */
.hover-tip{position:fixed;background:var(--surface);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:13px;line-height:1.5;z-index:2147483000;pointer-events:none;max-width:340px;box-shadow:var(--shadow-lg);border:1px solid var(--border-dark);display:none;}
.hover-tip .ht-word{font-weight:700;color:var(--primary);font-size:14px;margin-bottom:2px;letter-spacing:.2px;}
.hover-tip .ht-word::before{content:'📖 ';font-size:12px;}
.hover-tip .ht-trans{color:var(--text);font-size:13px;word-break:break-word;}
.hover-tip .ht-trans::before{content:'释义：';color:var(--text-3);font-size:12px;}
.hover-tip .ht-tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--success);background:var(--success-light);border-radius:10px;padding:1px 8px;}
.hover-tip::before{content:'';position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--surface);border-top:0;}
.hover-tip.flip::before{top:auto;bottom:-6px;border-bottom-color:transparent;border-top:6px solid var(--surface);}
/* 正在显示释义浮层的单词：轻量高亮提示 */
.word-bubble.tip-on{background:rgba(16,185,129,.16);box-shadow:0 0 0 1px rgba(16,185,129,.35);border-radius:4px;}

/* 精读内联翻译面板 */
.intensive-translations{margin-top:12px;padding:12px 16px;background:var(--surface-2,#f5f7fa);border-radius:8px;border-left:3px solid var(--primary,#4a90d9);text-align:left;max-height:300px;overflow-y:auto;}
.int-trans-panel{display:flex;flex-wrap:wrap;gap:4px 16px;}
.int-trans-item{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;line-height:1.8;padding:2px 0;}
.int-trans-word{font-weight:700;color:var(--primary,#4a90d9);font-size:14px;}
.int-trans-arrow{color:var(--text-3,#999);font-size:11px;}
.int-trans-text{color:var(--text,#333);}
.int-trans-loading{opacity:.6;font-style:italic;}
/* 精读内联翻译-句子整句翻译 */
.int-trans-full{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border,#d0d5dd);font-size:13px;line-height:1.6;color:var(--text-2,#666);}
.int-trans-full-label{font-weight:600;color:var(--text,#333);margin-right:6px;}
/* 详情跳转按钮 */
.jump-original-btn{font-size:12px;padding:4px 10px;background:var(--primary,#4a90d9);color:#fff;border:none;border-radius:4px;cursor:pointer;}

/* 自定义滚动条 - 生词篮 */
.buffer-list::-webkit-scrollbar{width:6px;}
.buffer-list::-webkit-scrollbar-track{background:transparent;}
.buffer-list::-webkit-scrollbar-thumb{background:var(--border,#d0d5dd);border-radius:3px;min-height:30px;}
.buffer-list::-webkit-scrollbar-thumb:hover{background:var(--text-3,#999);}
/* Firefox 滚动条 */
.buffer-list{scrollbar-width:thin;scrollbar-color:var(--border,#d0d5dd) transparent;}

/* ========== 弹窗 ========== */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:12px;padding:24px;width:90%;max-width:420px;box-shadow:var(--shadow-lg);}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px;}
.modal-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}

/* 单词管理大弹窗 */
.modal-lg{max-width:1080px !important;width:96vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-lg h3{flex-shrink:0;}
.wm-panel{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:4px;}
.wm-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-light);flex-shrink:0;}
.wm-search{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface-2);}
.wm-search:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-glow);}
.wm-select{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);}
.wm-count{font-size:12px;color:var(--text-3);}
.wm-btn{height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all .15s;}
.wm-btn:hover{background:var(--surface-2);color:var(--text);}
.wm-btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent;}
.wm-btn-primary:hover{opacity:.9;color:#fff;}
.wm-btn-danger{color:var(--danger);border-color:var(--border);}
.wm-btn-danger:hover{background:var(--danger-light);border-color:rgba(239,68,68,.3);}
.wm-btn:disabled{opacity:.45;cursor:not-allowed;}
.wm-table-wrap{flex:1;overflow-y:auto;min-height:0;margin-top:12px;}
.wm-table{width:100%;border-collapse:collapse;font-size:13px;}
.wm-table th{position:sticky;top:0;background:var(--surface-3);color:var(--text-2);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);z-index:2;white-space:nowrap;}
.wm-table td{padding:9px 10px;border-bottom:1px solid var(--border-light);vertical-align:top;}
.wm-table tr:hover td{background:var(--surface-2);}
.wm-table tr.selected td{background:var(--primary-light);}
.wm-check{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;vertical-align:middle;}
.wm-word{font-weight:600;color:var(--primary);word-break:break-all;}
.wm-pos{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;color:var(--primary);background:var(--primary-light);margin-right:6px;}
.wm-pos.empty{color:var(--text-3);background:var(--surface-2);}
.wm-trans{color:var(--text);line-height:1.5;}
.wm-type-tag{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;}
.wm-type-tag.word{color:#8b5e3c;background:#fdf0e3;}
.wm-type-tag.phrase{color:#7c3aed;background:#f3e8ff;}
.wm-src{font-size:12px;color:var(--text-3);word-break:break-all;}
.wm-empty{text-align:center;padding:48px 20px;color:var(--text-3);font-size:13px;line-height:1.8;}
.wm-row-actions{white-space:nowrap;}
.wm-row-actions button{margin-right:6px;padding:2px 9px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;}
.wm-row-actions button:hover{background:var(--surface-2);}
.wm-row-actions .wm-del{color:var(--danger);}
.wm-row-actions .wm-del:hover{background:var(--danger-light);}

/* 翻译弹窗 */
.translate-modal{max-width:420px;}
.translate-modal .tm-word{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.translate-modal .tm-status{font-size:13px;color:var(--text-3);margin-bottom:12px;}
.translate-modal .tm-trans{font-size:15px;line-height:1.6;margin-bottom:16px;min-height:24px;}
.translate-modal .tm-edit{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;margin-bottom:12px;display:none;}
.translate-modal.editing .tm-trans{display:none;}
.translate-modal.editing .tm-edit{display:block;}
/* 例句库 */
.tm-examples{margin-bottom:12px;}
.tm-ex-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border);}
.tm-ex-item{padding:8px 10px;background:var(--bg-2,#f5f7fa);border-radius:6px;margin-bottom:6px;}
.tm-ex-sentence{font-size:13px;line-height:1.5;color:var(--text);margin-bottom:4px;}
.tm-ex-trans{font-size:12px;line-height:1.5;color:var(--text-3);}

/* ========== 生词篮缓冲区 ========== */
.buffer-panel{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100%;}
.buffer-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.buffer-header h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;}
.buffer-count{font-size:12px;color:var(--text-3);background:var(--surface-2);padding:2px 8px;border-radius:10px;}
.buffer-tip{padding:10px 16px;font-size:11px;color:var(--text-3);line-height:1.6;background:var(--surface-2);border-bottom:1px solid var(--border);flex-shrink:0;}
.buffer-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.buffer-list{flex:1;overflow-y:auto;padding:8px 12px;min-height:0;}
.buffer-item{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:all .2s;position:relative;}
.buffer-item.translating{opacity:.75;border-left:3px solid var(--warning);}
.buffer-item.done{border-left:3px solid var(--success);}
.buffer-item.failed{border-left:3px solid var(--danger);}
.buffer-item.saved{border-left:3px solid var(--primary);}
.buffer-trans-tabs{display:flex;gap:4px;margin-top:6px;margin-bottom:4px;}
.buffer-trans-tab{font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer;color:var(--text-3);background:var(--bg-2,#f0f2f5);transition:all .15s;user-select:none;}
.buffer-trans-tab.active{color:var(--primary);background:var(--primary-alpha, rgba(74,144,217,.12));font-weight:600;}
.buffer-trans-tab:hover{color:var(--text-1);}
.buffer-trans-body.hidden{display:none;}
.buffer-item.is-phrase{background:#fffbea;}
.buffer-item.is-phrase:hover{background:#fff5cc;}
.buffer-word-row{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.buffer-word{font-size:14px;font-weight:600;color:var(--primary);}
.buffer-status{font-size:11px;color:var(--text-3);white-space:nowrap;}
.buffer-status.loading{color:var(--warning);}
.buffer-status.done{color:var(--success);}
.buffer-status.failed{color:var(--danger);}
.buffer-status.saved{color:var(--primary);}
.buffer-trans{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5;}
.buffer-actions{display:flex;gap:6px;margin-top:8px;}
.buffer-actions button{padding:3px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;}
.buffer-actions button:hover{background:var(--surface-2);}
.buffer-actions .act-save{color:var(--primary);border-color:var(--primary);}
.buffer-actions .act-save:hover{background:var(--primary-light);}
.buffer-actions .act-saved{color:var(--text-3);cursor:default;}
.buffer-actions .act-remove{color:var(--danger);}
.buffer-actions .act-remove:hover{background:#fff0f0;}
.buffer-empty{text-align:center;padding:30px 16px;color:var(--text-3);font-size:13px;line-height:1.6;}
.buffer-toolbar{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
.buffer-toolbar .btn{flex:1;font-size:13px;padding:6px;justify-content:center;}
.buffer-toolbar .btn:disabled{opacity:.5;cursor:not-allowed;}
/* 词组选择 */
.word-bubble.phrase-selected{background:#fff3cd;}
#phrase-toolbar{position:absolute;background:var(--text);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;z-index:1000;display:none;align-items:center;gap:8px;box-shadow:var(--shadow-lg);white-space:nowrap;}
#phrase-toolbar.show{display:flex;}
#phrase-toolbar .pt-count{font-size:12px;color:#c0c4cc;}
#phrase-toolbar .pt-saved-badge{font-size:11px;padding:2px 8px;background:var(--success,#67c23a);color:#fff;border-radius:10px;}
#phrase-toolbar .pt-trans{font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
#phrase-toolbar .pt-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:3px 10px;border-radius:5px;font-size:12px;cursor:pointer;}
#phrase-toolbar .pt-btn:hover{background:rgba(255,255,255,.15);}
#phrase-toolbar .pt-btn.pt-primary{background:var(--primary);border-color:var(--primary);}
#phrase-toolbar .pt-btn.pt-primary:hover{background:var(--primary-dark);}
.loading-dots::after{content:'';animation:dots 1.5s infinite;}
@keyframes dots{0%,20%{content:'';}40%{content:'.';}60%{content:'..';}80%,100%{content:'...';}}

/* Toast 提示 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--text);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:2000;opacity:0;transition:all .3s;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ========== AI悬浮球 ========== */
#ai-orb{position:fixed;bottom:32px;right:32px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#4f6df5);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2100;box-shadow:0 4px 20px rgba(79,109,245,.4);transition:transform .2s,box-shadow .2s;user-select:none;}
#ai-orb:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(79,109,245,.55);}
#ai-orb.dragging{opacity:.85;cursor:grabbing;}
#ai-orb .pulse-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid rgba(79,109,245,.5);animation:orbPulse 2.5s ease-out infinite;pointer-events:none;}
@keyframes orbPulse{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.8);opacity:0;}}
#ai-orb .pulse-ring:nth-child(2){animation-delay:.8s;}
#ai-orb .pulse-ring:nth-child(3){animation-delay:1.6s;}

/* ========== AI聊天面板（仿Trae风格） ========== */
#ai-panel{position:fixed;top:0;right:-440px;width:430px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:2001;display:flex;flex-direction:column;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 32px rgba(0,0,0,.1);}
#ai-panel.open{right:0;}
.ai-panel-header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border-light);flex-shrink:0;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-3) 100%);}
.ai-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6c5ce7,#4f6df5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(108,92,231,.3);}
.ai-panel-title{flex:1;font-size:17px;font-weight:600;color:var(--text);letter-spacing:-0.3px;}
.ai-panel-status{font-size:12px;color:var(--success);display:flex;align-items:center;gap:4px;}
.ai-panel-status.offline{color:var(--text-3);}
.ai-panel-close{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text-2);background:transparent;border:none;transition:all .2s;}
.ai-panel-close:hover{background:var(--surface-2);color:var(--text);}
.ai-messages{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:16px;background:var(--surface);}
.ai-msg{max-width:96%;padding:14px 18px;border-radius:var(--radius);font-size:14px;line-height:1.75;word-break:break-word;}
.ai-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 8px var(--primary-glow);}
.ai-msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px;border:1px solid var(--border-light);}
.ai-msg.assistant .ai-code-block{background:#1e1e2e;color:#cdd6f4;padding:12px 16px;border-radius:var(--radius-sm);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;overflow-x:auto;margin:10px 0;white-space:pre-wrap;}
.ai-msg.assistant code{background:#1e1e2e;color:#cdd6f4;padding:2px 6px;border-radius:4px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;}
.ai-msg.assistant strong{font-weight:600;color:var(--text);}
.ai-msg.assistant ul,.ai-msg.assistant ol{margin:8px 0 8px 22px;}
.ai-msg.assistant li{margin-bottom:6px;}
.ai-thinking-fold{background:var(--surface-3);border:1px dashed var(--border);border-radius:var(--radius-sm);margin:8px 0;overflow:hidden;}
.ai-thinking-fold-header{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;user-select:none;transition:background .2s;}
.ai-thinking-fold-header:hover{background:var(--surface-2);}
.ai-thinking-fold-body{padding:10px 14px;font-size:13px;color:var(--text-3);line-height:1.6;border-top:1px dashed var(--border);display:none;}
.ai-thinking-fold.expanded .ai-thinking-fold-body{display:block;}
.ai-conclusion{background:var(--success-light);border-left:4px solid var(--success);padding:10px 14px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:10px 0;font-size:13px;color:#065f46;}
.ai-term-highlight{background:#fffbeb;border-radius:4px;padding:1px 6px;font-weight:500;color:#92400e;}
.ai-thinking-dots{display:flex;gap:6px;padding:8px 0;}
.ai-thinking-dots span{width:8px;height:8px;border-radius:50%;background:var(--text-3);animation:aiBounce 1.4s infinite;}
.ai-thinking-dots span:nth-child(2){animation-delay:.2s;}
.ai-thinking-dots span:nth-child(3){animation-delay:.4s;}
@keyframes aiBounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-8px);}}
.ai-quick-actions{display:flex;gap:8px;padding:12px 24px;flex-wrap:wrap;border-top:1px solid var(--border-light);flex-shrink:0;background:var(--surface-3);}
.ai-quick-btn{padding:7px 14px;border-radius:18px;font-size:12px;background:var(--surface);color:var(--text-2);border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.ai-quick-btn:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary);box-shadow:0 2px 8px var(--primary-glow);}
.ai-input-area{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border-light);flex-shrink:0;background:var(--surface);}
.ai-input-area textarea{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;resize:none;line-height:1.6;max-height:120px;min-height:44px;background:var(--surface-2);transition:all .2s;}
.ai-input-area textarea:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-glow);}
.ai-send-btn{width:44px;height:44px;border-radius:var(--radius);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;transition:all .2s;flex-shrink:0;box-shadow:0 2px 8px var(--primary-glow);}
.ai-send-btn:hover{background:linear-gradient(135deg,var(--primary-dark),var(--primary));box-shadow:0 4px 16px var(--primary-glow);transform:translateY(-1px);}
.ai-send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

<script>
/* ========================================================

const MEDICAL_ABBREVIATIONS = {

  'HR': 'Heart Rate 心率',
  'RR': 'Respiratory Rate 呼吸频率',
  'SpO2': 'Oxygen Saturation 血氧饱和度',
  'IV': 'Intravenous 静脉注射',
  'PO': 'Per Os 口服',
  'PRN': 'Pro Re Nata 必要时',
  'BID': 'Bis In Die 每日两次',
  'TID': 'Ter In Die 每日三次',
  'QD': 'Quaque Die 每日一次',
  'QID': 'Quater In Die 每日四次',
  'STAT': 'Statim 立即',

  'DIC': 'Disseminated Intravascular Coagulation 弥散性血管内凝血'

/* ========================================================
   数据层 DB - localStorage 管理
========================================================*/
const DB = {
  KEY: 'paperreader_data',
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? JSON.parse(raw) : null;
    }catch(e){ this.data = null; }
    if(!this.data){
      this.data = { folders:[], documents:[], notes:[], settings:{mode:'intensive', aiConfig:{}} };
      this.save();
    }
    // 确保 aiConfig 存在
    if(!this.data.settings.aiConfig){
      this.data.settings.aiConfig = {};
    }
    return this.data;
  },
  save(){
    localStorage.setItem(this.KEY, JSON.stringify(this.data));
  },
  // 统一更新设置
  updateSettings(partial){
    this.data.settings = { ...this.data.settings, ...partial };
    this.save();
  },
  // 文件夹
  getFolders(){ return this.data.folders; },
  addFolder(name){
    const f = { id:'f'+Date.now(), name, createdAt:Date.now() };
    this.data.folders.push(f); this.save(); return f;
  },
  updateFolder(id, name){
    const f = this.data.folders.find(x=>x.id===id);
    if(f){ f.name=name; this.save(); }
  },
  deleteFolder(id){
    this.data.folders = this.data.folders.filter(x=>x.id!==id);
    this.data.documents = this.data.documents.filter(x=>x.folderId!==id);
    this.save();
  },
  // 文档
  getDocs(folderId){ return this.data.documents.filter(x=>x.folderId===folderId); },
  getDoc(id){ return this.data.documents.find(x=>x.id===id); },
  addDoc(doc){
    doc.id = 'd'+Date.now();
    doc.createdAt = Date.now();
    doc.readProgress = { paraIdx:0, sentIdx:0, percent:0 };
    // 文档元数据：年份、标题
    if(doc.year === undefined) doc.year = '';
    if(doc.studyType === undefined) doc.studyType = '';
    if(doc.titleCn === undefined) doc.titleCn = '';
    this.data.documents.push(doc);
    try{
      this.save();
    }catch(e){
      // 存储空间不足，如果是PDF且有pdfData，去掉后重试
      if(doc.pdfData && e.name === 'QuotaExceededError'){
        doc.pdfData = null;
        this.save();
        console.warn('PDF原版数据过大，已跳过保存pdfData');
        setTimeout(() => Toast.show('PDF文本已保存，原版视图数据过大已跳过'), 500);
      }else{
        throw e;
      }
    }
    return doc;
  },
  updateDoc(id, patch){
    const d = this.getDoc(id);
    if(d){ Object.assign(d, patch); this.save(); }
  },
  deleteDoc(id){
    this.data.documents = this.data.documents.filter(x=>x.id!==id);
    this.save();
  },
  // 生词本
  getNotes(docId){
    return docId ? this.data.notes.filter(x=>x.documentId===docId) : this.data.notes;
  },
  findNote(word){
    return this.data.notes.find(x=>x.word.toLowerCase()===word.toLowerCase());
  },
  addNote(word, translation, context, docId, type){
    // 已存在则更新
    const existing = this.findNote(word);
    if(existing){
      if(translation) existing.translation = translation;
      if(context) existing.context = context;
      if(type) existing.type = type;
      if(!existing.examples) existing.examples = [];
      this.save();
      return existing;
    }
    const n = { id:'n'+Date.now(), word, translation:translation||'', context:context||'', documentId:docId||'', type:type||'word', examples:[], category:'' };
    this.data.notes.push(n); this.save(); return n;
  },
  // 给单词笔记添加例句（句子+翻译）
  addExample(noteId, sentence, translation){
    const n = this.data.notes.find(x=>x.id===noteId);
    if(!n) return;
    if(!n.examples) n.examples = [];
    // 去重：相同句子不重复添加
    const exists = n.examples.find(e=>e.sentence.toLowerCase()===sentence.toLowerCase());
    if(exists){
      // 已存在则更新翻译
      if(translation) exists.translation = translation;
      this.save();
      return exists;
    }
    const ex = { id:'e'+Date.now(), sentence, translation:translation||'' };
    n.examples.push(ex);
    this.save();
    return ex;
  },
  deleteNote(id){
    this.data.notes = this.data.notes.filter(x=>x.id!==id);
    this.save();
  },
  getAllNotes(){ return this.data.notes; }
};

// AI API 调用助手
const AIHelper = {
  // 获取完整的API配置
  getConfig(){
    const config = DB.data.settings.aiConfig || {};
    const providerKey = config.provider || 'siliconflow';
    const provider = AI_PROVIDERS[providerKey] || AI_PROVIDERS.siliconflow;
    
    return {
      provider: providerKey,
      apiKey: config.apiKey || '',
      model: config.model || provider.defaultModel,
      baseUrl: config.baseUrl || provider.baseUrl,
      authType: config.authType || provider.authType,
      apiKeyParam: config.apiKeyParam || provider.apiKeyParam,
      temperature: config.temperature || 0.7,
      maxTokens: config.maxTokens || 2048,
      streaming: config.streaming !== false,
      autoCollapse: config.autoCollapse !== false
    };
  },
  
  // 获取聊天完成API端点
  getChatEndpoint(){
    const config = this.getConfig();
    const baseUrl = config.baseUrl.replace(/\/$/, '');
    
    if(config.provider === 'gemini'){
      return `${baseUrl}/models/${config.model}:generateContent`;
    }
    
    if(config.provider === 'anthropic'){
      return `${baseUrl}/messages`;
    }
    
    return `${baseUrl}/chat/completions`;
  },
  
  // 构建请求头
  getHeaders(){
    const config = this.getConfig();
    const headers = {
      'Content-Type': 'application/json'
    };
    
    if(!config.apiKey) return headers;
    
    if(config.authType === 'bearer'){
      headers['Authorization'] = `Bearer ${config.apiKey}`;
    }else if(config.authType === 'api-key'){
      // API key作为查询参数或特殊header
    }
    
    if(config.provider === 'anthropic'){
      headers['anthropic-version'] = '2023-06-01';
    }
    
    return headers;
  },
  
  // 构建请求体
  buildRequestBody(messages, options = {}){
    const config = this.getConfig();
    const {
      model = config.model,
      temperature = config.temperature,
      maxTokens = config.maxTokens,
      stream = config.streaming,
      system = ''
    } = options;
    
    if(config.provider === 'gemini'){
      return {
        contents: messages.map(m => {
          // 数组内容（vision）：转为文本 + inline_data
          const parts = [];
          if(Array.isArray(m.content)){
            m.content.forEach(p => {
              if(p.type === 'text') parts.push({ text: p.text });
              else if(p.type === 'image_url' && p.image_url?.url){
                const mm = p.image_url.url.match(/^data:([^;]+);base64,(.+)$/);
                if(mm) parts.push({ inline_data: { mime_type: mm[1], data: mm[2] } });
              }
            });
          }else{
            parts.push({ text: String(m.content || '') });
          }
          return {
            role: m.role === 'user' ? 'user' : 'model',
            parts
          };
        }),
        generationConfig: {
          temperature,
          maxOutputTokens: maxTokens
        }
      };
    }

    if(config.provider === 'anthropic'){
      return {
        model,
        messages: messages.slice(-10).map(m => {
          // 数组内容（vision）：转为 anthropic 格式
          if(Array.isArray(m.content)){
            const blocks = m.content.map(p => {
              if(p.type === 'text') return { type: 'text', text: p.text };
              if(p.type === 'image_url' && p.image_url?.url){
                const mm = p.image_url.url.match(/^data:([^;]+);base64,(.+)$/);
                if(mm) return { type: 'image', source: { type: 'base64', media_type: mm[1], data: mm[2] } };
              }
              return { type: 'text', text: '' };
            });
            return { role: m.role, content: blocks };
          }
          return { role: m.role, content: m.content };
        }),
        max_tokens: maxTokens,
        temperature,
        stream
      };
    }
    
    const body = {
      model,
      messages,
      temperature,
      max_tokens: maxTokens,
      stream
    };
    
    if(system && messages[0]?.role !== 'system'){
      body.messages.unshift({ role: 'system', content: system });
    }

    return body;
  },

  // 判断当前模型是否可能支持视觉（多模态图片输入）
  // 启发式：模型名包含 gpt-4o / gpt-4-vision / gpt-4-turbo / vision / vl / image / qwen-vl / glm-4v / claude-3 / gemini 等关键字
  supportsVision(){
    const config = this.getConfig();
    const m = (config.model || '').toLowerCase();
    if(/gpt-4o|gpt-4\.o|gpt-4-vision|gpt-4-turbo|gpt-4\.\d|vision|multimodal|\bvl\b|qwen-vl|qwen2-vl|qwenvl|glm-4v|glm-4\.6|claude-3|claude-sonnet|claude-opus|claude-haiku|gemini|deepseek-vl|step-1v|step-1x|yi-vl|llava|internvl|cogvlm/i.test(m)){
      return true;
    }
    return false;
  },

  // 构建带图片的 user 消息内容（OpenAI vision 格式）
  // figures: [{dataUrl, caption, mime}]
  // 返回数组内容（若模型不支持视觉或无图，则返回纯文本字符串）
  buildVisionContent(text, figures){
    if(!figures || figures.length === 0 || !this.supportsVision()){
      return text; // 纯文本
    }
    const content = [];
    if(text) content.push({ type: 'text', text });
    // 限制图片数量，避免请求过大
    const maxImgs = 6;
    figures.slice(0, maxImgs).forEach((f, i) => {
      if(!f.dataUrl) return;
      content.push({
        type: 'text',
        text: `（文档图表 ${i + 1}：${f.caption || ''}）`
      });
      content.push({
        type: 'image_url',
        image_url: { url: f.dataUrl }
      });
    });
    return content;
  },

  // 从message/delta中提取文本（兼容字符串、数组、对象格式）
  extractMsgText(msg){
    if(!msg) return '';
    if(typeof msg === 'string') return msg;
    if(Array.isArray(msg)){
      return msg.map(p => {
        if(typeof p === 'string') return p;
        if(p?.text) return p.text;
        if(p?.output_text) return p.output_text;
        if(p?.reasoning_content) return p.reasoning_content;
        return '';
      }).join('');
    }
    if(typeof msg === 'object'){
      return msg.text || msg.output_text || msg.reasoning_content || '';
    }
    return String(msg);
  },

  // 解析流式响应
  async *parseStream(response){
    const config = this.getConfig();
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream: true });
      
      if(config.provider === 'gemini'){
        // Gemini SSE格式
        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';
        for(const part of parts){
          if(part.startsWith('data: ')){
            const jsonStr = part.slice(6);
            if(jsonStr === '[DONE]') continue;
            try{
              const json = JSON.parse(jsonStr);
              const text = this.extractMsgText(json.candidates?.[0]?.content?.parts);
              if(text) yield text;
            }catch(e){}
          }
        }
      }else{
        // 标准OpenAI兼容格式
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed || !trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if(data === '[DONE]') continue;
          try{
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta;
            if(delta){
              const text = this.extractMsgText(delta.content);
              if(text) yield text;
            }
          }catch(e){}
        }
      }
    }
  },
  
  // 获取完整响应
  async getFullResponse(response){
    const config = this.getConfig();
    const data = await response.json();
    
    if(config.provider === 'gemini'){
      return this.extractMsgText(data.candidates?.[0]?.content?.parts);
    }
    
    if(config.provider === 'anthropic'){
      return this.extractMsgText(data.content);
    }
    
    return this.extractMsgText(data.choices?.[0]?.message?.content);
  },
  
  // 测试连接
  async testConnection(config){
    const finalConfig = config || this.getConfig();
    if(!finalConfig.apiKey) return { success: false, message: '请输入API Key' };
    
    let endpoint;
    let body;
    
    if(finalConfig.provider === 'gemini'){
      endpoint = `${finalConfig.baseUrl.replace(/\/$/, '')}/models/${finalConfig.model}:generateContent?key=${finalConfig.apiKey}`;
      body = JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: 'Hello' }] }],
        generationConfig: { maxOutputTokens: 10 }
      });
    }else{
      const helperConfig = { ...this.getConfig(), ...finalConfig };
      endpoint = AIHelper._getEndpoint(helperConfig);
      body = JSON.stringify({
        model: helperConfig.model,
        messages: [{ role: 'user', content: 'Hello' }],
        max_tokens: 10
      });
    }
    
    try{
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: AIHelper._getHeaders(finalConfig),
        body
      });
      
      if(response.ok){
        return { success: true, message: '连接成功！' };
      }
      const err = await response.json().catch(() => ({}));
      return { success: false, message: err.error?.message || err.message || `请求失败: ${response.status}` };
    }catch(e){
      return { success: false, message: e.message };
    }
  },
  
  // 内部方法：获取端点
  _getEndpoint(config){
    const baseUrl = config.baseUrl.replace(/\/$/, '');
    if(config.provider === 'gemini'){
      return `${baseUrl}/models/${config.model}:generateContent`;
    }
    if(config.provider === 'anthropic'){
      return `${baseUrl}/messages`;
    }
    return `${baseUrl}/chat/completions`;
  },
  
  // 内部方法：获取headers
  _getHeaders(config){
    const headers = { 'Content-Type': 'application/json' };
    if(!config.apiKey) return headers;
    
    if(config.authType === 'bearer'){
      headers['Authorization'] = `Bearer ${config.apiKey}`;
    }
    
    if(config.provider === 'anthropic'){
      headers['anthropic-version'] = '2023-06-01';
    }
    
    return headers;
  }
};

        </div>
      </div>`;
    }).join('');
  },
  importDoc(){
    const input = document.getElementById('file-input');
    if(!input) return;
    // 每次点击前重置，保证安卓上连续选择同一文件也能触发 onchange
    input.value = '';
    // 部分安卓浏览器对 accept 多格式支持有差异（可能显示空文件列表），
    // 这里不设 accept 让文件管理器显示全部文件，实际格式在 onchange 里按扩展名校验并提示。
    if(input.hasAttribute('accept')) input.removeAttribute('accept');
    input.onchange = (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const name = file.name || '';
      const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
      if(ext==='pdf'){
        this.parsePdf(file);
      }else if(ext==='docx'){
        this.parseDocx(file);
      }else if(ext==='txt' || ext==='text'){
        this.parseTxt(file);
      }else if(ext==='doc'){
        Toast.show('.doc 格式不支持直接解析，请先转换为 .docx 或 .txt');
      }else if(ext==='html' || ext==='htm'){
        this.parseHtml(file);
      }else{
        Toast.show('仅支持 pdf / docx / txt / html 格式（已选择：' + (ext ? '.'+ext : '无扩展名') + '）');
      }
    };
    // 用户手势内同步调用 click()：安卓 Chrome/Edge 可正常唤起系统文件管理器
    try{
      input.click();
    }catch(err){
      Toast.show('无法打开文件选择器，请重试或在系统浏览器中打开');
    }
  },
  async parseDocx(file){
    Toast.show('正在解析文档...');
    try{
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer});
      const content = result.value;
      if(!content.trim()){ Toast.show('文档内容为空'); return; }
      this.saveDoc(file.name, content, 'txt');
    }catch(err){
      Toast.show('解析失败: '+err.message);
    }
  },
  parseTxt(file){
    Toast.show('正在读取文档...');
    const reader = new FileReader();
    reader.onload = (e)=>{
      const content = e.target.result;
      if(!content.trim()){ Toast.show('文档内容为空'); return; }
      this.saveDoc(file.name, content);
    };
    reader.readAsText(file, 'UTF-8');
  },
  // 解析HTML文件
  parseHtml(file){
    Toast.show('正在读取文档...');
    const reader = new FileReader();
    reader.onload = (e)=>{
      const content = e.target.result;
      if(!content.trim()){ Toast.show('文档内容为空'); return; }
      // 提取纯文本用于段落分析
      const textContent = Parser.extractTextFromHtml(content);
      if(!textContent.trim()){
        // 如果HTML没有可提取的文本，用原始内容占位
        const paragraphs = ['[HTML 文档]'];
        const doc = DB.addDoc({
          folderId: this.currentFolderId,
          name: file.name.replace(/\.(html?|docx?|txt)$/i,''),
          content,
          rawHtml: content,
          type: 'html',
          paragraphs
        });
        this.render();
        Toast.show('文档导入成功（纯HTML，无文本段落）');
        return;
      }
      const paragraphs = Parser.splitParagraphs(textContent);
      const doc = DB.addDoc({
        folderId: this.currentFolderId,
        name: file.name.replace(/\.(html?|docx?|txt)$/i,''),
        content,
        rawHtml: content,
        type: 'html',
        paragraphs
      });
      this.render();
      Toast.show('文档导入成功');
    };
    reader.readAsText(file, 'UTF-8');
  },
  // 解析PDF文件
  async parsePdf(file){
    Toast.show('正在解析PDF文档...');
    try{
      if(typeof pdfjsLib === 'undefined'){
        Toast.show('PDF解析库未加载，请刷新页面重试');
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const arrayBuffer = await file.arrayBuffer();
      // 克隆一份 arrayBuffer，因为 pdf.js 会 detach 原始 buffer（传输给 Worker）
      const arrayBufferClone = arrayBuffer.slice(0);
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pageCount = pdf.numPages;
      Toast.show(`正在解析PDF... 共${pageCount}页`);
      let allLines = [];
      let prevPageLastY = null;
      for(let i = 1; i <= pageCount; i++){
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const viewport = page.getViewport({ scale: 1 });
        const pageHeight = viewport.height;
        const pageWidth = viewport.width;
        const lines = [];
        let lastY = null;
        for(const item of textContent.items){
          if(item.str && item.str.trim()){
            const x = item.transform[4];
            const w = item.width || 0;
            lines.push({
              text: item.str.trim(),
              x: x,
              y: item.transform[5],
              width: w,
              endX: x + w,
              pageNum: i,
              pageWidth: pageWidth,
              pageHeight: pageHeight
            });
          }
        }
        lines.sort((a,b)=> b.y - a.y);
        allLines = allLines.concat(lines);
      }
      if(allLines.length === 0){
        Toast.show('PDF内容为空或为扫描件，无法解析');
        return;
      }
      const content = this.groupPdfLinesToParagraphs(allLines);
      if(!content.trim()){
        Toast.show('PDF解析失败：未能提取有效文本');
        return;
      }
      const paragraphs = this.splitPdfParagraphs(content);
      const docName = file.name.replace(/\.pdf$/i,'');
      const pdfDataBase64 = this.arrayBufferToBase64(arrayBufferClone);
      const doc = DB.addDoc({
        folderId: this.currentFolderId,
        name: docName,
        content,
        type: 'pdf',
        paragraphs,
        pageCount,
        pdfData: pdfDataBase64
      });
      this.render();
      Toast.show(`PDF导入成功：${pageCount}页 · ${paragraphs.length}段`);
    }catch(err){
      console.error('PDF解析错误:', err);
      // 如果是存储空间不足，尝试不保存 pdfData 重试
      if(err && (err.name === 'QuotaExceededError' || err.message?.includes('quota') || err.message?.includes('exceeded'))){
        Toast.show('PDF文本解析成功，但文件过大无法保存原版视图数据');
      }else{
        Toast.show('PDF解析失败: ' + (err.message || '未知错误'));
      }
    }
  },
  // ArrayBuffer转Base64（用于存储PDF原始数据）
  arrayBufferToBase64(buffer){
    const bytes = new Uint8Array(buffer);
    let binary = '';
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      const chunk = bytes.subarray(i, i + chunkSize);
      binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
  },
  // Base64转ArrayBuffer（用于恢复PDF原始数据）
  base64ToArrayBuffer(base64){
    const binary = atob(base64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
  },
  // 将PDF的逐行文本智能分组成段落（支持多列排版）
  groupPdfLinesToParagraphs(lines){
    if(lines.length === 0) return '';
    // 按页分组
    const byPage = {};
    for(const line of lines){
      if(!byPage[line.pageNum]) byPage[line.pageNum] = [];
      byPage[line.pageNum].push(line);
    }
    const pageNumbers = Object.keys(byPage).map(Number).sort((a,b)=>a-b);
    let result = [];
    let currentPara = [];
    for(const pageNum of pageNumbers){
      const pageLines = byPage[pageNum];
      const pageWidth = pageLines[0]?.pageWidth || 600;
      // 检测多列排版，返回按列分组的行（列从左到右）
      const columns = this.detectPdfColumns(pageLines, pageWidth);
      for(let ci = 0; ci < columns.length; ci++){
        // 列内按 y 从上到下排序
        const col = [...columns[ci]].sort((a,b)=> b.y - a.y);
        for(let li = 0; li < col.length; li++){
          const line = col[li];
          const nextLine = col[li + 1]; // 只与同列下一行比较
          currentPara.push(line.text);
          if(!nextLine){
            // 列末尾：强制断段（避免跨列合并）
            if(currentPara.length) result.push(currentPara.join(' '));
            currentPara = [];
            break;
          }
          // 同列内：用 y 间距 + 句子结束符判断段落边界
          const gap = line.y - nextLine.y;
          const avgY = (line.y + nextLine.y) / 2;
          const relativeGap = gap / Math.max(avgY, 100);
          const lineLen = line.text.length;
          const isEndOfSentence = /[.!?;:]$/.test(line.text.trim());
          const isHeaderLike = lineLen < 8 && !/[.!?]$/.test(line.text) && /^[A-Z]/.test(line.text);
          const significantGap = relativeGap > 0.06;
          if(significantGap && (isEndOfSentence || lineLen > 40 || isHeaderLike)){
            result.push(currentPara.join(' '));
            currentPara = [];
          }
        }
      }
    }
    return result.join('\n\n');
  },
  // 检测PDF页面的多列排版：基于x坐标占用直方图寻找垂直空白通道
  // 返回按列分组的行数组（每列内未排序，由调用方排序）
  detectPdfColumns(pageLines, pageWidth){
    if(pageLines.length === 0) return [pageLines];
    const resolution = 4; // 4px 一个桶
    const buckets = Math.ceil(pageWidth / resolution) + 2;
    const histogram = new Array(buckets).fill(0);
    for(const line of pageLines){
      const startB = Math.max(0, Math.floor((line.x || 0) / resolution));
      const endX = line.endX || (line.x + (line.width || 0));
      const endB = Math.min(buckets - 1, Math.floor(endX / resolution));
      for(let b = startB; b <= endB; b++) histogram[b]++;
    }
    // 找内容区域边界
    let firstNonZero = -1, lastNonZero = -1;
    for(let i = 0; i < buckets; i++){
      if(histogram[i] > 0){
        if(firstNonZero === -1) firstNonZero = i;
        lastNonZero = i;
      }
    }
    if(firstNonZero === -1) return [pageLines];
    // 在内容区域寻找垂直空白通道（至少占页面宽度 4%）
    // 使用相对阈值而非严格为0，以容忍页眉/页脚/跨栏标题穿越列分隔线
    const nonZeroValues = histogram.slice(firstNonZero, lastNonZero + 1).filter(v => v > 0);
    const avgOccupancy = nonZeroValues.reduce((s,v)=>s+v,0) / Math.max(1, nonZeroValues.length);
    const gapThreshold = Math.max(1, avgOccupancy * 0.15); // 低于平均占用15%视为空白
    const minGapBuckets = Math.max(2, Math.floor(buckets * 0.04));
    const gaps = [];
    let gapStart = -1;
    for(let i = firstNonZero; i <= lastNonZero + 1; i++){
      const isEmpty = i <= lastNonZero && histogram[i] <= gapThreshold;
      if(isEmpty){
        if(gapStart === -1) gapStart = i;
      }else{
        if(gapStart !== -1){
          const gapEnd = i - 1;
          if(gapEnd - gapStart + 1 >= minGapBuckets){
            gaps.push({
              start: gapStart * resolution,
              end: gapEnd * resolution,
              mid: (gapStart + gapEnd + 1) / 2 * resolution,
              width: (gapEnd - gapStart + 1) * resolution
            });
          }
          gapStart = -1;
        }
      }
    }
    if(gaps.length === 0) return [pageLines];
    // 过滤掉过窄的间隙（噪声），保留真正的列分隔
    // 列分隔间隙通常较宽，按宽度降序取前几个
    gaps.sort((a,b)=> b.width - a.width);
    // 最多取3个间隙（4列），足够覆盖绝大多数论文排版
    const cutPoints = gaps.slice(0, 3).map(g => g.mid).sort((a,b)=>a-b);
    const columns = [];
    for(let i = 0; i <= cutPoints.length; i++){
      const left = i === 0 ? -Infinity : cutPoints[i-1];
      const right = i === cutPoints.length ? Infinity : cutPoints[i];
      const col = pageLines.filter(l => (l.x || 0) >= left && (l.x || 0) < right);
      if(col.length > 0) columns.push(col);
    }
    return columns.length > 0 ? columns : [pageLines];
  },
  // PDF段落分割（带智能容错）
  splitPdfParagraphs(content){
    const paras = content.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>0);
    if(paras.length <= 1){
      return content.split(/\n/).map(p=>p.trim()).filter(p=>p.length>0);
    }
    return paras;
  },
  saveDoc(name, content, type){
    const paragraphs = Parser.splitParagraphs(content);
    const doc = DB.addDoc({
      folderId: this.currentFolderId,
      name: name.replace(/\.(docx?|txt|pdf)$/i,''),
      content,
      type: type || 'txt',
      paragraphs
    });
    this.render();
    Toast.show('文档导入成功');
  },
  remove(id){
    const d = DB.getDoc(id);
    Modal.show('删除文档', `<p>确定删除「${HomeView.esc(d.name)}」吗？</p>`, [
      {text:'取消', class:'btn', action:()=>Modal.hide()},
      {text:'删除', class:'btn btn-danger', action:()=>{
        DB.deleteDoc(id); Modal.hide(); this.render(); Toast.show('已删除');
      }}
    ]);
  },
};

  // 常见动词（过去式/过去分词/原形）
  COMMON_VERBS: new Set([

gated','investigate','investigates','investigating','evaluated','evaluate','evaluates','evaluating','determined','determine','determines','determining','established','establish','establishes','establishing','identified','identify','identifies','identifying','detected','detect','detects','detecting'
