  // 判断是否为名词
  isLikelyNoun(token){
    const w = token.lower;
    if(this.ARTICLES.has(w)) return true;
    if(this.COMMON_NOUNS.has(w)) return true;
    if(/(?:tion|ment|ness|ity|ism|ist|ship|hood|ance|ence|dom|sis|ure)$/.test(w) && w.length > 4) return true;
    if(/(?:er|or)$/.test(w) && w.length > 4 && !this.COMMON_VERBS.has(w)) return true;
    if(/s$/.test(w) && !/ss$|us$|is$|as$/.test(w) && w.length > 3){
      if(!this.COMMON_VERBS.has(w) && !this.AUX_VERBS.has(w) && !this.COPULAS.has(w)) return true;
    }
    return false;
  },

  // 判断是否为动词
  isLikelyVerb(token){
    const w = token.lower;
    if(this.COMMON_VERBS.has(w)) return true;
    if(this.AUX_VERBS.has(w) || this.COPULAS.has(w)) return true;
    if(/(?:ed|ing)$/.test(w) && w.length > 4){
      if(!this.COMMON_NOUNS.has(w)) return true;
    }
    if(/(?:ize|ise|ify|ate)$/.test(w) && w.length > 4) return true;
    return false;
  },

  // 判断是否为形容词
  isLikelyAdjective(token){
    const w = token.lower;
    if(/(?:al|ive|ous|ful|less|able|ible|ic|ish)$/.test(w) && w.length > 4) return true;
    if(/(?:er|est)$/.test(w) && w.length > 4) return true;
    return false;
  },

  // 判断是否为"核心名词"（可作为短语中心语的候选）
  _isCoreNoun(token){
    const w = token.lower;
    const baseWord = w.replace(/'s$/, '');
    if(baseWord.length <= 1) return false;
    if(/[0-9]/.test(w)) return false;
    if(this.ARTICLES.has(w)) return false;
    if(this.PREPOSITIONS.has(w)) return false;
    if(this.COPULAS.has(w) || this.AUX_VERBS.has(w)) return false;
    if(this.COMMON_NOUNS.has(baseWord) || this.COMMON_NOUNS.has(w)) return true;
    if(this.COMMON_VERBS.has(w) && !this.COMMON_NOUNS.has(w)) return false;
    if(/(?:tion|ment|ness|ity|ism|ist|ship|hood|ance|ence|dom|sis|ure|age|cy)$/.test(baseWord) && baseWord.length > 3) return true;
    if(/(?:er|or|ee)$/.test(baseWord) && baseWord.length > 3 && !this.COMMON_VERBS.has(baseWord)) return true;
    if(/s$/.test(baseWord) && !/ss$|us$|is$|as$/.test(baseWord) && baseWord.length > 3){
      if(!this.COMMON_VERBS.has(baseWord)) return true;
    }
    if(baseWord.length > 3 && !this.isLikelyVerb(token) && !this.isLikelyAdjective(token)) return true;
    return false;
  },

  // 从tokens中找下一个谓语动词索引（辅助splitClauses）
  _findNextVerb(tokens, start){
    for(let i = start; i < tokens.length; i++){
      const w = tokens[i].lower;
      if(this.COPULAS.has(w) || this.AUX_VERBS.has(w)) return i;
      if(this.COMMON_VERBS.has(w) && !this.COMMON_NOUNS.has(w)) return i;
      if(/ed$/.test(w) && w.length > 4 && this.COMMON_VERBS.has(w) && !this.COMMON_NOUNS.has(w)) return i;
    }
    return -1;
  },

  // 提取名词短语的中心语（head word）
  extractHeadWord(text){
    if(!text || text.length < 2) return null;
    let cleaned = text.replace(/\s*\([^)]*\)/g, '');
    cleaned = cleaned.replace(/\s*\[[^\]]*\]/g, '');
    if(!cleaned.trim()) cleaned = text;
    const tokens = [];
    const regex = /([A-Za-z][A-Za-z'-]*(?:\.[A-Za-z]+)?)|([0-9]+(?:\.[0-9]+)?%)|([0-9]+(?:\.[0-9]+)?)|([,;:()\-–—.])|(\s+)/g;
    let match;
    while((match = regex.exec(cleaned)) !== null){
      if(match[5]) continue;
      const word = match[0];
      tokens.push({ text: word, start: match.index, end: match.index + word.length, lower: word.toLowerCase() });
    }
    if(tokens.length === 0) return null;
    let effectiveTokens = tokens;
    for(let i = 0; i < tokens.length; i++){
      const w = tokens[i].lower;
      if(['who','which','whom','whose','that'].includes(w) && i > 0 && this._isCoreNoun(tokens[i-1])){
        effectiveTokens = tokens.slice(0, i);
        break;
      }
    }
    const prepIndices = [];
    for(let i = 0; i < effectiveTokens.length; i++){
      if(this.PREPOSITIONS.has(effectiveTokens[i].lower)) prepIndices.push(i);
    }
    const getNearestPrepLeft = (idx) => {
      let nearest = -1;
      for(const pIdx of prepIndices){
        if(pIdx < idx) nearest = pIdx;
        else break;
      }
      return nearest;
    };
    let rightmostNounIdx = -1;
    for(let i = effectiveTokens.length - 1; i >= 0; i--){
      const t = effectiveTokens[i];
      if(/[,;:.]/.test(t.text)) continue;
      const nearestPrep = getNearestPrepLeft(i);
      if(nearestPrep >= 0) continue;
      if(this._isCoreNoun(t)){ rightmostNounIdx = i; break; }
    }
    if(rightmostNounIdx < 0) return null;
    let startIdx = rightmostNounIdx;
    while(startIdx - 2 >= 0){
      const conj = effectiveTokens[startIdx - 1].lower;
      if(!['and','or','nor'].includes(conj)) break;
      if(!this._isCoreNoun(effectiveTokens[startIdx - 2])) break;
      startIdx -= 2;
    }
    const startPos = effectiveTokens[startIdx].start;
    const endPos = effectiveTokens[rightmostNounIdx].end;
    return cleaned.substring(startPos, endPos);
  },

  // 主分析入口
  analyze(sentence){
    const text = sentence.trim();
    if(!text) return this.emptyResult();
    this.originalText = text;  // 供reconstructText使用

    // 1. 词元化（保留位置）
    const tokens = this.tokenize(text);
    if(tokens.length < 3) return this.simpleResult(text, tokens);

    // 2. 识别从句边界
    const clauses = this.splitClauses(text, tokens);

    // 3. 对每个从句做成分分析
    const components = [];
    // clausedepth基于从句数量：1个从句=简单句，多个=复合句
    let clausedepth = clauses.length > 1 ? 2 : 1;
    for(const clause of clauses){
      const analyzed = this.analyzeClause(clause);
      if(analyzed){
        components.push(analyzed);
      }
    }

    // 4. 提取主干
    const main = this.extractMainClause(components);
    const structure = this.describeStructure(components, clausedepth);
    const tip = this.generateTip(text, components, clausedepth);

    return { main, structure, components, clausedepth, tip };
  },

  // 词元化：保留原文片段 + 词性标注
  tokenize(text){
    const tokens = [];
    // 捕获组: 1=单词 2=百分比 3=数字 4=标点 5=空白
    const regex = /([A-Za-z][A-Za-z'-]*(?:\.[A-Za-z]+)?)|([0-9]+(?:\.[0-9]+)?%)|([0-9]+(?:\.[0-9]+)?)|([,;:()\-–—.])|(\s+)/g;
    let match;
    while((match = regex.exec(text)) !== null){
      if(match[5]) continue; // 跳过纯空白（第5组）
      const word = match[0];
      tokens.push({
        text: word,
        start: match.index,
        end: match.index + word.length,
        lower: word.toLowerCase()
      });
    }
    return tokens;
  },

  // 从句切分：基于从属连词、逗号和关系代词
  splitClauses(text, tokens){
    const conjPositions = [];
    const conjRegex = new RegExp(this.SUBORD_CONJ.source, 'gi');
    let m;
    while((m = conjRegex.exec(text)) !== null){
      conjPositions.push({ start: m.index, conj: m[0].toLowerCase() });
    }

    if(conjPositions.length === 0){
      return [{ text: text, type: 'main', conj: null }];
    }

    // 特殊处理：句首是状语从句引导词（although/while/because/if/when等）
    // 在第一个逗号处切分从句和主句
    const ADV_CONJS = ['although','though','while','whereas','because','since','as','if','unless','when','before','after','until','once','where'];
    const firstConj = conjPositions[0];
    if(firstConj.start === 0 && ADV_CONJS.includes(firstConj.conj)){
      const commaIdx = text.indexOf(',');
      if(commaIdx > 0){
        const advText = text.substring(0, commaIdx).trim();
        const mainText = text.substring(commaIdx + 1).trim();
        const clauses = [];
        if(advText) clauses.push({ text: advText, type: 'adverbial', conj: firstConj.conj });
        if(mainText) clauses.push({ text: mainText, type: 'main', conj: null });
        return clauses;
      }
    }

    // 一般情况：按从属连词切分
    // 策略：that引导宾语从句延伸到句末；who/which引导定语从句延伸到句末或逗号
    const clauses = [];
    let lastEnd = 0;
    // 跟踪上一个that/whether宾语从句的范围，避免嵌套的who/which重复切分
    let lastThatRange = null;
    for(let i = 0; i < conjPositions.length; i++){
      const cp = conjPositions[i];
      // 如果who/which嵌套在that宾语从句内且无逗号分隔，跳过（作为宾语从句的嵌套子成分）
      if(['who','which','whom','whose'].includes(cp.conj) && lastThatRange &&
         cp.start > lastThatRange.start && cp.start < lastThatRange.end){
        const commaBefore = text.lastIndexOf(',', cp.start);
        if(commaBefore < lastThatRange.start){
          continue;
        }
      }
      // 主句部分（从上一个切分点到这个连词前）
      if(cp.start > lastEnd){
        let mainText = text.substring(lastEnd, cp.start).replace(/[,;]\s*$/, '').trim();
        if(mainText) clauses.push({ text: mainText, type: 'main', conj: null, start: lastEnd });
      }
      // 从句部分
      let nextStart;
      if(['that','whether'].includes(cp.conj)){
        nextStart = text.length;
        lastThatRange = { start: cp.start, end: nextStart };
      } else if(['who','which','whom','whose','where','when','why'].includes(cp.conj)){
        const commaAfter = text.indexOf(',', cp.start + 1);
        const nextConj = i + 1 < conjPositions.length ? conjPositions[i+1].start : text.length;
        let defaultEnd = (commaAfter > 0 && commaAfter < nextConj) ? commaAfter : nextConj;
        // 特殊处理：定语从句who/which后若出现第二个谓语，切分在第二个谓语前
        if(['who','which','whom','whose'].includes(cp.conj)){
          const subText = text.substring(cp.start, defaultEnd);
          const subTokens = this.tokenize(subText);
          const firstVerb = this._findNextVerb(subTokens, 1);
          if(firstVerb > 0){
            const secondVerb = this._findNextVerb(subTokens, firstVerb + 1);
            if(secondVerb > 0){
              defaultEnd = cp.start + subTokens[secondVerb].start;
            }
          }
        }
        nextStart = defaultEnd;
      } else {
        nextStart = i + 1 < conjPositions.length ? conjPositions[i+1].start : text.length;
      }
      let clauseText = text.substring(cp.start, nextStart).replace(/[,;]\s*$/, '').trim();
      if(clauseText) clauses.push({ text: clauseText, type: 'subordinate', conj: cp.conj, start: cp.start });
      lastEnd = nextStart;
    }
    if(lastEnd < text.length){
      const rest = text.substring(lastEnd).replace(/[,;]\s*$/, '').trim();
      if(rest) clauses.push({ text: rest, type: 'main', conj: null, start: lastEnd });
    }

    // 标记句首状语从句
    if(clauses.length > 0 && clauses[0].type === 'subordinate'){
      const fc = clauses[0].conj;
      if(ADV_CONJS.includes(fc) || ['than'].includes(fc)){
        clauses[0].type = 'adverbial';
      }
    }

    return clauses;
  },

  // 分析单个从句的成分
  analyzeClause(clause){
    const text = clause.text.trim();
    if(!text) return null;

    // 为当前从句创建独立的token上下文（位置相对于从句文本）
    const tokens = this.tokenize(text);
    if(tokens.length === 0) return null;

    // 临时保存当前从句原文，供reconstructText使用
    const savedOriginal = this.originalText;
    this.originalText = text;

    // 识别谓语动词短语
    const verbPhrase = this.findVerbPhrase(tokens);
    let subject = null, object = null, adverbials = [];
    if(verbPhrase){
      // 识别主语（谓语前的名词短语）
      subject = this.findSubject(tokens, verbPhrase);
      // 识别宾语/表语（谓语后的名词短语）
      object = this.findObject(text, tokens, verbPhrase, subject);
      // 识别状语（介词短语、副词等）
      adverbials = this.findAdverbials(text, tokens, [subject, verbPhrase, object].filter(Boolean));
    } else {
      // 无动词句子：作为名词短语处理（整体作主语/名词短语）
      subject = { text: text };
    }

    // 恢复原文引用
    this.originalText = savedOriginal;

    const component = {
      text: text,
      role: '',
      type: '',
      desc: '',
      children: []
    };

    // 根据从句类型设置角色
    if(clause.type === 'subordinate' || clause.type === 'adverbial'){
      const conjLabel = this.getConjLabel(clause.conj);
      component.role = conjLabel;
      component.type = this.getConjType(clause.conj);
      component.desc = `由${clause.conj}引导的${conjLabel}，修饰主句`;
    } else {
      component.role = '主句';
      component.type = 'MainClause';
      component.desc = '句子的核心主干';
    }

    // 填充children（含中心语提取）
    if(subject){
      const headWord = this.extractHeadWord(subject.text);
      component.children.push({
        text: subject.text,
        role: '主语',
        type: 'Subject',
        desc: '动作的执行者或被描述对象',
        head: headWord,
        children: []
      });
    }
    if(verbPhrase){
      const isCopula = this.COPULAS.has(verbPhrase.mainVerb.lower);
      component.children.push({
        text: verbPhrase.text,
        role: isCopula ? '系动词' : '谓语',
        type: 'Verb',
        desc: isCopula ? '连接主语和表语' : '表示动作或状态',
        children: []
      });
    }
    if(object){
      const isCopula = verbPhrase && this.COPULAS.has(verbPhrase.mainVerb.lower);
      const headWord = this.extractHeadWord(object.text);
      component.children.push({
        text: object.text,
        role: isCopula ? '表语' : '宾语',
        type: isCopula ? 'Predicative' : 'Object',
        desc: isCopula ? '说明主语的特征或状态' : '动作的承受者',
        head: headWord,
        children: []
      });
    }
    for(const adv of adverbials){
      component.children.push(adv);
    }

    return component;
  },

  // 查找谓语动词短语（优先识别助动词/系动词）
  findVerbPhrase(tokens){
    let startIdx = 0;
    if(tokens[0] && this.isSubordConj(tokens[0].lower)){
      startIdx = 1;
    }

    // 跳过定语从句 who/which + had/have/has + been + 过去分词
    let skipEnd = -1;
    for(let i = startIdx; i < tokens.length - 3; i++){
      if(['who','which','that'].includes(tokens[i].lower) &&
         ['had','have','has'].includes(tokens[i+1].lower) &&
         tokens[i+2].lower === 'been'){
        let j = i + 3;
        while(j < tokens.length && /ly$/.test(tokens[j].lower) && tokens[j].lower.length > 3) j++;
        if(j < tokens.length && /ed$/.test(tokens[j].lower) && tokens[j].lower.length > 4) j++;
        skipEnd = j;
        break;
      }
    }

    // 策略1：寻找助动词或系动词（最可靠）
    let auxIdx = -1;
    for(let i = startIdx; i < tokens.length; i++){
      if(i < skipEnd) continue;
      const w = tokens[i].lower;
      if(this.AUX_VERBS.has(w) || this.COPULAS.has(w)){
        auxIdx = i;
        break;
      }
      if(tokens[i].text === ',') break;
    }

    if(auxIdx >= 0){
      const auxWord = tokens[auxIdx].lower;
      const isCopula = this.COPULAS.has(auxWord);

      // 系动词：检查是否是被动语态（系动词 + 过去分词）
      if(isCopula){
        if(auxIdx + 1 < tokens.length){
          const nextTok = tokens[auxIdx + 1];
          const nextWord = nextTok.lower;
          const isPastParticiple = (/ed$/.test(nextWord) && nextWord.length > 4 && this.COMMON_VERBS.has(nextWord)) || nextWord === 'been';
          if(isPastParticiple){
            const phraseEnd = auxIdx + 2;
            const text = this.reconstructText(tokens, auxIdx, phraseEnd);
            return { text, mainVerb: nextTok, start: auxIdx, end: phraseEnd };
          }
        }
        const text = this.reconstructText(tokens, auxIdx, auxIdx + 1);
        return { text, mainVerb: tokens[auxIdx], start: auxIdx, end: auxIdx + 1 };
      }

      // 助动词：继续找实义动词
      let mainVerbIdx = auxIdx;
      for(let i = auxIdx + 1; i < tokens.length; i++){
        const t = tokens[i];
        const w = t.lower;
        if(this.AUX_VERBS.has(w)) { mainVerbIdx = i; continue; }
        if(w === 'not' || w === "n't") continue;
        if(/ly$/.test(w) && w.length > 3) continue;
        if(t.text === '-' || t.text === '–' || t.text === '—') continue;
        if(this.ARTICLES.has(w)) break;
        if(this.PREPOSITIONS.has(w)) break;
        if(this.isSubordConj(w)) break;
        if(t.text === ',') break;
        mainVerbIdx = i;
        break;
      }
      const phraseStart = auxIdx;
      const phraseEnd = mainVerbIdx + 1;
      const text = this.reconstructText(tokens, phraseStart, phraseEnd);
      return { text, mainVerb: tokens[mainVerbIdx], start: phraseStart, end: phraseEnd };
    }

    // 策略2：没有助动词/系动词，扫描找第一个动词
    for(let i = startIdx; i < tokens.length; i++){
      if(i < skipEnd) continue;
      const t = tokens[i];
      const w = t.lower;
      if(this.ARTICLES.has(w)) continue;
      if(this.isLikelyAdjective(t)) continue;
      if(/ly$/.test(w) && w.length > 3) continue;
      if(this.PREPOSITIONS.has(w)) continue;
      if(this.isLikelyNoun(t)) continue;
      if(this.isSubordConj(w)) continue;
      if(/[0-9]/.test(t.text)) continue;
      if(t.text === ',') break;
      if(t.text === '-' || t.text === '–' || t.text === '—') continue;

      // 严格判断：仅当确实是动词时才接受（排除名词、形容词等）
      if(this.isLikelyVerb(t)){
        const phraseStart = i;
        let phraseEnd = i + 1;
        while(phraseEnd < tokens.length){
          const next = tokens[phraseEnd];
          if(next.lower === 'not' || next.lower === "n't" || /ly$/.test(next.lower)){
            phraseEnd++;
          } else {
            break;
          }
        }
        const text = this.reconstructText(tokens, phraseStart, phraseEnd);
        return { text, mainVerb: t, start: phraseStart, end: phraseEnd };
      }
    }

    return null;
  },

  // 查找主语（谓语前的部分）
  findSubject(tokens, verbPhrase){
    let start = 0;
    if(tokens[0] && this.isSubordConj(tokens[0].lower)){
      start = 1;
    }
    if(verbPhrase.start <= start) return null;
    const text = this.reconstructText(tokens, start, verbPhrase.start);
    if(!text || text.length < 2) return null;
    return { text };
  },

  // 查找宾语/表语（谓语后的部分，到下一个状语或句末）
  findObject(fullText, tokens, verbPhrase, subject){
    let start = verbPhrase.end;
    // 跳过谓语后的副词和连字符
    while(start < tokens.length){
      const w = tokens[start].lower;
      if(/ly$/.test(w) && w.length > 3) { start++; continue; }
      if(tokens[start].text === '-' || tokens[start].text === '–' || tokens[start].text === '—') { start++; continue; }
      break;
    }
    if(start >= tokens.length) return null;

    let end = tokens.length;
    for(let i = start; i < tokens.length; i++){
      if(this.PREPOSITIONS.has(tokens[i].lower) && i > start){
        end = i;
        break;
      }
      if(this.isSubordConj(tokens[i].lower) && i > start){
        end = i;
        break;
      }
    }

    const text = this.reconstructText(tokens, start, end);
    if(!text || text.length < 2) return null;
    return { text };
  },

  // 查找状语（介词短语等）
  findAdverbials(fullText, tokens, usedComponents){
    const adverbials = [];
    // 用原文位置判断介词是否在已用成分内（避免空格导致的token累加错误）
    const usedRanges = usedComponents.map(c => {
      const idx = this.originalText.indexOf(c.text);
      if(idx < 0) return null;
      return { start: idx, end: idx + c.text.length };
    }).filter(Boolean);

    for(let i = 0; i < tokens.length; i++){
      if(this.PREPOSITIONS.has(tokens[i].lower)){
        const prepPos = tokens[i].start;
        const inUsed = usedRanges.some(r => prepPos >= r.start && prepPos < r.end);
        if(inUsed) continue;
        let end = tokens.length;
        for(let j = i + 1; j < tokens.length; j++){
          if(tokens[j].text === ','){
            end = j;
            break;
          }
          if(this.isSubordConj(tokens[j].lower)){
            end = j;
            break;
          }
        }
        const text = this.reconstructText(tokens, i, end);
        if(text && text.length > 3){
          adverbials.push({
            text: text,
            role: '状语',
            type: 'Adverbial',
            desc: '介词短语作状语，补充说明时间、地点、方式等',
            children: []
          });
        }
        i = end - 1;
      }
    }
    return adverbials;
  },

  // 辅助：从tokens重建原文片段
  reconstructText(tokens, start, end){
    if(start >= end || start >= tokens.length) return '';
    // 从原文中直接截取，保留原始空格
    const startPos = tokens[start].start;
    const endPos = tokens[Math.min(end - 1, tokens.length - 1)].end;
    return this.originalText.substring(startPos, endPos);
  },

  // 辅助：判断是否为从属连词
  isSubordConj(word){
    return ['that','which','who','whom','whose','where','when','why','because','although','though','while','whereas','if','unless','since','until','before','after','once','as','than','whether'].includes(word.toLowerCase());
  },

  // 获取连词标签
  getConjLabel(conj){
    const map = {
      'because':'原因状语从句','since':'原因状语从句','as':'原因状语从句',
      'although':'让步状语从句','though':'让步状语从句','while':'让步状语从句','whereas':'让步状语从句',
      'if':'条件状语从句','unless':'条件状语从句',
      'when':'时间状语从句','before':'时间状语从句','after':'时间状语从句','until':'时间状语从句','once':'时间状语从句',
      'where':'地点状语从句',
      'that':'宾语从句','which':'定语从句','who':'定语从句','whom':'定语从句','whose':'定语从句',
      'why':'定语从句','than':'比较状语从句','whether':'宾语从句'
    };
    return map[(conj||'').toLowerCase()] || '从句';
  },

  // 获取连词类型
  getConjType(conj){
    const map = {
      'because':'AdverbialClause','since':'AdverbialClause','as':'AdverbialClause',
      'although':'AdverbialClause','though':'AdverbialClause','while':'AdverbialClause','whereas':'AdverbialClause',
      'if':'AdverbialClause','unless':'AdverbialClause',
      'when':'AdverbialClause','before':'AdverbialClause','after':'AdverbialClause','until':'AdverbialClause','once':'AdverbialClause',
      'where':'AdverbialClause',
      'that':'ObjectClause','which':'AttributiveClause','who':'AttributiveClause','whom':'AttributiveClause','whose':'AttributiveClause',
      'why':'AttributiveClause','than':'AdverbialClause','whether':'ObjectClause'
    };
    return map[(conj||'').toLowerCase()] || 'AdverbialClause';
  },

  // 提取主干
  extractMainClause(components){
    const main = components.find(c => c.type === 'MainClause' || c.type === '');
    if(!main) return components.map(c => c.text).join(' ');
    const parts = [];
    for(const child of (main.children || [])){
      if(['Subject','Verb','Object','Predicative'].includes(child.type)){
        parts.push(child.text);
      }
    }
    return parts.join(' ').trim() || main.text;
  },

  // 描述句子结构
  describeStructure(components, depth){
    if(depth === 1) return '简单句（主谓宾/主系表结构）';
    const types = components.map(c => c.role).filter(r => r);
    if(types.some(t => t.includes('定语从句')) && types.some(t => t.includes('状语从句'))){
      return '主句 + 定语从句 + 状语从句（复合句）';
    }
    if(types.some(t => t.includes('定语从句'))) return '主句 + 定语从句（复合句）';
    if(types.some(t => t.includes('宾语从句'))) return '主句 + 宾语从句（复合句）';
    if(types.some(t => t.includes('状语从句'))) return '主句 + 状语从句（复合句）';
    return '复合句结构';
  },

  // 生成阅读建议
  generateTip(text, components, depth){
    if(depth === 1){
      if(text.length > 80){
        return '长简单句，注意找准主谓宾主干，状语和定语为修饰成分';
      }
      return '简单句，结构清晰，注意主谓一致';
    }
    const hasRelCluase = components.some(c => c.role.includes('定语从句'));
    const hasAdvClause = components.some(c => c.role.includes('状语从句'));
    if(hasRelCluase){
      return '包含定语从句，先找主句主干，再分析从句修饰关系，注意which/that的先行词';
    }
    if(hasAdvClause){
      return '包含状语从句，注意逻辑关系（因果/让步/条件/时间），主句为核心信息';
    }
    return '复合句，建议先拆分主从句，分别理解后再整合句意';
  },

  // 空结果
  emptyResult(){
    return { main: '', structure: '空句子', components: [], clausedepth: 0, tip: '请选择有效句子' };
  },

  // 简单结果（句子太短）
  simpleResult(text, tokens){
    return {
      main: text,
      structure: '简单句',
      components: [{
        text: text,
        role: '主句',
        type: 'MainClause',
        desc: '句子较短，整体作为主句',
        children: []
      }],
      clausedepth: 1,
      tip: '短句，结构简单'
    };
  },

  // 存储原文引用（供reconstructText使用）
  originalText: ''
};

/* ========================================================
   解析器 Parser
   - 分段、分句、关键段落识别
======================================================== */
const Parser = {
  // 分段：按空行或换行分割
  splitParagraphs(content){
    const paras = content.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>0);
    // 如果没有空行分隔，按单换行也分
    if(paras.length<=1){
      return content.split(/\n/).map(p=>p.trim()).filter(p=>p.length>0);
    }
    return paras;
  },
  // 分句：按句号、问号、感叹号分割（保留缩写处理）
  splitSentences(text){
    if(!text) return [];
    // 简单分句：在 . ! ? 后分割，但排除常见缩写
    const abbreviations = ['e.g','i.e','etc','vs','cf','al','Fig','Eq','No','Vol','pp','Dr','Mr','Mrs','Ms','Prof'];
    let result = [];
    let current = '';
    let words = text.split(' ');
    for(let i=0; i<words.length; i++){
      let w = words[i];
      current += (current?' ':'') + w;
      // 检查是否句末
      if(/[.!?]$/.test(w)){
        // 检查是否缩写
        const cleanW = w.replace(/[.!?]$/,'').toLowerCase();
        const isAbbrev = abbreviations.some(a => cleanW===a.toLowerCase());
        const nextW = words[i+1]||'';
        // 缩写 或 下一个词以小写开头（非句末）则不分
        if(isAbbrev){ continue; }
        if(nextW && /^[a-z]/.test(nextW) && !/^[a-z]*$/.test(nextW)===false){
          // 下一个词小写开头，可能不是新句子（如数字.5）
        }
        result.push(current.trim());
        current = '';
      }
    }
    if(current.trim()) result.push(current.trim());
    // 兜底：如果没有分句成功，整段作为一句
    if(result.length===0 && text.trim()) result = [text.trim()];
    return result;
  },
  // 从HTML中提取纯文本
  extractTextFromHtml(html){
    const temp = document.createElement('div');
    temp.innerHTML = html;
    // 移除 script 和 style
    temp.querySelectorAll('script, style, nav, header, footer, aside, .menu, .nav, .header, .footer').forEach(el=>el.remove());
    // 用换行替换块级元素
    temp.querySelectorAll('br, p, div, h1, h2, h3, h4, h5, h6, li, tr, td, th, blockquote, section, article, figure, figcaption').forEach(el=>{
      el.insertAdjacentText('afterend', '\n');
    });
    const text = temp.textContent || '';
    return text.replace(/\n{3,}/g, '\n\n').trim();
  },
  // 净化HTML，去除与主页面冲突的代码
  sanitizeHtml(html){
    const temp = document.createElement('div');
    temp.innerHTML = html;
    
    // 1. 移除所有 script 标签及内容
    temp.querySelectorAll('script').forEach(el => el.remove());
    
    // 2. 移除所有 style 标签和 link 样式表
    temp.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => el.remove());
    
    // 3. 移除所有 on* 事件属性（onclick, onload, onerror 等）
    const allElements = temp.querySelectorAll('*');
    allElements.forEach(el => {
      const attrs = el.attributes;
      if(!attrs) return;
      const toRemove = [];
      for(let i = 0; i < attrs.length; i++){
        const name = attrs[i].name;
        if(name.startsWith('on') || name === 'on') toRemove.push(name);
      }
      toRemove.forEach(name => el.removeAttribute(name));
    });
    
    // 4. 移除 id 属性避免与主页面冲突（保留 class 用于样式）
    allElements.forEach(el => el.removeAttribute('id'));
    
    // 5. 移除 iframe（可能引入外部内容）
    temp.querySelectorAll('iframe').forEach(el => el.remove());
    
    // 6. 移除 base 标签（会干扰相对路径）
    temp.querySelectorAll('base').forEach(el => el.remove());
    
    // 7. 提取 <body> 内内容（浏览器解析时 <body> 在 div 内可能被忽略，兜底处理）
    const body = temp.querySelector('body');
    if(body && body !== temp){
      // 把 body 的子节点移到 temp
      while(body.firstChild) temp.appendChild(body.firstChild);
      body.remove();
    }
    
    // 8. 移除空的 <html> <head>
    temp.querySelectorAll('html, head').forEach(el => el.remove());
    
    return temp;
  }
};

/* ========================================================
   翻译器 Translator
   - 优先查本地笔记，无则调用 MyMemory API
======================================================== */
const Translator = {
  cache: {}, // 内存缓存，避免重复请求
  async translate(word){
    word = word.trim();
    if(!word) return '';
    // 0. 查医学缩写字典
    const medAbbr = MEDICAL_ABBREVIATIONS[word] || MEDICAL_ABBREVIATIONS[word.toUpperCase()];
    if(medAbbr){ this.cache[word.toLowerCase()] = medAbbr; return medAbbr; }
    // 1. 查内存缓存
    if(this.cache[word.toLowerCase()]) return this.cache[word.toLowerCase()];
    // 2. 查本地笔记
    const note = DB.findNote(word);
    if(note && note.translation){
      this.cache[word.toLowerCase()] = note.translation;
      return note.translation;
    }
    // 3. 调用API
    try{
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`;
      const resp = await fetch(url);
      const data = await resp.json();
      let trans = data.responseData?.translatedText || '';
      // 清理：API 有时会返回原文
      if(trans.toLowerCase() === word.toLowerCase()) trans = '(无翻译结果)';
      this.cache[word.toLowerCase()] = trans;
      return trans;
    }catch(e){
      return '(翻译失败，请检查网络)';
    }
  },
  async translateBatch(words){
    const results = {};
    await Promise.all(words.map(async w=>{
      results[w] = await this.translate(w);
    }));
    return results;
  }
};

// 全局函数：将阅读区内英语单词气泡化（点击查词/双击收藏），保留源文件排版
function bubbleHtmlWords(rootContainer){
  const target = rootContainer.querySelector('.html-content') || rootContainer;
  if(!target) return;
  if(target.querySelector('.word-bubble')) return; // 已处理过则跳过
  const notes = DB.getAllNotes();
  const savedWords = new Set(notes.filter(n=>n.type==='word'||!n.type).map(n=>n.word.toLowerCase()));
  const skipTags = new Set(['SCRIPT','STYLE','CODE','PRE','INPUT','TEXTAREA','BUTTON']);
  const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT, {
    acceptNode: (node) => {
      if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let parent = node.parentElement;
      while(parent && parent !== target){
        if(skipTags.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
        if(parent.classList?.contains('word-bubble')) return NodeFilter.FILTER_REJECT;
        parent = parent.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  }, false);
  const textNodes = [];
  let currentNode;
  while(currentNode = walker.nextNode()) textNodes.push(currentNode);
  for(const node of textNodes){
    const text = node.nodeValue;
    if(!text || !text.trim()) continue;
    const tokens = text.split(/(\s+)/);
    const frag = document.createDocumentFragment();
    let hasWord = false;
    for(const token of tokens){
      if(/^\s+$/.test(token)){ frag.appendChild(document.createTextNode(token)); continue; }
      const match = token.match(/^([^\w]*)([\w'-]+)([^\w]*)$/);
      if(match){
        const [, prefix, word, suffix] = match;
        const isSaved = savedWords.has(word.toLowerCase());
        const span = document.createElement('span');
        span.className = 'word-bubble' + (isSaved ? ' saved' : '');
        span.dataset.word = word;
        span.textContent = prefix + word + suffix;
        span.addEventListener('click', (e)=>{ e.stopPropagation(); ReaderView.onWordClick(e, word); });
        span.addEventListener('dblclick', (e)=>{ e.stopPropagation(); ReaderView.onWordDblClick(e, word); });
        frag.appendChild(span);
        hasWord = true;
      }else{
        frag.appendChild(document.createTextNode(token));
      }
    }
    if(hasWord) node.parentNode.replaceChild(frag, node);
  }
  ReaderView.bindPhraseSelect(target);
}

const ReaderView = {
  currentDocId:null,
  currentDoc:null,
  mode:'intensive',
  paraIdx:0,
  sentIdx:0,
  clickTimer:null,
  _pdfWordIdx:0,
  _tocItems:[],
  _progressTimer:null,
  // 精读模式：将当前句子拆成单词气泡
  render(){
    this.currentDoc = DB.getDoc(this.currentDocId);
    if(!this.currentDoc){ Router.go('folder'); return; }
    document.getElementById('reader-view-title').textContent = this.currentDoc.title || this.currentDoc.name;
    // 恢复进度：优先读取按 docId 持久化的进度（localStorage），兼容旧的 readProgress/settings
    this._restoreTipShown = false;
    const saved = this._getSavedProgress(this.currentDocId);
    const prog = (saved && saved.ts) ? saved : (this.currentDoc.readProgress || {});
    this.paraIdx = (prog.paraIdx != null) ? prog.paraIdx : 0;
    this.sentIdx = (prog.sentIdx != null) ? prog.sentIdx : 0;
    this.mode = prog.mode || DB.data.settings.mode || 'intensive';
    this.pdfViewMode = prog.pdfViewMode || DB.data.settings.pdfViewMode || 'text';
    this._pdfScale = prog.pdfScale || DB.data.settings.pdfScale || 1.4;
    this._restorePdfPage = (prog.pdfPage != null) ? prog.pdfPage : 1;
    this._restoreScrollRatio = (prog.scrollRatio != null) ? prog.scrollRatio : null;
    this._restoreScrollTop = (prog.scrollTop != null) ? prog.scrollTop : null;
    this._hasRestored = !!(saved && saved.ts);
    // 更新模式按钮
    document.querySelectorAll('.mode-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode===this.mode);
    });
    this.renderContent();
    this.buildToc();
    BufferView.initBuffer();
    // 绑定进度跟踪：滚动节流保存 + 关闭页面前兜底保存
    this.bindProgressTracking();
    // 轻量恢复提示（PDF原版视图在渲染完成后另行提示）
    if(this._hasRestored && !(this.currentDoc.type === 'pdf' && this.pdfViewMode === 'original')){
      setTimeout(()=>{ if(Router.current === 'reader') this.showRestoreTip(); }, 300);
    }
  },
  open(docId){
    this.currentDocId = docId;
    Router.go('reader');
  },
  setMode(mode){
    this.mode = mode;
    DB.data.settings.mode = mode; DB.save();
    document.querySelectorAll('.mode-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode===mode);
    });
    document.getElementById('reader-content').className = 'reader-content ' + (mode==='intensive'?'intensive':'');
    this.renderContent();
    this.buildToc();
    // 切换视图模式：即时保存进度
    this.flushProgressSave();
  },
  // 从泛读模式右键菜单跳转到精读模式，定位到选中的段落/句子
  startIntensiveFromHere(){
    if(!this.currentDoc) return;
    const paras = this.currentDoc.paragraphs || [];
    const menu = document.getElementById('context-menu');
    if(menu) menu.classList.remove('show');
    // 1. 确定目标段落
    let targetParaIdx = this._ctxMenuParaIdx;
    if(targetParaIdx == null || targetParaIdx < 0 || targetParaIdx >= paras.length){
      // 如果没拿到段落索引：用锚点文本在所有段落中匹配
      const anchor = (this._ctxMenuAnchor || '').trim().replace(/\s+/g, ' ');
      if(anchor && anchor.length >= 3){
        for(let i = 0; i < paras.length; i++){
          const p = paras[i].replace(/\s+/g, ' ');
          if(p.includes(anchor)){ targetParaIdx = i; break; }
        }
      }
    }
    if(targetParaIdx == null || targetParaIdx < 0){ targetParaIdx = 0; }
    targetParaIdx = Math.max(0, Math.min(paras.length - 1, targetParaIdx));
    // 2. 确定目标句子：用锚点文本在该段落内匹配
    const targetPara = paras[targetParaIdx] || '';
    const sentences = Parser.splitSentences(targetPara);
    let targetSentIdx = 0;
    const anchor = (this._ctxMenuAnchor || '').trim().replace(/\s+/g, ' ');
    if(anchor && anchor.length >= 3 && sentences.length > 0){
      for(let i = 0; i < sentences.length; i++){
        const s = sentences[i].replace(/\s+/g, ' ');
        if(s.includes(anchor)){ targetSentIdx = i; break; }
      }
    }
    // 3. 切换到精读模式并定位
    this.paraIdx = targetParaIdx;
    this.sentIdx = targetSentIdx;
    this.saveProgress();
    // 如果当前已是精读，直接重绘；否则切换模式
    if(this.mode !== 'intensive'){
      this.setMode('intensive');
    }else{
      this.renderContent();
    }
    Toast.show(`已跳转至第${targetParaIdx+1}段第${targetSentIdx+1}句`);
  },
  buildToc(){
    const doc = this.currentDoc;
    this._tocItems = [];
    if(!doc) return;
    const isPdfOriginal = doc.type === 'pdf' && doc.pdfData && this.pdfViewMode === 'original';
    const container = document.getElementById('reader-content');
    if(isPdfOriginal){
      // PDF原版视图：目录按页码跳转（支持用户自定义页码名称，localStorage 持久化）
      const pages = container.querySelectorAll('.pdf-page-wrapper');
      const pageNames = this.getTocPageNames(doc.id || this.currentDocId);
      this._tocItems = Array.from(pages).map((el, i)=>{
        const pn = i + 1;
        const custom = pageNames[pn];
        return { type:'page', label: custom || ('第 '+pn+' 页'), pageNum: pn, level: 1, custom: !!custom };
      });
    }else if(doc.type === 'html'){
      // HTML文档：目录按标题(h1-h6)跳转
      const wrapper = container.querySelector('.skim-content, .skim-html');
      if(wrapper){
        wrapper.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((h)=>{
          this._tocItems.push({ type:'html', label:(h.textContent||'').trim().substring(0, 42), anchor:h.id, level:parseInt(h.tagName.substring(1)) });
        });
      }
    }else{
      // 纯文本 / PDF文本视图：按标题段落识别目录
      const paras = doc.paragraphs || [];
      paras.forEach((p, idx)=>{
        const tp = (p||'').trim();
        if(tp.length === 0 || tp.length > 80) return;
        const level = this._headingLevel(tp);
        if(level > 0) this._tocItems.push({ type:'para', label:tp.substring(0, 60), paraIdx:idx, level });
      });
    }
    this.renderToc();
  },
  _headingLevel(t){
    if(/^(abstract|introduction|background|methods?|methodology|materials\s*(and|&)?\s*methods?|results?|findings|discussion|conclusions?|summary|references|bibliography|acknowledg(e|ment)s?|funding|keywords?)\b/i.test(t)) return 1;
    const m = t.match(/^\s*(\d+(?:\.\d+)*)[\.\)\s:：]+(.+)$/);
    if(m) return Math.min(3, m[1].split('.').length);
    if(t.length <= 40 && !/[。，；]/.test(t) && /\S/.test(t)) return 2;
    return 0;
  },
  renderToc(){
    const panel = document.getElementById('toc-panel');
    if(!panel) return;
    if(this._tocItems.length === 0){
      panel.innerHTML = '<h4>文档目录</h4><div class="toc-empty">本文档暂无目录结构</div>';
      return;
    }
    const doc = this.currentDoc;
    const isPdfOriginal = doc && doc.type === 'pdf' && doc.pdfData && this.pdfViewMode === 'original';
    const hasCustom = this._tocItems.some(it=>it.type === 'page' && it.custom);
    const clearAllBtn = (isPdfOriginal && hasCustom) ? '<button class="toc-clear-all" onclick="ReaderView.clearAllTocPageNames()" title="清除全部自定义页码名称">重置命名</button>' : '';
    panel.innerHTML = '<h4>文档目录' + clearAllBtn + '</h4>' + this._tocItems.map((it, i)=>{
      if(it.type === 'page'){
        const label = HomeView.esc(it.label);
        const num = '<span class="toc-num">'+it.pageNum+'</span>';
        const actions = '<span class="toc-item-actions">' +
          '<button class="toc-rename-btn" onclick="ReaderView.renameTocPage(event,'+it.pageNum+')" title="重命名此页">✎</button>' +
          (it.custom ? '<button class="toc-reset-btn" onclick="ReaderView.resetTocPageName(event,'+it.pageNum+')" title="还原默认名称">↺</button>' : '') +
          '</span>';
        return `<div class="toc-page-item"><button class="toc-item level-${Math.min(3, it.level||1)}" data-toc-idx="${i}" onclick="ReaderView.tocJump(${i})" ondblclick="ReaderView.renameTocPage(event,${it.pageNum})" title="双击可重命名">${num}<span class="toc-label">${label}</span></button>${actions}</div>`;
      }
      const label = HomeView.esc(it.label);
      return `<button class="toc-item level-${Math.min(3, it.level||1)}" data-toc-idx="${i}" onclick="ReaderView.tocJump(${i})">${label}</button>`;
    }).join('');
  },
  // ===== 目录页码重命名（localStorage 持久化，按 docId 分文档保存）=====
  _loadTocPageNames(){
    try{ return JSON.parse(localStorage.getItem('reader:tocPageNames') || '{}') || {}; }
    catch(e){ return {}; }
  },
  _saveTocPageNames(map){
    try{ localStorage.setItem('reader:tocPageNames', JSON.stringify(map)); }
    catch(e){ console.warn('目录命名保存失败', e); }
  },
  getTocPageNames(docId){
    if(!docId) return {};
    const map = this._loadTocPageNames();
    return map[docId] || {};
  },
  setTocPageName(docId, pageNum, name){
    if(!docId) return;
    const map = this._loadTocPageNames();
    if(!map[docId]) map[docId] = {};
    const trimmed = (name || '').trim();
    if(trimmed) map[docId][pageNum] = trimmed;
    else delete map[docId][pageNum];
    if(Object.keys(map[docId]).length === 0) delete map[docId];
    this._saveTocPageNames(map);
  },
  renameTocPage(event, pageNum){
    event.stopPropagation();
    const doc = this.currentDoc;
    if(!doc) return;
    const docId = doc.id || this.currentDocId;
    const current = this.getTocPageNames(docId)[pageNum] || ('第 '+pageNum+' 页');
    const name = prompt('为「'+current+'」设置自定义名称：', current);
    if(name === null) return;
    this.setTocPageName(docId, pageNum, name);
    this.buildToc();
  },
  resetTocPageName(event, pageNum){
    event.stopPropagation();
    const doc = this.currentDoc;
    if(!doc) return;
    this.setTocPageName(doc.id || this.currentDocId, pageNum, '');
    this.buildToc();
  },
  clearAllTocPageNames(){
    const doc = this.currentDoc;
    if(!doc) return;
    const map = this._loadTocPageNames();
    delete map[doc.id || this.currentDocId];
    this._saveTocPageNames(map);
    this.buildToc();
  },
  toggleToc(){
    const panel = document.getElementById('toc-panel');
    if(!panel) return;
    const willShow = panel.style.display === 'none';
    if(willShow) this.renderToc();
    panel.style.display = willShow ? 'block' : 'none';
  },
  tocJump(idx){
    const it = this._tocItems[idx];
    if(!it) return;
    const container = document.getElementById('reader-content');
    const close = ()=>{ const p = document.getElementById('toc-panel'); if(p) p.style.display = 'none'; };
    if(it.type === 'page'){
      const el = container.querySelector(`.pdf-page-wrapper[data-page-num="${it.pageNum}"]`);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); this.flashEl(el); }
      close();
      return;
    }
    if(it.type === 'html'){
      const h = document.getElementById(it.anchor);
      if(h){ h.scrollIntoView({behavior:'smooth', block:'start'}); this.flashEl(h); }
      close();
      return;
    }
    if(it.type === 'para'){
      // 文本视图：确保处于泛读模式，再滚动到目标段落
      const needRebuild = this.mode !== 'skim';
      if(needRebuild) this.setMode('skim');
      const jump = ()=>{
        const el = container.querySelector(`[data-para-idx="${it.paraIdx}"]`);
        if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); this.flashEl(el); }
      };
      if(needRebuild) setTimeout(jump, 60); else jump();
      close();
    }
    // 目录跳转：即时保存进度
    this.flushProgressSave();
  },
  flashEl(el){
    el.style.transition = 'box-shadow .3s';
    const orig = el.style.boxShadow;
    el.style.boxShadow = '0 0 0 3px rgba(79,109,245,.55)';
    setTimeout(()=>{ el.style.boxShadow = orig; }, 1200);
  },
  renderContent(){
    const container = document.getElementById('reader-content');
    const isPdf = this.currentDoc && this.currentDoc.type === 'pdf' && this.currentDoc.pdfData;
    if(this.mode==='intensive'){
      this.renderIntensive(container);
    }else if(isPdf && this.pdfViewMode === 'original'){
      this.renderPdfOriginal(container);
    }else{
      this.renderSkim(container);
    }
    this.updateProgress();
    this.updatePdfViewToggle();

  },
  // PDF视图切换按钮（工具栏）
  updatePdfViewToggle(){
    const toggle = document.getElementById('pdf-view-toggle');
    const doc = this.currentDoc;
    if(!doc || doc.type !== 'pdf' || !doc.pdfData || this.mode === 'intensive'){
      if(toggle) toggle.style.display = 'none';
      return;
    }
    if(!toggle){
      const toolbar = document.querySelector('.reader-toolbar');
      if(!toolbar) return;
      const div = document.createElement('div');
      div.id = 'pdf-view-toggle';
      div.className = 'pdf-view-toggle';
      div.innerHTML = `
        <button class="mode-btn active" data-view="text" onclick="ReaderView.switchPdfView('text')">📝 文本视图</button>
        <button class="mode-btn" data-view="original" onclick="ReaderView.switchPdfView('original')">📄 原版PDF</button>
      `;
      toolbar.appendChild(div);
    }
    const currentMode = this.pdfViewMode || 'text';
    const buttons = document.querySelectorAll('#pdf-view-toggle .mode-btn');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.view === currentMode));
    toggle.style.display = 'flex';
  },
  switchPdfView(mode){
    this.pdfViewMode = mode;
    DB.updateSettings({ pdfViewMode: mode });
    this.renderContent();
    this.buildToc();
    // 切换PDF视图：即时保存进度（渲染中的旧页码会保留，切回原版时自动恢复）
    this.flushProgressSave();
  },
  // 渲染PDF原版视图（Canvas分页渲染）
  async renderPdfOriginal(container){
    const doc = this.currentDoc;
    if(!doc.pdfData){
      container.innerHTML = '<div class="empty-state"><p>PDF原始数据不可用，请重新导入</p></div>';
      return;
    }
    if(typeof pdfjsLib === 'undefined'){
      container.innerHTML = '<div class="empty-state"><p>PDF渲染库未加载</p></div>';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    this._pdfWordIdx = 0;
    this._pdfScale = this._pdfScale || 1.4;
    container.classList.add('pdf-original');
    container.classList.remove('intensive');
    container.innerHTML = `
      <div class="pdf-original-container" id="pdf-original-container">
        <div class="pdf-zoom-bar">
          <button onclick="ReaderView.changePdfZoom(-0.2)" title="缩小">−</button>
          <span class="pdf-zoom-level" id="pdf-zoom-level">${Math.round(this._pdfScale*100)}%</span>
          <button onclick="ReaderView.changePdfZoom(0.2)" title="放大">+</button>
          <button onclick="ReaderView.resetPdfZoom()" title="重置">1:1</button>
          <span class="pdf-page-indicator" id="pdf-page-indicator" title="点击输入页码跳转"><span class="pdf-page-cur" id="pdf-page-cur">1</span><span class="pdf-page-sep"> / </span><span class="pdf-page-total" id="pdf-page-total">…</span><input type="text" inputmode="numeric" class="pdf-page-input" id="pdf-page-input" style="display:none" title="输入页码后回车跳转"><span class="pdf-page-printed hidden" id="pdf-page-printed"></span></span>
          <div style="flex:1"></div>
          <button onclick="ReaderView.scrollPdfPage(-1)" title="上一页">←</button>
          <button onclick="ReaderView.scrollPdfPage(1)" title="下一页">→</button>
        </div>
        <div id="pdf-pages-container"></div>
      </div>
    `;
    try{
      const arrayBuffer = FolderView.base64ToArrayBuffer(doc.pdfData);
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pageCount = pdf.numPages;
      const pagesContainer = document.getElementById('pdf-pages-container');
      const totalEl0 = document.getElementById('pdf-page-total');
      if(totalEl0) totalEl0.textContent = pageCount;
      this._pdfPageRefs = [];
      this._pdfPageTexts = {}; // 存储每页文本，用于章节导航
      // 预读笔记中已收藏单词
      const notes = DB.getAllNotes();
      const savedWords = new Set(notes.map(n=>(n.word||'').toLowerCase()));
      for(let i = 1; i <= pageCount; i++){
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: this._pdfScale });
        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';
        pageWrapper.dataset.pageNum = i;
        pageWrapper.style.width = viewport.width + 'px';
        pageWrapper.style.margin = '0 auto 16px';
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        pageWrapper.appendChild(canvas);
        pagesContainer.appendChild(pageWrapper);
        await page.render({ canvasContext: ctx, viewport }).promise;
        // 叠加透明文本层（实现单词交互）
        await this.renderPdfPageTextLayer(page, viewport, pageWrapper, i, savedWords);
        this._pdfPageRefs.push({ pageNum: i, element: pageWrapper, canvas, viewport });
        const curEl = document.getElementById('pdf-page-cur');
        const totalEl = document.getElementById('pdf-page-total');
        if(curEl) curEl.textContent = i;
        if(totalEl) totalEl.textContent = pageCount;
      }
      // 记录总页数并识别每页内部印刷页码（无法可靠识别时置 null，展示时省略）
      this._pdfPageCount = pageCount;
      this._pdfPrintedPages = {};
      for(let n = 1; n <= pageCount; n++){
        this._pdfPrintedPages[n] = this.detectPrintedPageNumber(this._pdfPageTexts[n], pageCount, n) || null;
      }
      // 渲染完成：同步当前页码、绑定滚动跟踪
      this.updatePdfPageIndicator();
      this.bindPdfPageTracking();
      // 内容渲染完成后绑定词组拖选
      this.bindPdfPhraseSelect();
      // PDF页渲染完成后重建目录（按页码）
      this.buildToc();
      // 恢复上次阅读页码（按 docId 进度：进入文档 / 切回原版 / 缩放后均跳回原页）
      const savedProg = this._getSavedProgress(this.currentDocId);
      let restorePage = (savedProg && savedProg.pdfPage) ? savedProg.pdfPage : this._restorePdfPage;
      if(!restorePage || isNaN(restorePage)) restorePage = 1;
      restorePage = Math.max(1, Math.min(pageCount, restorePage));
      const scrollContainer = document.getElementById('reader-content');
      if(restorePage > 1 && scrollContainer){
        const targetEl = pagesContainer.querySelector(`.pdf-page-wrapper[data-page-num="${restorePage}"]`);
        if(targetEl) scrollContainer.scrollTop = targetEl.offsetTop - 20;
      }else if(this._restoreScrollTop && scrollContainer && !(savedProg && savedProg.pdfPage)){
        // 兼容旧进度：无页码时用保存的滚动位置
        scrollContainer.scrollTop = this._restoreScrollTop;
      }
      this.updatePdfPageIndicator();
      // 轻量恢复提示（仅进入文档时提示一次）
      if(this._hasRestored && !this._restoreTipShown && Router.current === 'reader'){
        this.showRestoreTip();
      }
    }catch(err){
      console.error('PDF渲染失败:', err);
      container.innerHTML = `<div class="empty-state"><p>PDF渲染失败: ${err.message || '未知错误'}</p><p style="margin-top:8px;font-size:12px;color:var(--text-3);">请尝试切换到文本视图查看</p></div>`;
    }
  },
  // 渲染PDF单页文本层（叠加在Canvas上的透明可交互文本）
  // 根治方案：改用 pdf.js 官方 TextLayer 机制（renderTextLayer）。
  // 官方以 rawDims(scale=1) 坐标系计算坐标，left/top 用百分比定位、fontSize 用
  // calc(var(--scale-factor)*px)；注意官方 setLayerDimensions 只设置文本层宽高的 calc 表达式，
  // 并不会设置 --scale-factor 变量本身，必须由调用方在 textLayer 上显式 setProperty，
  // 否则 calc() 全部无效、文本层塌陷（选词/点击失效）。
  // 与 Canvas(同 viewport) 共用同一缩放链路；字形 ascent 由官方 getAscent 用 canvas 实测
  // fontBoundingBoxAscent/像素扫描获得，无需任何经验系数，从机制上保证像素级对齐。
  async renderPdfPageTextLayer(page, viewport, pageWrapper, pageNum, savedWords){
    try{
      const textLayer = document.createElement('div');
      textLayer.className = 'textLayer pdf-text-layer';
      textLayer.style.width = viewport.width + 'px';
      textLayer.style.height = viewport.height + 'px';
      // 关键：官方 renderTextLayer 依赖 --scale-factor 计算字号(fontSize=calc(var(--scale-factor)*u px))
      // 与文本层宽高(calc(var(--scale-factor)*pageWidth px))；官方 setLayerDimensions 只写 calc 表达式，
      // 不设置变量本身。此处必须显式设置，否则 calc() 全部无效、文本层塌陷导致选词/点击失效。
      textLayer.style.setProperty('--scale-factor', viewport.scale);
      pageWrapper.appendChild(textLayer);
      if(typeof pdfjsLib.renderTextLayer !== 'function'){
        throw new Error('当前 pdf.js 构建未包含官方 TextLayer 模块（renderTextLayer）');
      }
      // 官方文本层渲染：textContentSource 走流式解析，完成后 div 内为 span[role=presentation]
      const task = pdfjsLib.renderTextLayer({
        textContentSource: page.streamTextContent(),
        container: textLayer,
        viewport
      });
      await task.promise;
      let pageText = '';
      // 官方 span 已按 PDF 坐标精确定位（字形顶对齐基线），此处仅做单词交互包装
      textLayer.querySelectorAll('span[role="presentation"]').forEach(div=>{
        const text = div.textContent || '';
        pageText += text + ' ';
        if(!text.trim()) return;
        const tokens = text.split(/(\s+)/);
        let html = '';
        for(const token of tokens){
          if(/^\s+$/.test(token)){ html += token.replace(/\n/g,'&#10;'); continue; }
          const match = token.match(/^([^\w]*)([\w'-]+)([^\w]*)$/);
          if(match){
            const [, prefix, word, suffix] = match;
            const isSaved = savedWords.has(word.toLowerCase());
            const wordAttr = HomeView.esc(word).replace(/'/g,"\\'");
            const wIdx = this._pdfWordIdx++;
            html += `<span class="word-bubble pdf-word-bubble ${isSaved?'saved':''}" data-word="${HomeView.esc(word)}" data-w-idx="${wIdx}" onclick="ReaderView.onWordClick(event,'${wordAttr}')" ondblclick="ReaderView.onWordDblClick(event,'${wordAttr}')">${HomeView.esc(prefix)}${HomeView.esc(word)}${HomeView.esc(suffix)}</span>`;
          }else{
            html += `<span>${HomeView.esc(token)}</span>`;
          }
        }
        div.innerHTML = html;
      });
      this._pdfPageTexts[pageNum] = pageText;
    }catch(err){
      console.warn(`PDF第${pageNum}页文本层渲染失败:`, err);
    }
  },
  // 为PDF文本层绑定词组拖选（跨页生效）
  bindPdfPhraseSelect(){
    const layers = document.querySelectorAll('.pdf-text-layer');
    layers.forEach(layer=>{
      if(layer._phraseBound) return;
      layer._phraseBound = true;
      this.bindPhraseSelect(layer);
    });
  },
  changePdfZoom(delta){
    this._pdfScale = Math.max(0.4, Math.min(3.0, (this._pdfScale || 1.4) + delta));
    this.renderContent();
    // 缩放变更：即时保存进度
    this.flushProgressSave();
  },
  resetPdfZoom(){
    this._pdfScale = 1.4;
    this.renderContent();
    // 缩放重置：即时保存进度
    this.flushProgressSave();
  },
  scrollPdfPage(direction){
    const container = document.getElementById('reader-content');
    const pages = document.querySelectorAll('.pdf-page-wrapper');
    if(!pages.length) return;
    const currentScroll = container.scrollTop;
    let targetPage = 1;
    pages.forEach((p, i) => {
      if(p.offsetTop <= currentScroll + 100) targetPage = i + 1;
    });
    targetPage = Math.max(1, Math.min(pages.length, targetPage + direction));
    this.jumpToPdfPage(targetPage);
  },
  // 计算当前可见的 PDF 页（与上一页/下一页按钮同一判定口径）
  computePdfCurrentPage(){
    const container = document.getElementById('reader-content');
    const pages = container ? container.querySelectorAll('.pdf-page-wrapper') : [];
    if(!pages.length) return 1;
    const scrollTop = container.scrollTop;
    let cur = 1;
    pages.forEach((p, i) => {
      if(p.offsetTop <= scrollTop + 100) cur = i + 1;
    });
    return cur;
  },
  // 跳转到指定物理页（上一页/下一页/输入跳转共用）
  jumpToPdfPage(n){
    const container = document.getElementById('reader-content');
    const pages = container ? container.querySelectorAll('.pdf-page-wrapper') : [];
    if(!pages.length) return;
    n = Math.max(1, Math.min(pages.length, parseInt(n, 10) || 1));
    const target = pages[n - 1];
    if(target) container.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
    // 翻页（上下页按钮 / 输入页码）：即时保存目标页码
    this.saveProgressNow(n);
  },
  // 同步悬浮翻页栏页码：当前页 / 总页数 + 内部印刷页码（辅助）
  updatePdfPageIndicator(){
    const curEl = document.getElementById('pdf-page-cur');
    const totalEl = document.getElementById('pdf-page-total');
    const printedEl = document.getElementById('pdf-page-printed');
    if(!curEl || !totalEl) return;
    const cur = this.computePdfCurrentPage();
    const total = this._pdfPageCount || document.querySelectorAll('.pdf-page-wrapper').length;
    if(curEl.textContent !== String(cur)) curEl.textContent = cur;
    if(totalEl.textContent !== String(total)) totalEl.textContent = total;
    if(printedEl){
      const printed = this._pdfPrintedPages && this._pdfPrintedPages[cur];
      printedEl.textContent = printed ? `文档页码 ${printed}` : '';
      printedEl.classList.toggle('hidden', !printed);
    }
  },
  // 绑定 PDF 滚动跟踪：滚动画布/上一页下一页/目录跳转均触发 scroll，实时同步页码
  bindPdfPageTracking(){
    const container = document.getElementById('reader-content');
    if(!container || container._pdfTrackBound) return;
    container._pdfTrackBound = true;
    let timer = null;
    container.addEventListener('scroll', () => {
      if(!document.getElementById('pdf-page-indicator')) return;
      if(timer) return;
      timer = setTimeout(() => { timer = null; this.updatePdfPageIndicator(); }, 60);
    }, { passive: true });
    window.addEventListener('resize', () => {
      if(document.getElementById('pdf-page-indicator')) this.updatePdfPageIndicator();
    });
    // 悬浮翻页栏点击 → 输入页码跳转（input 自身点击已 stopPropagation）
    const ind = document.getElementById('pdf-page-indicator');
    if(ind && !ind._pdfClickBound){
      ind._pdfClickBound = true;
      ind.addEventListener('click', () => this.startPdfPageInput());
    }
  },
  // 识别 PDF 页内印刷页码（辅助显示）：取文本末尾独立数字 token，
  // 且与物理页偏差 <= 3 才视为可靠（避免把章节编号/尾注数字当页码）
  detectPrintedPageNumber(pageText, pageCount, pageNum){
    if(!pageText) return null;
    const candidates = [];
    const re = /(?:^|[\s\u00A0])(\d{1,4})(?:[\s\u00A0]|$)/g;
    let m;
    while((m = re.exec(pageText)) !== null){
      const v = parseInt(m[1], 10);
      if(v >= 1 && v <= pageCount * 2) candidates.push(v);
    }
    if(!candidates.length) return null;
    const candidate = candidates[candidates.length - 1];
    if(Math.abs(candidate - pageNum) > 3) return null;
    return candidate;
  },
  // 点击页码开始输入跳转
  startPdfPageInput(){
    const ind = document.getElementById('pdf-page-indicator');
    if(!ind) return;
    const cur = document.getElementById('pdf-page-cur');
    const sep = document.getElementById('pdf-page-sep');
    const input = document.getElementById('pdf-page-input');
    if(!input || !cur || !sep) return;
    cur.style.display = 'none'; sep.style.display = 'none';
    input.style.display = 'inline-block';
    input.value = String(this.computePdfCurrentPage());
    input.focus(); input.select();
    input.onkeydown = (e) => {
      if(e.key === 'Enter') this.commitPdfPageInput();
      else if(e.key === 'Escape') this.cancelPdfPageInput();
      e.stopPropagation();
    };
    input.onblur = () => this.commitPdfPageInput();
    input.onclick = (e) => e.stopPropagation();
  },
  commitPdfPageInput(){
    const input = document.getElementById('pdf-page-input');
    if(!input || input.style.display === 'none') return;
    const v = parseInt(input.value, 10);
    this.cancelPdfPageInput();
    if(!isNaN(v)) this.jumpToPdfPage(v);
  },
  cancelPdfPageInput(){
    const input = document.getElementById('pdf-page-input');
    const cur = document.getElementById('pdf-page-cur');
    const sep = document.getElementById('pdf-page-sep');
    if(!input) return;
    input.style.display = 'none';
    if(cur) cur.style.display = '';
    if(sep) sep.style.display = '';
  },
  // 精读模式
  renderIntensive(container){
    const paras = this.currentDoc.paragraphs || [];
    if(paras.length===0){
      container.innerHTML = '<div class="empty-state"><p>文档内容为空</p></div>'; return;
    }
    if(this.paraIdx >= paras.length) this.paraIdx = paras.length - 1;
    const para = paras[this.paraIdx];
    const sentences = Parser.splitSentences(para);
    if(this.sentIdx >= sentences.length) this.sentIdx = 0;
    const sentence = sentences[this.sentIdx] || '';
    container.innerHTML = `
      <div class="intensive-box">
        <div class="intensive-text" id="intensive-sentence"></div>
        <!-- 内联翻译结果 -->
        <div id="intensive-translations" class="intensive-translations"></div>
        <!-- 语法分析结果 -->
        <div id="intensive-grammar" class="intensive-grammar"></div>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button class="btn" onclick="ReaderView.aiExplainCurrentSentence()" style="font-size:12px;padding:4px 10px;">🤖 AI解释此句</button>
          <button class="btn" onclick="ReaderView.analyzeSentenceGrammar()" style="font-size:12px;padding:4px 10px;background:linear-gradient(135deg,#5b3a8c,#6b4c9a);color:#fff;border:none;">🔬 语法分析</button>
        </div>
        <div class="intensive-nav">
          <button class="btn" onclick="ReaderView.prev()" ${this.paraIdx===0&&this.sentIdx===0?'disabled':''}>← 上一句</button>
          <span class="intensive-counter">段落 ${this.paraIdx+1}/${paras.length} · 句 ${this.sentIdx+1}/${sentences.length}</span>
          <button class="btn btn-primary" onclick="ReaderView.next()">下一句 →</button>
        </div>
        <div style="margin-top:16px;font-size:12px;color:var(--text-3);">
          💡 单击单词翻译 · 双击查看详情 · 拖动选词组 · 已收藏带绿下划线
        </div>
      </div>
    `;
    // 渲染单词气泡
    this.renderWords(document.getElementById('intensive-sentence'), sentence);
    // 渲染内联翻译（已持久保存的）
    this.renderInlineTranslations();
    // 渲染已保存的语法分析（若无缓存则自动异步分析并持久化）
    this.renderGrammarAnalysis();
    this.ensureGrammarAnalyzed(sentence);
    this.saveProgress();
  },
  // 确保当前句子已有语法分析结果；若无则自动分析并保存
  async ensureGrammarAnalyzed(sentence){
    if(!this.currentDoc) return;
    const key = this.paraIdx + ':' + this.sentIdx;
    if(!this.currentDoc.sentenceData) this.currentDoc.sentenceData = {};
    if(!this.currentDoc.sentenceData[key]) this.currentDoc.sentenceData[key] = { words: {} };
    const existing = this.currentDoc.sentenceData[key].grammar;
    if(existing && existing.components && existing.components.length > 0) return;
    if(!sentence){ const paras = this.currentDoc.paragraphs||[]; const p = paras[this.paraIdx]||''; const sents = Parser.splitSentences(p); sentence = sents[this.sentIdx]||''; }
    if(!sentence || sentence.length < 3) return;
    // 显示加载提示
    const container = document.getElementById('intensive-grammar');
    if(container && !container.innerHTML.trim()){
      container.innerHTML = '<div class="grammar-loading">🔬 自动分析句子结构...</div>';
    }
    try{
      const result = GrammarAnalyzer.analyze(sentence);
      // 若已保存过整句翻译，直接复用；否则留空（用户后续手动触发翻译即可，避免自动API请求）
      const existingTrans = this.currentDoc.sentenceData[key].sentenceTrans;
      if(existingTrans) result.sentenceTrans = existingTrans;
      this.currentDoc.sentenceData[key].grammar = result;
      if(result.sentenceTrans) this.currentDoc.sentenceData[key].sentenceTrans = result.sentenceTrans;
      DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
      // 只在当前仍在同一句子时刷新渲染（避免用户切句后覆盖新内容）
      const currentKey = this.paraIdx + ':' + this.sentIdx;
      if(currentKey === key) this.renderGrammarAnalysis();
    }catch(e){
      console.error('自动语法分析失败:', e);
      const container2 = document.getElementById('intensive-grammar');
      if(container2 && container2.querySelector('.grammar-loading')){
        container2.innerHTML = '';
      }
    }
  },
  // 渲染已持久保存的内联翻译（精读模式）
  renderInlineTranslations(){
    const key = this.paraIdx + ':' + this.sentIdx;
    const data = this.currentDoc?.sentenceData?.[key];
    const container = document.getElementById('intensive-translations');
    if(!container) return;
    if(!data || Object.keys(data.words||{}).length === 0){
      container.innerHTML = '';
      return;
    }
    let html = '<div class="int-trans-panel">';
    for(const [word, info] of Object.entries(data.words)){
      const trans = info.translation || '...';
      const cls = info.source === 'loading' ? 'int-trans-loading' : '';
      html += `<div class="int-trans-item ${cls}">
        <span class="int-trans-word">${HomeView.esc(word)}</span>
        <span class="int-trans-arrow">→</span>
        <span class="int-trans-text">${HomeView.esc(trans)}</span>
      </div>`;
    }
    html += '</div>';
    container.innerHTML = html;
  },
  // 精读模式：翻译单词并内联显示（同时持久保存）
  async translateWordInline(word){
    if(!this.currentDoc) return;
    const key = this.paraIdx + ':' + this.sentIdx;
    if(!this.currentDoc.sentenceData) this.currentDoc.sentenceData = {};
    if(!this.currentDoc.sentenceData[key]) this.currentDoc.sentenceData[key] = { words: {} };
    // 如果已经翻译过且不是loading状态，跳过
    const existing = this.currentDoc.sentenceData[key].words[word];
    if(existing && existing.source !== 'loading') return;
    // 从缓存或笔记中获取翻译
    const note = DB.findNote(word);
    if(note && note.translation){
      this.currentDoc.sentenceData[key].words[word] = { translation: note.translation, source: 'note' };
      DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
      this.renderInlineTranslations();
      return;
    }
    // 从 buffer 中找
    const bufItem = BufferView.items.find(it=>it.word.toLowerCase()===word.toLowerCase());
    if(bufItem && (bufItem.status==='done'||bufItem.status==='saved') && bufItem.translation){
      this.currentDoc.sentenceData[key].words[word] = { translation: bufItem.translation, source: 'api' };
      DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
      this.renderInlineTranslations();
      return;
    }
    // 显示加载中
    this.currentDoc.sentenceData[key].words[word] = { translation: '翻译中...', source: 'loading' };
    DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
    this.renderInlineTranslations();
    // 调用API翻译
    const trans = await Translator.translate(word);
    this.currentDoc.sentenceData[key].words[word] = { translation: trans, source: 'api' };
    DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
    this.renderInlineTranslations();
  },
  // 泛读模式
  renderSkim(container){
    const doc = this.currentDoc;
    // HTML 文档：直接渲染原始HTML（净化后）
    if(doc.type === 'html' && doc.rawHtml){
      const safeContent = Parser.sanitizeHtml(doc.rawHtml);
      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'skim-content html-content';
      // 把净化后的内容移入 wrapper
      while(safeContent.firstChild) wrapper.appendChild(safeContent.firstChild);
      container.appendChild(wrapper);
      // 限制样式污染
      wrapper.querySelectorAll('img, table, pre, video').forEach(el=>{
        if(el.tagName==='IMG' || el.tagName==='VIDEO'){
          el.style.maxWidth = '100%';
          el.style.height = 'auto';
        }
        if(el.tagName==='TABLE'){
          el.style.maxWidth = '100%';
          el.style.overflowX = 'auto';
        }
        if(el.tagName==='PRE'){
          el.style.overflowX = 'auto';
          el.style.whiteSpace = 'pre-wrap';
          el.style.wordBreak = 'break-word';
        }
      });
      // 提取标题（h1-h6）并打锚点，供文档目录跳转
      const headings = wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if(headings.length > 0){
        headings.forEach((h, idx)=>{ h.id = 'html-heading-' + idx; });
      }
      // 应用单词气泡
      bubbleHtmlWords(container);
      return;
    }
    const paras = doc.paragraphs || [];
    if(paras.length===0){
      container.innerHTML = '<div class="empty-state"><p>文档内容为空</p></div>'; return;
    }
    container.innerHTML = '<div class="skim-content">' + paras.map((p, idx)=>{
      return `<div class="paragraph" data-para-idx="${idx}"><span class="para-words" id="para-${idx}"></span></div>`;
    }).join('') + '</div>';
    // 为每个段落渲染单词
    paras.forEach((p, idx)=>{
      const el = document.getElementById('para-'+idx);
      if(el) this.renderWords(el, p);
    });
    // 滚动到上次位置：优先按保存的滚动比例/位置恢复，其次按上次段落定位
    const savedSkim = this._getSavedProgress(this.currentDocId);
    const restoreRatio = (savedSkim && savedSkim.scrollRatio != null) ? savedSkim.scrollRatio : this._restoreScrollRatio;
    const restoreTop = (savedSkim && savedSkim.scrollTop != null) ? savedSkim.scrollTop : this._restoreScrollTop;
    setTimeout(()=>{
      const scrollContainer = document.getElementById('reader-content');
      if(restoreRatio != null && scrollContainer){
        const max = Math.max(scrollContainer.scrollHeight - scrollContainer.clientHeight, 1);
        scrollContainer.scrollTop = Math.round(max * restoreRatio);
      }else if(restoreTop != null && restoreTop > 0 && scrollContainer){
        scrollContainer.scrollTop = restoreTop;
      }else{
        const target = container.querySelector(`[data-para-idx="${this.paraIdx}"]`);
        if(target) target.scrollIntoView({block:'center', behavior:'smooth'});
      }
    }, 100);
  },
  // 渲染单词气泡
  renderWords(container, text){
    if(!text) { container.innerHTML=''; return; }
    // 按空格分词，保留标点
    const tokens = text.split(/(\s+)/);
    const notes = DB.getAllNotes();
    const savedWords = new Set(notes.map(n=>n.word.toLowerCase()));
    let html = '';
    let wordIdx = 0;
    for(const token of tokens){
      if(/^\s+$/.test(token)){ html += ' '; continue; }
      const match = token.match(/^([^\w]*)([\w'-]+)([^\w]*)$/);
      if(match){
        const [, prefix, word, suffix] = match;
        const isSaved = savedWords.has(word.toLowerCase());
        const wordAttr = HomeView.esc(word).replace(/'/g,"\\'");
        html += `<span class="word-bubble ${isSaved?'saved':''}" data-word="${HomeView.esc(word)}" data-w-idx="${wordIdx}" onclick="ReaderView.onWordClick(event,'${wordAttr}')" ondblclick="ReaderView.onWordDblClick(event,'${wordAttr}')">${HomeView.esc(prefix)}${HomeView.esc(word)}${HomeView.esc(suffix)}</span>`;
        wordIdx++;
      }else{
        html += `<span>${HomeView.esc(token)}</span>`;
      }
    }
    container.innerHTML = html;
    // 绑定词组选择事件
    this.bindPhraseSelect(container);
  },
  // 词组选择（鼠标拖拽）
  phraseSelect: { active:false, startIdx:-1, endIdx:-1, container:null },
  bindPhraseSelect(container){
    if(container._phraseBound) return;
    container._phraseBound = true;
    container.addEventListener('mousedown', (e)=>{
      const bubble = e.target.closest('.word-bubble');
      if(!bubble) return;
      if(e.button!==0) return;
      // 只有按住 Shift 或右键才启用词组拖拽？不，直接支持拖拽
      // 但要区分单击和拖拽：移动超过阈值才认为是选择
      const idx = parseInt(bubble.dataset.wIdx);
      this.phraseSelect = { active:false, startIdx:idx, endIdx:idx, container, startX:e.clientX, startY:e.clientY, moved:false };
      const onMove = (ev)=>{
        const dist = Math.abs(ev.clientX-this.phraseSelect.startX) + Math.abs(ev.clientY-this.phraseSelect.startY);
        if(dist>4 && !this.phraseSelect.moved){
          this.phraseSelect.moved = true;
          this.phraseSelect.active = true;
        }
        if(this.phraseSelect.active){
          const tgt = document.elementFromPoint(ev.clientX, ev.clientY);
          const b = tgt?.closest('.word-bubble');
          if(b && container.contains(b)){
            this.phraseSelect.endIdx = parseInt(b.dataset.wIdx);
            this.highlightPhrase();
          }
          ev.preventDefault();
        }
      };
      const onUp = ()=>{
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if(this.phraseSelect.active && this.phraseSelect.startIdx!==this.phraseSelect.endIdx){
          // 有词组选择，显示浮动工具栏
          this.showPhraseToolbar();
          // 阻止后续的 click 事件（避免单词单击入篮）
          const stopClick = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); };
          container.addEventListener('click', stopClick, true);
          setTimeout(()=>container.removeEventListener('click', stopClick, true), 0);
        }else{
          // 未拖拽，重置
          this.clearPhraseHighlight();
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  },
  highlightPhrase(){
    const { container, startIdx, endIdx } = this.phraseSelect;
    if(!container) return;
    const min = Math.min(startIdx, endIdx);
    const max = Math.max(startIdx, endIdx);
    container.querySelectorAll('.word-bubble').forEach(el=>{
      const idx = parseInt(el.dataset.wIdx);
      if(idx>=min && idx<=max){
        el.classList.add('phrase-selected');
      }else{
        el.classList.remove('phrase-selected');
      }
    });
  },
  clearPhraseHighlight(){
    const c = this.phraseSelect.container;
    if(c) c.querySelectorAll('.word-bubble.phrase-selected').forEach(el=>el.classList.remove('phrase-selected'));
    this.phraseSelect.active = false;
  },
  getSelectedPhrase(){
    const { container, startIdx, endIdx } = this.phraseSelect;
    if(!container) return { text:'', words:[] };
    const min = Math.min(startIdx, endIdx);
    const max = Math.max(startIdx, endIdx);
    const words = [];
    container.querySelectorAll('.word-bubble').forEach(el=>{
      const idx = parseInt(el.dataset.wIdx);
      if(idx>=min && idx<=max){
        words.push(el.dataset.word);
      }
    });
    return { text: words.join(' '), words };
  },
  showPhraseToolbar(){
    const sel = this.getSelectedPhrase();
    if(!sel.text) return;
    // 找到选区位置
    const bubbles = document.querySelectorAll('.word-bubble.phrase-selected');
    if(bubbles.length===0) return;
    const firstRect = bubbles[0].getBoundingClientRect();
    const lastRect = bubbles[bubbles.length-1].getBoundingClientRect();
    // 检查是否已在笔记库中
    const existingNote = DB.findNote(sel.text);
    // 显示浮动工具栏
    let toolbar = document.getElementById('phrase-toolbar');
    if(!toolbar){
      toolbar = document.createElement('div');
      toolbar.id = 'phrase-toolbar';
      document.body.appendChild(toolbar);
    }
    if(existingNote){
      // 已存储：直接显示翻译
      toolbar.innerHTML = `
        <span class="pt-saved-badge">已收藏</span>
        <span class="pt-trans">${HomeView.esc(existingNote.translation||'(无翻译)')}</span>
        <button class="pt-btn" onclick="ReaderView.viewPhraseDetail()">详情</button>
        <button class="pt-btn" onclick="ReaderView.jumpToPhraseFromToolbar()">📌原文</button>
        <button class="pt-btn" onclick="ReaderView.aiExplainPhrase()">🤖AI解释</button>
        <button class="pt-btn" onclick="ReaderView.cancelPhrase()">关闭</button>
      `;
    }else{
      toolbar.innerHTML = `
        <span class="pt-count" id="pt-count"></span>
        <button class="pt-btn pt-primary" onclick="ReaderView.translatePhrase()">翻译</button>
        <button class="pt-btn" onclick="ReaderView.jumpToPhraseFromToolbar()">📌原文</button>
        <button class="pt-btn" onclick="ReaderView.aiExplainPhrase()">🤖AI解释</button>
        <button class="pt-btn" onclick="ReaderView.cancelPhrase()">取消</button>
      `;
      const countEl = document.getElementById('pt-count');
      if(countEl) countEl.textContent = sel.words.length + ' 词';
    }
    const top = firstRect.top + window.scrollY - 42;
    const left = (firstRect.left + lastRect.left)/2 + window.scrollX;
    toolbar.style.top = top + 'px';
    toolbar.style.left = left + 'px';
    toolbar.style.transform = 'translateX(-50%)';
    toolbar.classList.add('show');
    // 点击外部关闭
    const close = (e)=>{
      if(!toolbar.contains(e.target) && !(e.target.classList && e.target.classList.contains('word-bubble'))){
        toolbar.classList.remove('show');
        this.clearPhraseHighlight();
        document.removeEventListener('mousedown', close);
        document.removeEventListener('touchstart', close);
      }
    };
    setTimeout(()=>{ document.addEventListener('mousedown', close); document.addEventListener('touchstart', close); }, 10);
  },
  translatePhrase(){
    const sel = this.getSelectedPhrase();
    if(!sel.text) return;
    const context = sel.text; // 词组本身就是语境
    BufferView.addPhrase(sel.text, context);
    this.cancelPhrase();
    Toast.show('词组已加入生词篮');
  },
  // 查看已收藏词组的详情
  viewPhraseDetail(){
    const sel = this.getSelectedPhrase();
    if(!sel.text) return;
    this.cancelPhrase();
    const note = DB.findNote(sel.text);
    if(!note) return;
    const phrase = sel.text;
    // 搜索例句
    const docExamples = this.findPhraseExamples(phrase);
    const hasExamples = (note.examples && note.examples.length > 0) || docExamples.length > 0;
    let html = `<div style="font-size:15px;font-weight:600;color:var(--info,#2196f3);margin-bottom:8px;word-break:break-word;">${HomeView.esc(note.word)}</div>`;
    html += `<div style="font-size:14px;line-height:1.6;padding:10px;background:var(--bg-2,#f5f7fa);border-radius:6px;margin-bottom:8px;">${HomeView.esc(note.translation||'(无翻译)')}</div>`;
    if(note.context) html += `<div style="font-size:12px;color:var(--text-3);margin-bottom:8px;">语境：${HomeView.esc(note.context)}</div>`;
    // 例句
    if(hasExamples){
      html += '<div style="margin-top:6px;font-size:12px;font-weight:600;color:var(--text-2,#666);">📚 例句</div>';
      if(note.examples && note.examples.length > 0){
        note.examples.slice(0, 3).forEach(ex=>{
          html += `<div style="margin-top:4px;padding:6px 8px;background:var(--surface-2,#f5f7fa);border-radius:4px;font-size:13px;line-height:1.5;">`;
          html += `<div>${this.highlightWord(ex.sentence, note.word)}</div>`;
          if(ex.translation) html += `<div style="color:var(--text-3,#999);margin-top:2px;">${HomeView.esc(ex.translation)}</div>`;
          html += `</div>`;
        });
      }
      let shownCount = Math.min(note.examples?.length||0, 3);
      for(const ex of docExamples){
        if(shownCount >= 5) break;
        shownCount++;
        html += `<div style="margin-top:4px;padding:6px 8px;background:var(--surface-2,#f5f7fa);border-radius:4px;font-size:13px;line-height:1.5;">`;
        html += `<div>${this.highlightWord(ex.sentence, note.word)}</div></div>`;
      }
    }
    Modal.show('词组翻译详情', html, [
      {text:'关闭', class:'btn', action:()=>Modal.hide()},
      {text:'📌 跳转原文', class:'btn btn-primary', action:()=>{
        Modal.hide();
        this.jumpToPhrase(phrase);
      }},
      {text:'编辑翻译', class:'btn', action:()=>{
        const newTrans = prompt('修改翻译：', note.translation||'');
        if(newTrans!==null){
          note.translation = newTrans;
          DB.save();
          this.refreshSavedMarks();
          Toast.show('已更新');
        }
        Modal.hide();
      }}
    ]);
  },
  // 从词组工具栏跳转到原文
  jumpToPhraseFromToolbar(){
    const sel = this.getSelectedPhrase();
    if(!sel.text) return;
    this.cancelPhrase();
    this.jumpToPhrase(sel.text);
  },
  cancelPhrase(){
    const toolbar = document.getElementById('phrase-toolbar');
    if(toolbar) toolbar.classList.remove('show');
    this.clearPhraseHighlight();
  },
  // AI解释词组
  aiExplainPhrase(){
    const sel = this.getSelectedPhrase();
    if(!sel.text) return;
    this.cancelPhrase();
    if(!AIChatPanel.isOpen) AIChatPanel.open();
    const input = document.getElementById('ai-input');
    if(input) input.value = '请解释：' + sel.text;
    AIChatPanel.send();
  },
  // 单词点击：单击加入生词篮（后台翻译，不打断阅读）
  // 用 250ms 延迟区分单击/双击，避免双击时误加入篮子
  // 精读模式下：直接内联显示翻译结果（持久保存）；双击弹详情
  // 非精读模式：原有逻辑，已收藏/已翻译则弹出模态框
  onWordClick(event, word){
    event.stopPropagation();
    if(this.clickTimer){ clearTimeout(this.clickTimer); this.clickTimer=null; }
    this.clickTimer = setTimeout(()=>{
      this.clickTimer = null;
      // 精读模式：内联显示翻译（不弹模态框），双击才弹详情
      if(this.mode === 'intensive'){
        const bufItem = BufferView.items.find(it=>it.word.toLowerCase()===word.toLowerCase());
        if(!bufItem || (bufItem.status!=='done' && bufItem.status!=='saved')){
          BufferView.addWord(word, this.getContextForWord(word));
        }
        this.translateWordInline(word);
        return;
      }
      // 非精读模式：原有逻辑
      const note = DB.findNote(word);
      if(note && note.translation){
        this.showTranslation(word);
        return;
      }
      const bufItem = BufferView.items.find(it=>it.word.toLowerCase()===word.toLowerCase());
      if(bufItem && (bufItem.status==='done' || bufItem.status==='saved')){
        this.showTranslation(word);
        return;
      }
      BufferView.addWord(word, this.getContextForWord(word));
    }, 250);
  },
  // 单词双击：弹出详情弹窗（可编辑/收藏）
  onWordDblClick(event, word){
    event.stopPropagation();
    if(this.clickTimer){ clearTimeout(this.clickTimer); this.clickTimer=null; }
    this.showTranslation(word);
  },
  // 选中相关（保留兼容，已由 BufferView 接管）
  clearSelection(){
    document.querySelectorAll('.word-bubble.selected').forEach(el=>el.classList.remove('selected'));
  },
  // 获取单词所在语境
  getContextForWord(word){
    const paras = this.currentDoc.paragraphs || [];
    for(const p of paras){
      if(p.toLowerCase().includes(word.toLowerCase())){
        // 截取包含该词的句子
        const sentences = Parser.splitSentences(p);
        for(const s of sentences){
          if(s.toLowerCase().includes(word.toLowerCase())) return s;
        }
      }
    }
    return '';
  },
  // AI解释单词
  aiExplainWord(word){
    Modal.hide();
    if(!AIChatPanel.isOpen) AIChatPanel.open();
    const input = document.getElementById('ai-input');
    if(input) input.value = '请解释：' + word;
    AIChatPanel.send();
  },
  aiExplainCurrentSentence(){
    const paras = this.currentDoc.paragraphs || [];
    const para = paras[this.paraIdx] || '';
    const sentences = Parser.splitSentences(para);
    const sentence = sentences[this.sentIdx] || '';
    if(!sentence){ Toast.show('当前没有句子'); return; }
    if(!AIChatPanel.isOpen) AIChatPanel.open();
    const input = document.getElementById('ai-input');
    if(input) input.value = '请解释：' + sentence;
    AIChatPanel.send();
  },
  // 语法分析：本地规则引擎分析句子结构，用彩色括号+上标注解可视化
  async analyzeSentenceGrammar(){
    const paras = this.currentDoc.paragraphs || [];
    const para = paras[this.paraIdx] || '';
    const sentences = Parser.splitSentences(para);
    const sentence = sentences[this.sentIdx] || '';
    if(!sentence){ Toast.show('当前没有句子'); return; }

    const key = this.paraIdx + ':' + this.sentIdx;
    if(!this.currentDoc.sentenceData) this.currentDoc.sentenceData = {};
    if(!this.currentDoc.sentenceData[key]) this.currentDoc.sentenceData[key] = { words: {} };

    const container = document.getElementById('intensive-grammar');
