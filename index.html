/* ========================================================
   初始化
========================================================*/
window.addEventListener('DOMContentLoaded', ()=>{
  DB.load();
  // 键盘快捷键：精读模式左右键翻页
  document.addEventListener('keydown', (e)=>{
    if(Router.current!=='reader') return;
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    if(ReaderView.mode!=='intensive') return;
    if(e.key==='ArrowRight') ReaderView.next();
    if(e.key==='ArrowLeft') ReaderView.prev();
    if(e.key==='Escape') ReaderView.clearSelection();
  });

  // AI悬浮球拖拽
  (() => {
    const orb = document.getElementById('ai-orb');
    if(!orb) return;
    let orbDragged = false;
    orb.addEventListener('mousedown', (e) => {
      orbDragged = false;
      const startX = e.clientX, startY = e.clientY;
      const rect = orb.getBoundingClientRect();
      const origX = rect.left, origY = rect.top;
      const onMove = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(Math.abs(dx) + Math.abs(dy) > 5) orbDragged = true;
        if(orbDragged){
          orb.classList.add('dragging');
          orb.style.left = (origX + dx) + 'px';
          orb.style.top = (origY + dy) + 'px';
          orb.style.right = 'auto';
          orb.style.bottom = 'auto';
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        orb.classList.remove('dragging');
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    // 阻止拖拽时触发click
    orb.addEventListener('click', (e) => {
      if(orbDragged){ orbDragged = false; e.stopPropagation(); e.preventDefault(); return; }
    }, true);
  })();

  // 泛读模式右键菜单
  document.addEventListener('contextmenu', (e) => {
    if(Router.current !== 'reader') return;
    if(ReaderView.mode !== 'skim') return;
    const content = document.getElementById('reader-content');
    if(!content || !content.contains(e.target)) return;
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    // 定位最近的段落
    let paraIdx = null;
    let anchorText = text || '';
    let node = e.target;
    while(node && node !== content){
      if(node.dataset && node.dataset.paraIdx != null){
        paraIdx = parseInt(node.dataset.paraIdx);
        break;
      }
      // HTML文档：从最近的带 data-para-idx 的元素获取
      if(node.getAttribute && node.getAttribute('data-para-idx') != null){
        paraIdx = parseInt(node.getAttribute('data-para-idx'));
        break;
      }
      node = node.parentNode;
    }
    // 如果没有选中文字，但有段落位置，使用段落起始
    if(!text && paraIdx == null) return;
    e.preventDefault();
    AIChatPanel.contextSelection = text;
    // 保存跳转上下文
    ReaderView._ctxMenuParaIdx = paraIdx;
    ReaderView._ctxMenuAnchor = anchorText;
    ReaderView._ctxMenuClickX = e.clientX;
    ReaderView._ctxMenuClickY = e.clientY;
    const menu = document.getElementById('context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');
  });
  // 点击其他区域关闭右键菜单
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('context-menu');
    if(menu && !menu.contains(e.target)){
      menu.classList.remove('show');
    }
  });

  // ===== 触屏文本选区工具条：长按选词后浮动操作（收藏 / AI解释 / 翻译）=====
  // 安卓无 hover：文本视图（精读/泛读/HTML）通过系统长按选词触发 selectionchange，
  // 在选区上方弹出浮动工具条，兼容划选收藏与 AI 操作；仅在触屏设备启用，桌面行为不变。
  const SelectionToolbar = {
    bar: null,
    init(){
      // 仅触屏启用，避免与桌面划选工具栏（phrase-toolbar）冲突
      if(!window.matchMedia || !window.matchMedia('(hover:none) and (pointer:coarse)').matches) return;
      this.bar = document.createElement('div');
      this.bar.id = 'selection-toolbar';
      this.bar.className = 'selection-toolbar';
      document.body.appendChild(this.bar);

      this.bar.addEventListener('click', (e)=>{
        const act = e.target && e.target.getAttribute ? e.target.getAttribute('data-act') : null;
        if(!act) return;
        if(act === 'add'){
          BufferView.addSelectedText();
          this.hide();
        }else if(act === 'explain'){
          AIChatPanel.explainSelection();
          this.hide();
        }else if(act === 'translate'){
          AIChatPanel.quickAction('translate');
          this.hide();
        }
      });

      document.addEventListener('selectionchange', ()=>{ this.onSelectionChange(); });
      // 点击/触摸工具条以外区域时隐藏
      document.addEventListener('mousedown', (e)=>{ if(!this.bar.contains(e.target)) this.hide(); }, true);
      document.addEventListener('touchstart', (e)=>{ if(!this.bar.contains(e.target)) this.hide(); }, { passive: true, capture: true });
      window.addEventListener('scroll', ()=>{ this.hide(); }, true);
    },
    getSelectionText(){
      const sel = window.getSelection();
      return sel ? sel.toString().trim() : '';
    },
    onSelectionChange(){
      const text = this.getSelectionText();
      if(!text || text.length < 2){ this.hide(); return; }
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return;
      const node = sel.getRangeAt(0).commonAncestorContainer;
      const root = node && node.nodeType === 3 ? node.parentElement : (node && node.nodeType === 1 ? node : null);
      if(!root || !root.closest) return;
      // 仅展示在阅读区内；长按已收藏单词走 HoverTip 释义，不弹工具条
      if(root.closest('.word-bubble.saved')){ this.hide(); return; }
      if(!root.closest('.reader-content')){ this.hide(); return; }
      const r = sel.getRangeAt(0).getBoundingClientRect();
      if(!r || (!r.width && !r.height)){ this.hide(); return; }
      this.position(r);
    },
    position(r){
      const bar = this.bar;
      bar.innerHTML = `
        <button data-act="add" class="st-btn st-primary">📌 收藏</button>
        <button data-act="explain" class="st-btn">🤖 解释</button>
        <button data-act="translate" class="st-btn">🌐 翻译</button>
      `;
      bar.style.display = 'flex';
      const m = 8;
      let top = r.top - 42;
      if(top < m) top = r.bottom + 8;
      let left = r.left + r.width / 2;
      bar.style.top = top + 'px';
      bar.style.left = left + 'px';
      bar.style.transform = 'translateX(-50%)';
      // 贴近屏幕边缘时回退为贴边显示
      const bw = bar.offsetWidth || 160;
      if(left - bw / 2 < m || left + bw / 2 > window.innerWidth - m){
        bar.style.transform = 'none';
        left = Math.max(m, Math.min(left, window.innerWidth - bw - m));
        bar.style.left = left + 'px';
      }
    },
    hide(){
      if(this.bar) this.bar.style.display = 'none';
    }
  };

  // ===== 悬浮释义（hover tooltip）：已收藏/已注释单词上方自动浮现中文解释 =====
  // 覆盖文本视图（精读 renderWords / 泛读 renderSkim）、PDF 原版视图（pdf-word-bubble）、
  // HTML 文档（bubbleHtmlWords）等所有渲染 .word-bubble 的场景；
  // 仅对 .word-bubble.saved（已收藏到生词本）触发，与单击查词/双击详情/划选收藏互不干扰。
  const HoverTip = {
    delay: 250, // 触发延迟 200-300ms 区间
    tip: null,
    timer: null,
    target: null, // 当前目标单词气泡
    word: '',
    showing: false,
    init(){
      this.tip = document.createElement('div');
      this.tip.className = 'hover-tip';
      this.tip.style.display = 'none';
      document.body.appendChild(this.tip);

      // 事件委托：进入已收藏单词气泡时调度显示
      document.addEventListener('mouseover', (e)=>{ this.onOver(e); });
      document.addEventListener('mouseout', (e)=>{ this.onOut(e); });
      // 单击/双击/拖拽（mousedown）时立即隐藏，避免与查词/详情/划选冲突
      document.addEventListener('mousedown', ()=>{ this.hide(); }, true);
      document.addEventListener('click', (e)=>{
        // 长按触发的释义气泡展示后，抑制该次 click（否则会立刻隐藏并触发查词）
        if(this._suppressClickUntil && Date.now() < this._suppressClickUntil){
          e.stopPropagation(); e.preventDefault();
          this._suppressClickUntil = 0;
          return;
        }
        this.hide();
      }, true);
      // 触屏长按（≥500ms）已收藏单词 → 显示释义气泡（模拟 hover）
      document.addEventListener('touchstart', (e)=>{ this.onTouchStart(e); }, { passive: true });
      document.addEventListener('touchend', (e)=>{ this.onTouchEnd(e); }, { passive: true });
      document.addEventListener('touchmove', ()=>{ this.onTouchMove(); }, { passive: true });
      document.addEventListener('touchcancel', ()=>{ this.onTouchCancel(); }, { passive: true });
      // 滚动/缩放/键盘操作时隐藏（PDF 翻页、缩放、目录滚动等）
      window.addEventListener('scroll', ()=>{ this.hide(); }, true);
      window.addEventListener('resize', ()=>{ this.hide(); });
      document.addEventListener('keydown', ()=>{ this.hide(); });
      // 页面切换（路由）后可能残留，统一由 hide 兜底
      window.addEventListener('hashchange', ()=>{ this.hide(); });
    },
    // ===== 触屏长按释义（安卓无 hover，长按已收藏单词 500ms 弹出释义气泡）=====
    _touch: null, // { bubble, word, timer, longPressed }
    onTouchStart(e){
      // 仅在触摸目标是已收藏单词气泡时处理（避免滚动/翻页/缩放误触）
      const bubble = e.target && e.target.closest ? e.target.closest('.word-bubble.saved') : null;
      if(!bubble) return;
      const word = (bubble.dataset.word || '').trim();
      if(!word) return;
      this._touch = { bubble, word, timer: null, longPressed: false };
      // 500ms 后判定为长按：显示释义
      this._touch.timer = setTimeout(()=>{
        if(!this._touch) return;
        this._touch.longPressed = true;
        // 长按后 700ms 内的 click 将被抑制，避免与单击查词/隐藏气泡冲突
        this._suppressClickUntil = Date.now() + 700;
        this.hide();
        this.target = this._touch.bubble;
        this.word = this._touch.word;
        this.show();
      }, 500);
    },
    onTouchEnd(){
      if(!this._touch) return;
      if(this._touch.timer){ clearTimeout(this._touch.timer); }
      this._touch = null;
    },
    onTouchMove(){
      // 触摸移动视为滚动/缩放，取消长按，避免误触
      if(this._touch){
        if(this._touch.timer) clearTimeout(this._touch.timer);
        this._touch = null;
        this.cancelTimer();
      }
    },
    onTouchCancel(){
      if(this._touch){
        if(this._touch.timer) clearTimeout(this._touch.timer);
        this._touch = null;
      }
      this.cancelTimer();
      this._suppressClickUntil = 0;
    },

    // 取中文释义：优先生词本已保存翻译，其次生词篮已完成翻译
    getTranslation(word){
      try{
        const note = DB.findNote(word);
        if(note && note.translation && note.translation.trim()) return note.translation.trim();
        const buf = BufferView.items.find(it=>it.word && it.word.toLowerCase()===word.toLowerCase() && (it.status==='done'||it.status==='saved') && it.translation && it.translation.trim());
        if(buf) return buf.translation.trim();
      }catch(e){}
      return '';
    },
    onOver(e){
      const bubble = e.target.closest ? e.target.closest('.word-bubble.saved') : null;
      if(!bubble) return;
      const word = (bubble.dataset.word || '').trim();
      if(!word) return;
      if(this.target === bubble) return; // 已在调度/显示中
      this.schedule(bubble, word);
    },
    onOut(e){
      const to = e.relatedTarget;
      // 从一个已收藏单词直接移到另一个已收藏单词：转移目标，避免闪烁
      const toBubble = to && to.closest ? to.closest('.word-bubble.saved') : null;
      if(toBubble && toBubble !== this.target){
        const w = (toBubble.dataset.word || '').trim();
        if(w){ this.schedule(toBubble, w); return; }
      }
      // 移开单词立即隐藏
      this.hide();
    },
    schedule(bubble, word){
      this.cancelTimer();
      this.target = bubble;
      this.word = word;
      this.timer = setTimeout(()=>{ this.timer = null; this.show(); }, this.delay);
    },
    show(){
      const bubble = this.target;
      if(!bubble || !bubble.isConnected) { this.hide(); return; }
      const word = this.word || (bubble.dataset.word || '');
      const trans = this.getTranslation(word);
      if(!trans){ this.hide(); return; }
      this.tip.innerHTML = '<div class="ht-word"></div><div class="ht-trans"></div><span class="ht-tag">已收藏 · 悬浮查看</span>';
      this.tip.querySelector('.ht-word').textContent = word;
      this.tip.querySelector('.ht-trans').textContent = trans;

      // 先显示并隐藏测量尺寸（visibility 技巧）
      this.tip.style.display = 'block';
      this.tip.style.visibility = 'hidden';
      const tw = this.tip.offsetWidth, th = this.tip.offsetHeight;
      this.tip.style.visibility = '';

      const rect = bubble.getBoundingClientRect();
      const gap = 10, margin = 8;
      // 默认显示在单词正上方；上方空间不足则翻转到下方
      let top = rect.top - th - gap;
      let flip = false;
      if(top < margin){ top = rect.bottom + gap; flip = true; }
      // 水平居中于单词，超出视口边界则偏移回视口内
      let left = rect.left + rect.width / 2 - tw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - tw - margin));
      // 兜底：视口宽度不足以容纳时贴左边缘
      if(tw + margin * 2 > window.innerWidth){ left = margin; }
      this.tip.style.left = left + 'px';
      this.tip.style.top = top + 'px';
      this.tip.classList.toggle('flip', flip);
      this.showing = true;
      bubble.classList.add('tip-on');
    },
    cancelTimer(){
      if(this.timer){ clearTimeout(this.timer); this.timer = null; }
    },
    hide(){
      this.cancelTimer();
      if(this.target){ this.target.classList.remove('tip-on'); }
      this.target = null;
      this.word = '';
      if(this.showing){
        this.tip.style.display = 'none';
        this.showing = false;
      }
    }
  };

  // 暴露关键模块到全局（兼容onclick调用）
  window.ReaderView = ReaderView;
  window.BufferView = BufferView;
  window.AIChatPanel = AIChatPanel;
  window.WordManager = WordManager;

  SelectionToolbar.init();
  HoverTip.init();

  HomeView.render();
});
</script>
</body>
