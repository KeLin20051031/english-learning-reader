    if(container) container.innerHTML = '<div class="grammar-loading">🔬 正在分析句子结构...</div>';

    try{
      // 使用本地语法分析引擎（无需API）
      const result = GrammarAnalyzer.analyze(sentence);
      // 同时获取句子翻译（优先AI，回退在线翻译）
      if(!this.currentDoc.sentenceData[key].sentenceTrans){
        this.currentDoc.sentenceData[key].sentenceTrans = '';
        try{
          const aiTrans = await BufferView.aiTranslateSentence(sentence);
          result.sentenceTrans = aiTrans || await Translator.translate(sentence);
        }catch(e2){
          result.sentenceTrans = '';
        }
      }else{
        result.sentenceTrans = this.currentDoc.sentenceData[key].sentenceTrans;
      }
      this.currentDoc.sentenceData[key].grammar = result;
      if(result.sentenceTrans) this.currentDoc.sentenceData[key].sentenceTrans = result.sentenceTrans;
      DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
      this.renderGrammarAnalysis();
      Toast.show('语法分析完成');
    }catch(e){
      console.error('语法分析失败:', e);
      if(container) container.innerHTML = `<div class="grammar-error">❌ 分析失败：${HomeView.esc(e.message)}</div>`;
    }
  },
  // 渲染语法分析结果（彩色括号+上标注解）
  renderGrammarAnalysis(){
    const key = this.paraIdx + ':' + this.sentIdx;
    const data = this.currentDoc?.sentenceData?.[key];
    const container = document.getElementById('intensive-grammar');
    if(!container) return;
    if(!data || !data.grammar){
      container.innerHTML = '';
      return;
    }
    const g = data.grammar;
    const colorMap = {
      Subject: '#3b82f6',        // 蓝
      Verb: '#ef4444',            // 红
      Object: '#10b981',          // 绿
      ObjectClause: '#10b981',    // 绿
      Predicative: '#8b5cf6',     // 紫
      Attributive: '#f59e0b',     // 橙
      AttributiveClause: '#f59e0b',
      Adverbial: '#06b6d4',       // 青
      AdverbialClause: '#06b6d4',
      Complement: '#ec4899',      // 粉
      Appositive: '#84cc16'       // 黄绿
    };
    const renderComponent = (comp, depth) => {
      const color = colorMap[comp.type] || '#6b7280';
      const brackets = [['(',')'],['[',']'],['{','}'],['〈','〉'],['《','》']];
      const b = brackets[Math.min(depth, brackets.length-1)];
      let html = `<span class="gram-comp" style="--gc:${color}" data-desc="${HomeView.esc(comp.desc||'')}" data-role="${HomeView.esc(comp.role||'')}">`;
      html += `<span class="gram-bracket">${b[0]}</span>`;
      html += `<span class="gram-label" style="color:${color}">${HomeView.esc(comp.role||'')}</span>`;
      if(comp.head) html += `<span class="gram-head-label" style="color:${color}">⌖${HomeView.esc(comp.head)}</span>`;
      html += `<span class="gram-text">`;
      if(comp.children && comp.children.length > 0){
        // 把原文按children切分，保留非成分的连接词
        let remaining = comp.text;
        let parts = [];
        for(const child of comp.children){
          const idx = remaining.indexOf(child.text);
          if(idx >= 0){
            if(idx > 0) parts.push({ text: remaining.substring(0, idx), type: 'connector' });
            parts.push({ text: child.text, type: 'child', comp: child });
            remaining = remaining.substring(idx + child.text.length);
          }
        }
        if(remaining) parts.push({ text: remaining, type: 'connector' });
        for(const p of parts){
          if(p.type === 'child'){
            html += renderComponent(p.comp, depth + 1);
          }else{
            html += `<span class="gram-connector">${HomeView.esc(p.text)}</span>`;
          }
        }
      }else{
        // 如果有中心语，高亮显示
        if(comp.head && comp.text && comp.text.includes(comp.head)){
          const headIdx = comp.text.indexOf(comp.head);
          if(headIdx >= 0){
            if(headIdx > 0) html += HomeView.esc(comp.text.substring(0, headIdx));
            html += `<span class="gram-head-word">${HomeView.esc(comp.head)}</span>`;
            const tailStart = headIdx + comp.head.length;
            if(tailStart < comp.text.length) html += HomeView.esc(comp.text.substring(tailStart));
          }else{
            html += HomeView.esc(comp.text);
          }
        }else{
          html += HomeView.esc(comp.text);
        }
      }
      html += `</span>`;
      html += `<span class="gram-bracket">${b[1]}</span>`;
      html += `</span>`;
      return html;
    };

    let componentsHtml = '';
    if(g.components && g.components.length > 0){
      componentsHtml = g.components.map(c => renderComponent(c, 0)).join(' ');
    }

    container.innerHTML = `
      <div class="grammar-panel">
        <div class="grammar-header">
          <span class="grammar-title">🔬 句法结构分析</span>
          <button class="grammar-close" onclick="ReaderView.clearGrammarAnalysis()" title="清除">✕</button>
        </div>
        <div class="grammar-structure">
          <div class="grammar-row"><span class="grammar-key">主干</span><span class="grammar-val">${HomeView.esc(g.main||'')}</span></div>
          <div class="grammar-row"><span class="grammar-key">结构</span><span class="grammar-val">${HomeView.esc(g.structure||'')}</span></div>
          ${g.clausedepth?`<div class="grammar-row"><span class="grammar-key">从句深度</span><span class="grammar-val">${g.clausedepth} 层</span></div>`:''}
        </div>
        <div class="grammar-tree">${componentsHtml}</div>
        ${g.sentenceTrans?`<div class="grammar-sentence-trans"><span class="gst-label">译</span>${HomeView.esc(g.sentenceTrans)}</div>`:''}
        ${g.tip?`<div class="grammar-tip">💡 ${HomeView.esc(g.tip)}</div>`:''}
        <div class="grammar-legend">
          ${Object.entries(colorMap).filter(([t])=>g.components?.some(c=>c.type===t || c.children?.some?.(cc=>cc.type===t))).map(([t,c])=>`<span class="legend-item"><i style="background:${c}"></i>${t}</span>`).join('')}
        </div>
      </div>
    `;
  },
  clearGrammarAnalysis(){
    if(!this.currentDoc) return;
    const key = this.paraIdx + ':' + this.sentIdx;
    if(this.currentDoc.sentenceData?.[key]?.grammar){
      delete this.currentDoc.sentenceData[key].grammar;
      DB.updateDoc(this.currentDocId, { sentenceData: this.currentDoc.sentenceData });
    }
    const container = document.getElementById('intensive-grammar');
    if(container) container.innerHTML = '';
  },
  // 显示翻译弹窗
  async showTranslation(word){
    Modal.show('', `
      <div class="translate-modal" id="translate-modal">
        <div class="tm-word">${HomeView.esc(word)}</div>
        <div class="tm-status" id="tm-status">翻译中<span class="loading-dots"></span></div>
        <div class="tm-trans" id="tm-trans"></div>
        <textarea class="tm-edit" id="tm-edit" rows="3" placeholder="输入翻译..."></textarea>
        <div id="tm-examples" class="tm-examples"></div>
        <div class="modal-actions" id="tm-actions"></div>
      </div>
    `, []);
    const trans = await Translator.translate(word);
    const existing = DB.findNote(word);
    const isSaved = !!existing;
    document.getElementById('tm-status').textContent = isSaved ? '已收藏' : (trans==='(无翻译结果)'?'':'来自在线翻译');
    document.getElementById('tm-trans').textContent = trans;
    document.getElementById('tm-edit').value = isSaved ? existing.translation : trans;
    // 渲染例句库
    this.renderExamples(existing);
    // 渲染按钮
    const actions = document.getElementById('tm-actions');
    let btns = `<button class="btn" onclick="Modal.hide()">关闭</button>`;
    btns += `<button class="btn" onclick="ReaderView.aiExplainWord('${HomeView.esc(word).replace(/'/g,"\\'")}')">🤖 AI解释</button>`;
    if(isSaved){
      btns += `<button class="btn btn-danger" onclick="ReaderView.removeNote('${existing.id}')">删除收藏</button>`;
      btns += `<button class="btn btn-primary" onclick="ReaderView.editTranslation()">编辑</button>`;
    }else{
      btns += `<button class="btn btn-primary" onclick="ReaderView.saveAsNote('${HomeView.esc(word).replace(/'/g,"\\'")}')">收藏到生词本</button>`;
    }
    actions.innerHTML = btns;
  },
  // 渲染例句库
  highlightWord(sentence, word){
    if(!sentence || !word) return HomeView.esc(sentence||'');
    const escaped = HomeView.esc(sentence);
    const escapedWord = HomeView.esc(word);
    const regex = new RegExp('(' + escapedWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return escaped.replace(regex, '<span style="font-size:115%;font-weight:700;color:var(--primary,#4a90d9);">$1</span>');
  },
  renderExamples(note){
    const container = document.getElementById('tm-examples');
    if(!container) return;
    if(!note || !note.examples || note.examples.length===0){
      container.innerHTML = '';
      return;
    }
    let html = '<div class="tm-ex-title">📚 例句库 ('+note.examples.length+')</div>';
    note.examples.forEach((ex, idx)=>{
      html += `<div class="tm-ex-item">
        <div class="tm-ex-sentence">${this.highlightWord(ex.sentence, note.word)}</div>
        ${ex.translation?`<div class="tm-ex-trans">${HomeView.esc(ex.translation)}</div>`:'<div class="tm-ex-trans" style="color:var(--text-3);font-style:italic;">(暂无翻译)</div>'}
      </div>`;
    });
    container.innerHTML = html;
  },
  saveAsNote(word){
    const trans = document.getElementById('tm-edit').value || document.getElementById('tm-trans').textContent;
    const context = this.getContextForWord(word);
    DB.addNote(word, trans, context, this.currentDocId);
    Modal.hide();
    this.refreshSavedMarks();
    Toast.show('已收藏到生词本');
  },
  editTranslation(){
    document.getElementById('translate-modal').classList.add('editing');
    document.getElementById('tm-actions').innerHTML = `
      <button class="btn" onclick="Modal.hide()">取消</button>
      <button class="btn btn-primary" onclick="ReaderView.saveEdit()">保存</button>
    `;
    document.getElementById('tm-edit').focus();
  },
  saveEdit(){
    const word = document.querySelector('.tm-word').textContent;
    const trans = document.getElementById('tm-edit').value;
    const context = this.getContextForWord(word);
    DB.addNote(word, trans, context, this.currentDocId);
    Modal.hide();
    this.refreshSavedMarks();
    Toast.show('已更新');
  },
  removeNote(noteId){
    DB.deleteNote(noteId);
    Modal.hide();
    this.refreshSavedMarks();
    Toast.show('已删除生词记录');
  },
  // 刷新已收藏单词标记
  refreshSavedMarks(){
    const notes = DB.getAllNotes();
    const savedWords = new Set(notes.filter(n=>n.type==='word'||!n.type).map(n=>n.word.toLowerCase()));
    // 单词：虚线标记
    document.querySelectorAll('.word-bubble').forEach(el=>{
      const w = el.dataset.word?.toLowerCase();
      el.classList.remove('phrase-saved');
      if(w) el.classList.toggle('saved', savedWords.has(w));
    });
    // 词组/句子：直线标记
    const savedPhrases = notes.filter(n=>n.type==='phrase').map(n=>n.word.toLowerCase()).filter(p=>p.split(/\s+/).length>1);
    // 精读模式
    this.markSavedPhrases(savedPhrases);
    // 泛读模式词组标记
    this.markSavedPhrasesInSkim(savedPhrases);

  },
  // 精读模式：检查连续单词气泡组合是否匹配已收藏词组
  markSavedPhrases(savedPhrases){
    if(savedPhrases.length===0) return;
    document.querySelectorAll('.sentence-box').forEach(box=>{
      const bubbles = Array.from(box.querySelectorAll('.word-bubble'));
      if(bubbles.length===0) return;
      const words = bubbles.map(b=>(b.dataset.word||'').toLowerCase());
      let hasMatch = false;
      savedPhrases.forEach(phrase=>{
        const phraseWords = phrase.split(/\s+/);
        // 在 words 数组中查找连续匹配
        for(let i=0; i<=words.length-phraseWords.length; i++){
          let match = true;
          for(let j=0; j<phraseWords.length; j++){
            if(words[i+j]!==phraseWords[j]){ match=false; break; }
          }
          if(match){
            for(let j=0; j<phraseWords.length; j++){
              bubbles[i+j].classList.add('phrase-saved');
            }
            hasMatch = true;
          }
        }
      });
      box.classList.toggle('has-phrase-saved', hasMatch);
    });
  },
  // 泛读模式：在段落文本中标记已收藏词组
  markSavedPhrasesInSkim(savedPhrases){
    if(savedPhrases.length===0) return;
    document.querySelectorAll('.read-para').forEach(p=>{
      // 跳过已处理的
      if(p.dataset.phraseMarked) return;
      let html = p.innerHTML;
      // 按词组长度降序，避免短词组先替换破坏长词组
      const sorted = [...savedPhrases].sort((a,b)=>b.split(/\s+/).length-a.split(/\s+/).length);
      sorted.forEach(phrase=>{
        // 转义正则特殊字符
        const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('\\b('+escaped+')\\b', 'gi');
        // 避免重复包裹
        html = html.replace(re, (m)=>{
          // 如果已经被包裹（上下文有 phrase-mark），跳过
          return `<span class="phrase-mark" onclick="ReaderView.onPhraseMarkClick(event,'${phrase.replace(/'/g,"\\'")}')">${m}</span>`;
        });
      });
      p.innerHTML = html;
      p.dataset.phraseMarked = '1';
    });
  },
  // 点击泛读模式中的已收藏词组标记
  onPhraseMarkClick(event, phrase){
    event.stopPropagation();
    const note = DB.findNote(phrase);
    if(!note) return;
    // 从文档中搜索例句
    const docExamples = this.findPhraseExamples(phrase);
    const hasExamples = (note.examples && note.examples.length > 0) || docExamples.length > 0;
    let html = `<div style="font-size:15px;font-weight:600;color:var(--info,#2196f3);margin-bottom:8px;word-break:break-word;">${HomeView.esc(note.word)}</div>`;
    html += `<div style="font-size:14px;line-height:1.6;padding:10px;background:var(--bg-2,#f5f7fa);border-radius:6px;">${HomeView.esc(note.translation||'(无翻译)')}</div>`;
    // 显示例句
    if(hasExamples){
      html += '<div style="margin-top:10px;font-size:12px;font-weight:600;color:var(--text-2,#666);">📚 例句</div>';
      // 优先显示笔记中已保存的例句
      if(note.examples && note.examples.length > 0){
        note.examples.slice(0, 3).forEach(ex=>{
          html += `<div style="margin-top:6px;padding:6px 8px;background:var(--surface-2,#f5f7fa);border-radius:4px;font-size:13px;line-height:1.5;">`;
          html += `<div>${this.highlightWord(ex.sentence, note.word)}</div>`;
          if(ex.translation) html += `<div style="color:var(--text-3,#999);margin-top:2px;">${HomeView.esc(ex.translation)}</div>`;
          html += `</div>`;
        });
      }
      // 补充文档中的例句（最多2条）
      let shownCount = Math.min(note.examples?.length||0, 3);
      for(const ex of docExamples){
        if(shownCount >= 5) break;
        shownCount++;
        html += `<div style="margin-top:6px;padding:6px 8px;background:var(--surface-2,#f5f7fa);border-radius:4px;font-size:13px;line-height:1.5;">`;
        html += `<div>${this.highlightWord(ex.sentence, note.word)}</div>`;
        html += `</div>`;
      }
    }
    Modal.show('已收藏词组翻译', html, [
      {text:'关闭', class:'btn', action:()=>Modal.hide()},
      {text:'📌 跳转原文', class:'btn btn-primary', action:()=>{
        Modal.hide();
        this.jumpToPhrase(phrase);
      }}
    ]);
  },


  findPhraseExamples(phrase){
    const paras = this.currentDoc?.paragraphs || [];
    const results = [];
    const lowerPhrase = phrase.toLowerCase();
    for(const p of paras){
      const idx = p.toLowerCase().indexOf(lowerPhrase);
      if(idx !== -1){
        const sentences = Parser.splitSentences(p);
        for(const s of sentences){
          if(s.toLowerCase().includes(lowerPhrase)){
            results.push({ sentence: s.trim() });
            if(results.length >= 5) break;
          }
        }
      }
      if(results.length >= 5) break;
    }
    return results;
  },
  // 跳转到词组所在的原文位置
  jumpToPhrase(phrase){
    const doc = this.currentDoc;
    if(!doc) return;
    const paras = doc.paragraphs || [];
    const lowerPhrase = phrase.toLowerCase();
    for(let pi = 0; pi < paras.length; pi++){
      if(paras[pi].toLowerCase().includes(lowerPhrase)){
        const sentences = Parser.splitSentences(paras[pi]);
        for(let si = 0; si < sentences.length; si++){
          if(sentences[si].toLowerCase().includes(lowerPhrase)){
            // 跳转到精读模式
            this.paraIdx = pi;
            this.sentIdx = si;
            this.setMode('intensive');
            return;
          }
        }
      }
    }
    Toast.show('未在原文中找到该词组');
  },
  // 精读导航
  next(){
    const paras = this.currentDoc.paragraphs || [];
    const sentences = Parser.splitSentences(paras[this.paraIdx]||'');
    if(this.sentIdx < sentences.length-1){
      this.sentIdx++;
    }else if(this.paraIdx < paras.length-1){
      this.paraIdx++;
      this.sentIdx = 0;
    }else{
      Toast.show('已读到末尾');
      return;
    }
    this.renderContent();
  },
  prev(){
    if(this.sentIdx > 0){
      this.sentIdx--;
    }else if(this.paraIdx > 0){
      this.paraIdx--;
      const sentences = Parser.splitSentences(this.currentDoc.paragraphs[this.paraIdx]);
      this.sentIdx = Math.max(0, sentences.length-1);
    }else{
      return;
    }
    this.renderContent();
  },
  saveProgress(){
    const paras = this.currentDoc.paragraphs || [];
    const totalParas = paras.length;
    let percent = 0;
    if(totalParas>0){
      const sentences = Parser.splitSentences(paras[this.paraIdx]||'');
      const totalSent = sentences.length || 1;
      percent = Math.round(((this.paraIdx + (this.sentIdx+1)/totalSent) / totalParas) * 100);
    }
    DB.updateDoc(this.currentDocId, {
      readProgress: { paraIdx:this.paraIdx, sentIdx:this.sentIdx, percent }
    });
    // 精读翻句等即时动作：同步写入按 docId 的全量进度
    this.saveProgressNow();
  },
  // ===== 阅读进度记忆：按 docId 持久化到 localStorage =====
  _PROGRESS_KEY: 'reader:progress:v2',
  _loadProgressMap(){
    try{ return JSON.parse(localStorage.getItem(this._PROGRESS_KEY) || '{}') || {}; }
    catch(e){ return {}; }
  },
  _saveProgressMap(map){
    try{ localStorage.setItem(this._PROGRESS_KEY, JSON.stringify(map)); }
    catch(e){ console.warn('进度保存失败:', e); }
  },
  _getSavedProgress(docId){
    if(!docId) return null;
    const map = this._loadProgressMap();
    return map[docId] || null;
  },
  // 立即保存当前阅读进度（overridePdfPage 用于翻页跳转等已知目标页的场景）
  saveProgressNow(overridePdfPage){
    const doc = this.currentDoc;
    if(!doc || !this.currentDocId) return;
    const container = document.getElementById('reader-content');
    const isPdf = doc.type === 'pdf' && doc.pdfData;
    let scrollTop = null, scrollRatio = null;
    if(container){
      scrollTop = container.scrollTop;
      const maxScroll = Math.max(container.scrollHeight - container.clientHeight, 1);
      scrollRatio = maxScroll > 0 ? (scrollTop / maxScroll) : 0;
    }
    let pdfPage = null;
    if(overridePdfPage != null){
      pdfPage = overridePdfPage;
    }else if(isPdf && this.pdfViewMode === 'original'){
      // 仅在原版视图渲染就绪（页面已存在）时计算当前页，避免重渲染期间误存为第1页
      if(document.querySelectorAll('.pdf-page-wrapper').length > 0){
        pdfPage = this.computePdfCurrentPage();
      }
    }
    const map = this._loadProgressMap();
    const prev = map[this.currentDocId] || {};
    // 非原版视图 / 渲染中：保留已有页码，避免覆盖原版视图记忆
    if(pdfPage == null) pdfPage = prev.pdfPage || null;
    const paras = doc.paragraphs || [];
    let percent = 0;
    if(paras.length > 0){
      const sentences = Parser.splitSentences(paras[this.paraIdx] || '');
      const totalSent = sentences.length || 1;
      percent = Math.round(((this.paraIdx + (this.sentIdx + 1) / totalSent) / paras.length) * 100);
    }
    map[this.currentDocId] = {
      ts: Date.now(),
      mode: this.mode,
      pdfViewMode: this.pdfViewMode,
      pdfScale: this._pdfScale || 1.4,
      pdfPage,
      scrollTop,
      scrollRatio,
      paraIdx: this.paraIdx,
      sentIdx: this.sentIdx,
      percent
    };
    this._saveProgressMap(map);
    // 兼容旧逻辑：readProgress 与 percent 仍写回文档对象
    DB.updateDoc(this.currentDocId, { readProgress: { paraIdx: this.paraIdx, sentIdx: this.sentIdx, percent } });
  },
  // 滚动节流保存（300-500ms 防抖）
  scheduleProgressSave(){
    if(this._progressTimer) return;
    this._progressTimer = setTimeout(()=>{ this._progressTimer = null; this.saveProgressNow(); }, 400);
  },
  // 立即冲刷待保存进度（翻页 / 切视图 / 缩放 / 关闭页面等即时场景）
  flushProgressSave(){
    if(this._progressTimer){ clearTimeout(this._progressTimer); this._progressTimer = null; }
    this.saveProgressNow();
  },
  // 绑定滚动监听与页面卸载兜底保存（幂等，仅绑定一次）
  bindProgressTracking(){
    const container = document.getElementById('reader-content');
    if(!container || container._progressBound) return;
    container._progressBound = true;
    container.addEventListener('scroll', ()=>{ this.scheduleProgressSave(); }, { passive: true });
    const flush = ()=>{ this.flushProgressSave(); };
    window.addEventListener('beforeunload', flush);
    window.addEventListener('pagehide', flush);
  },
  // 轻量恢复提示
  showRestoreTip(){
    if(!this._hasRestored || this._restoreTipShown) return;
    this._restoreTipShown = true;
    Toast.show('已恢复到上次阅读位置');
  },
  updateProgress(){
    const prog = this.currentDoc.readProgress;
    if(prog){
      document.getElementById('progress-text').textContent = `进度 ${prog.percent||0}%`;
    }
  },
  // 从文件夹视图重命名文档（弹出编辑对话框）
  rename(id){
    const d = DB.getDoc(id);
    if(!d) return;
    Modal.show('编辑文档信息', `
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <label style="font-size:12px;color:var(--text-3);">文档标题</label>
          <input type="text" class="modal-input" id="edit-doc-title" value="${HomeView.esc(d.title||d.name)}" autofocus>
        </div>
        <div>
          <label style="font-size:12px;color:var(--text-3);">中文标题（可选）</label>
          <input type="text" class="modal-input" id="edit-doc-titlecn" value="${HomeView.esc(d.titleCn||'')}" placeholder="中文翻译或原标题">
        </div>
        <div style="display:flex;gap:8px;">
          <div style="flex:1;">
            <label style="font-size:12px;color:var(--text-3);">年份</label>
            <input type="text" class="modal-input" id="edit-doc-year" value="${HomeView.esc(d.year||'')}" placeholder="e.g. 2023">
          </div>
          <div style="flex:1;">
            <label style="font-size:12px;color:var(--text-3);">研究类型</label>
            <input type="text" class="modal-input" id="edit-doc-type" value="${HomeView.esc(d.studyType||'')}" placeholder="e.g. RCT">
          </div>
        </div>
      </div>
    `, [
      {text:'取消', class:'btn', action:()=>Modal.hide()},
      {text:'保存', class:'btn btn-primary', action:()=>{
        const title = document.getElementById('edit-doc-title').value.trim() || d.name;
        const titleCn = document.getElementById('edit-doc-titlecn').value.trim();
        const year = document.getElementById('edit-doc-year').value.trim();
        const studyType = document.getElementById('edit-doc-type').value.trim();
        DB.updateDoc(id, { name: title, title, titleCn, year, studyType });
        Modal.hide();
        if(Router.current === 'folder') FolderView.render();
        Toast.show('文档信息已更新');
      }}
    ]);
  }
};

/* ========================================================
   生词篮视图 BufferView
   - 左侧缓冲区，单词点击后自动加入
   - 后台并发翻译，状态实时更新（待译/翻译中/完成/失败/已收藏）
   - 翻译完成后用户自主决定是否收藏
   - 复用 Translator 缓存，避免重复请求
======================================================== */
const BufferView = {
  // items: { word, translation, context, status, error, saved }
  // status: 'pending' | 'translating' | 'done' | 'failed' | 'saved'
  items: [],
  collapsed: false,

  init(){
    // 从localStorage恢复折叠状态；窄屏（触屏移动端）且从未设置过时默认折叠
    const saved = localStorage.getItem('buffer_collapsed');
    this.collapsed = (saved === null && window.matchMedia && window.matchMedia('(max-width:640px)').matches) || saved === 'true';
    this.applyCollapseState();
  },
  toggleCollapse(){
    this.collapsed = !this.collapsed;
    localStorage.setItem('buffer_collapsed', this.collapsed);
    this.applyCollapseState();
  },
  applyCollapseState(){
    const panel = document.getElementById('buffer-panel');
    const btn = document.getElementById('buffer-collapse-btn');
    if(!panel || !btn) return;

    if(this.collapsed){
      panel.classList.add('collapsed');
      btn.textContent = '▶';
      btn.title = '生词篮（点击展开）';
    }else{
      panel.classList.remove('collapsed');
      btn.textContent = '◀';
      btn.title = '折叠';
    }
  },
  // 记录正在翻译中的词，避免重复发起请求
  inflight: new Set(),
  initBuffer(){
    // 打开新文档时清空篮子（可选：保留。这里选择清空，避免混乱）
    this.items = [];
    this.inflight = new Set();
    this.render();
    // 恢复折叠状态；窄屏（触屏移动端）且从未设置过时默认折叠
    const saved = localStorage.getItem('buffer_collapsed');
    this.collapsed = (saved === null && window.matchMedia && window.matchMedia('(max-width:640px)').matches) || saved === 'true';
    this.applyCollapseState();
  },
  // 添加单词到篮子
  addWord(word, context){
    word = word.trim();
    if(!word) return;
    const key = word.toLowerCase();
    // 已在篮子中：不重复添加，仅更新语境
    const existing = this.items.find(it=>it.type==='word' && it.text.toLowerCase()===key);
    if(existing){
      if(!existing.context && context) existing.context = context;
      this.renderItem(existing);
      return;
    }
    // 检查是否已收藏
    const note = DB.findNote(word);
    const item = {
      id: 'b'+Date.now()+Math.random().toString(36).slice(2,6),
      type: 'word',
      text: word,
      word: word,
      translation: note?.translation || '',
      aiTranslation: '',
      aiStatus: 'idle',
      preferred: 'api',
      context: context || '',
      status: note ? 'saved' : 'pending',
      error: ''
    };
    this.items.push(item);
    this.render();
    if(item.status === 'pending'){
      this.translateOne(item);
    }
  },
  // 添加词组到篮子
  addPhrase(phrase, context){
    phrase = phrase.trim();
    if(!phrase) return;
    const key = phrase.toLowerCase();
    // 已在篮子中
    const existing = this.items.find(it=>it.type==='phrase' && it.text.toLowerCase()===key);
    if(existing){
      if(!existing.context && context) existing.context = context;
      this.renderItem(existing);
      return;
    }
    // 检查是否已收藏（词组也走 note 系统，用 type:phrase 区分）
    const note = DB.findNote(phrase);
    const item = {
      id: 'b'+Date.now()+Math.random().toString(36).slice(2,6),
      type: 'phrase',
      text: phrase,
      word: phrase,
      translation: note?.translation || '',
      aiTranslation: '',
      aiStatus: 'idle',
      preferred: 'api',
      context: context || '',
      status: note ? 'saved' : 'pending',
      error: ''
    };
    this.items.push(item);
    this.render();
    if(item.status === 'pending'){
      this.translateOne(item);
    }
  },
  // 从选区添加文本到生词篮（浮动菜单使用）
  addSelectedText(){
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    if(text.length < 2){ Toast.show('请选择至少2个字符'); return; }
    // 判断是单词还是词组
    const isPhrase = /\s/.test(text);
    if(isPhrase){
      this.addPhrase(text, '');
    }else{
      this.addWord(text, '');
    }
    sel.removeAllRanges();
  },
  // 后台翻译单个（单词或词组）
  async translateOne(item){
    if(item.status==='translating' || item.status==='done' || item.status==='saved') return;
    const key = item.id;
    if(this.inflight.has(key)) return;
    this.inflight.add(key);
    item.status = 'translating';
    item.error = '';
    this.renderItem(item);
    try{
      const trans = await Translator.translate(item.text);
      if(trans === '(翻译失败，请检查网络)'){
        item.status = 'failed';
        item.error = '网络错误';
      }else{
        item.translation = trans;
        item.status = 'done';
      }
    }catch(e){
      item.status = 'failed';
      item.error = e.message || '错误';
    }finally{
      this.inflight.delete(key);
      this.renderItem(item);
      this.updateToolbar();
    }
  },
  // 翻译篮中所有待译单词
  async translateAll(){
    const pending = this.items.filter(it=>it.status==='pending' || it.status==='failed');
    if(pending.length===0){ Toast.show('没有需要翻译的单词'); return; }
    Toast.show('正在后台翻译 '+pending.length+' 个单词...');
    // 并发翻译，控制并发数避免API限流
    const CONCURRENCY = 4;
    let idx = 0;
    const run = async ()=>{
      while(idx < pending.length){
        const it = pending[idx++];
        await this.translateOne(it);
      }
    };
    const workers = [];
    for(let i=0;i<Math.min(CONCURRENCY, pending.length);i++) workers.push(run());
    await Promise.all(workers);
    this.updateToolbar();
    Toast.show('翻译完成');
  },
  // AI翻译单个（调用AI API）
  async aiTranslateOne(item){
    const config = DB.data.settings.aiConfig || {};
    if(!config.apiKey){
      item.aiStatus = 'failed';
      this.renderItem(item);
      return;
    }
    item.aiStatus = 'loading';
    this.renderItem(item);
    try{
      const helperConfig = AIHelper.getConfig();
      const endpoint = AIHelper.getChatEndpoint();
      const headers = AIHelper.getHeaders();
      const requestBody = AIHelper.buildRequestBody(
        [{role:'user', content:`请将以下英文单词/词组翻译成中文，并给出简短解释。只返回翻译结果，不要多余内容：\n\n${item.text}`}],
        { model: helperConfig.model, temperature: 0.3, maxTokens: 512, stream: false }
      );
      const response = await fetch(endpoint, {
        method: 'POST', headers, body: JSON.stringify(requestBody)
      });
      if(!response.ok) throw new Error('请求失败');
      const text = await AIHelper.getFullResponse(response);
      item.aiTranslation = text.trim();
      item.aiStatus = 'done';
    }catch(e){
      item.aiStatus = 'failed';
      item.aiError = e.message;
    }
    this.renderItem(item);
  },
  // 切换偏好的翻译方案
  setPreferredTrans(itemId, mode){
    const item = this.items.find(it=>it.id===itemId);
    if(!item) return;
    if(mode === 'ai' && item.aiStatus === 'idle'){
      this.aiTranslateOne(item);
    }
    item.preferred = mode;
    this.renderItem(item);
  },
  // 收藏单个到笔记
  async saveToNotes(itemId){
    const item = this.items.find(it=>it.id===itemId);
    if(!item) return;
    if(!item.translation){
      Toast.show('尚未翻译'); return;
    }
    const trans = item.preferred === 'ai' && item.aiTranslation ? item.aiTranslation : item.translation;
    const note = DB.addNote(item.text, trans, item.context, ReaderView.currentDocId, item.type);
    item.status = 'saved';
    this.renderItem(item);
    ReaderView.refreshSavedMarks();
    this.updateToolbar();
    // 单词类型：自动保存所在句子为例句并翻译
    if(item.type==='word' && item.context){
      await this.saveExampleForWord(note, item.context);
    }
  },
  // 收藏篮中所有已翻译（done）的项
  async saveAllToNotes(){
    const toSave = this.items.filter(it=>it.status==='done');
    if(toSave.length===0){
      Toast.show('没有可收藏的项（需先翻译完成）'); return;
    }
    const wordItems = [];
    toSave.forEach(it=>{
      const trans = it.preferred === 'ai' && it.aiTranslation ? it.aiTranslation : it.translation;
      const note = DB.addNote(it.text, trans, it.context, ReaderView.currentDocId, it.type);
      it.status = 'saved';
      if(it.type==='word' && it.context) wordItems.push({note, context:it.context});
    });
    this.render();
    ReaderView.refreshSavedMarks();
    this.updateToolbar();
    Toast.show('已收藏 '+toSave.length+' 项到生词本');
    // 后台为每个单词保存例句
    for(const {note, context} of wordItems){
      await this.saveExampleForWord(note, context);
    }
  },
  // 为单词笔记保存例句（句子+翻译）
  async aiTranslateSentence(text){
    const config = DB.data.settings.aiConfig || {};
    if(!config.apiKey) return null;
    try{
      const helperConfig = AIHelper.getConfig();
      const endpoint = AIHelper.getChatEndpoint();
      const headers = AIHelper.getHeaders();
      const requestBody = AIHelper.buildRequestBody(
        [{role:'user', content:`请将以下英文句子翻译成中文，保持原意，语言通顺自然。只返回译文，不要解释：\n\n${text}`}],
        { model: helperConfig.model, temperature: 0.3, maxTokens: 1024, stream: false }
      );
      const response = await fetch(endpoint, {
        method: 'POST', headers, body: JSON.stringify(requestBody)
      });
      if(!response.ok) return null;
      const result = await AIHelper.getFullResponse(response);
      return result.trim() || null;
    }catch(e){
      return null;
    }
  },
  async saveExampleForWord(note, sentence){
    if(!sentence || !note) return;
    try{
      let sentTrans = '';
      const aiTrans = await this.aiTranslateSentence(sentence);
      if(aiTrans){
        sentTrans = aiTrans;
      }else{
        sentTrans = await Translator.translate(sentence);
      }
      DB.addExample(note.id, sentence, sentTrans);
    }catch(e){
      DB.addExample(note.id, sentence, '');
    }
  },
  // 从篮子移除单个
  remove(itemId){
    this.items = this.items.filter(it=>it.id!==itemId);
    this.render();
  },
  // 清空篮子
  clearAll(){
    if(this.items.length===0) return;
    Modal.show('清空生词篮', '<p>确定清空生词篮中的所有项吗？</p><p style="color:var(--text-3);font-size:13px;margin-top:8px;">已收藏的不受影响。</p>', [
      {text:'取消', class:'btn', action:()=>Modal.hide()},
      {text:'清空', class:'btn btn-danger', action:()=>{
        this.items = []; this.inflight.clear(); Modal.hide(); this.render(); Toast.show('已清空');
      }}
    ]);
  },
  // 编辑某个项的翻译（点击翻译文本进入编辑）
  editTranslation(itemId){
    const item = this.items.find(it=>it.id===itemId);
    if(!item) return;
    const typeLabel = item.type==='phrase' ? '词组' : '单词';
    Modal.show('编辑翻译 - '+typeLabel, `
      <div style="font-size:15px;font-weight:600;color:var(--primary);margin-bottom:12px;word-break:break-word;">${HomeView.esc(item.text)}</div>
      <textarea class="modal-input" id="buffer-edit-trans" rows="3" style="margin-bottom:8px;resize:vertical;">${HomeView.esc(item.translation||'')}</textarea>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">语境：${HomeView.esc(item.context||'(无)')}</div>
    `, [
      {text:'取消', class:'btn', action:()=>Modal.hide()},
      {text:'保存', class:'btn btn-primary', action:()=>{
        item.translation = document.getElementById('buffer-edit-trans').value.trim();
        item.status = item.translation ? 'done' : 'pending';
        Modal.hide();
        this.renderItem(item);
        this.updateToolbar();
      }}
    ]);
    setTimeout(()=>document.getElementById('buffer-edit-trans')?.focus(),100);
  },
  // ===== 渲染 =====
  render(){
    document.getElementById('buffer-count').textContent = this.items.length;
    const list = document.getElementById('buffer-list');
    if(this.items.length===0){
      list.innerHTML = '<div class="buffer-empty">点击文中单词加入生词篮<br>拖动选中词组翻译<br><br>💡 单击入篮 · 双击详情 · 拖动选词组</div>';
      this.updateToolbar();
      return;
    }
    list.innerHTML = this.items.map(it=>this.itemHtml(it)).join('');
    this.updateToolbar();
  },
  // 仅刷新某个项的 DOM
  renderItem(item){
    const el = document.querySelector(`[data-buf-id="${item.id}"]`);
    if(el){
      el.outerHTML = this.itemHtml(item);
    }else{
      this.render();
    }
    this.updateToolbar();
  },
  itemHtml(it){
    const statusText = {
      pending:'待翻译', translating:'翻译中<span class="loading-dots"></span>',
      done:'已翻译', failed:'失败', saved:'已收藏'
    }[it.status] || '';
    const statusClass = {
      pending:'', translating:'loading', done:'done', failed:'failed', saved:'saved'
    }[it.status] || '';
    const itemClass = {
      pending:'', translating:'translating', done:'done', failed:'failed', saved:'saved'
    }[it.status] || '';
    const idAttr = it.id;
    const isPhrase = it.type==='phrase';
    const typeIcon = isPhrase ? '🔤' : '📝';
    const typeLabel = isPhrase ? '词组' : '单词';
    let actions = '';
    if(it.status==='saved'){
      actions = `<button class="act-saved" disabled>已收藏</button>
        <button class="act-remove" onclick="BufferView.remove('${idAttr}')">移除</button>`;
    }else if(it.status==='done'){
      actions = `<button class="act-save" onclick="BufferView.saveToNotes('${idAttr}')">收藏</button>
        <button class="act-remove" onclick="BufferView.remove('${idAttr}')">移除</button>`;
    }else if(it.status==='failed'){
      actions = `<button class="act-save" onclick="BufferView.translateOne(BufferView.items.find(i=>i.id==='${idAttr}'))">重试</button>
        <button class="act-remove" onclick="BufferView.remove('${idAttr}')">移除</button>`;
    }else{
      actions = `<button class="act-remove" onclick="BufferView.remove('${idAttr}')">移除</button>`;
    }
    // 翻译选项卡
    let transTabs = '';
    let transContent = '';
    if(it.status==='done' || it.status==='saved'){
      const apiActive = it.preferred === 'api' ? 'active' : '';
      const aiActive = it.preferred === 'ai' ? 'active' : '';
      const apiTrans = HomeView.esc(it.translation);
      const aiTrans = it.aiTranslation ? HomeView.esc(it.aiTranslation) : '';
      
      let aiTabContent = '';
      if(it.aiStatus === 'loading'){
        aiTabContent = '<span style="color:var(--text-3);font-size:12px;">⏳ AI翻译中...</span>';
      }else if(it.aiStatus === 'done'){
        aiTabContent = `${aiTrans}`;
      }else if(it.aiStatus === 'failed'){
        aiTabContent = '<span style="color:var(--text-3);font-size:12px;">❌ AI翻译失败</span>';
      }else{
        aiTabContent = '<span style="color:var(--text-3);font-size:12px;">点击以AI翻译</span>';
      }
      
      transTabs = `<div class="buffer-trans-tabs">
        <span class="buffer-trans-tab ${apiActive}" onclick="BufferView.setPreferredTrans('${idAttr}','api')">⚡ API翻译</span>
        <span class="buffer-trans-tab ${aiActive}" onclick="BufferView.setPreferredTrans('${idAttr}','ai')">🤖 AI翻译</span>
      </div>`;
      
      transContent = `<div class="buffer-trans" onclick="BufferView.editTranslation('${idAttr}')" title="点击编辑翻译" style="cursor:pointer;">
        <div class="buffer-trans-body ${apiActive?'':'hidden'}" data-mode="api">${apiTrans}</div>
        <div class="buffer-trans-body ${aiActive?'':'hidden'}" data-mode="ai">${aiTabContent}</div>
      </div>`;
    }
    return `<div class="buffer-item ${itemClass} ${isPhrase?'is-phrase':''}" data-buf-id="${idAttr}">
      <div class="buffer-word-row">
        <span class="buffer-word">${typeIcon} ${HomeView.esc(it.text)}</span>
        <span class="buffer-status ${statusClass}">${statusText}</span>
      </div>
      ${transTabs}
      ${transContent}
      <div class="buffer-actions">${actions}</div>
    </div>`;
  },
  updateToolbar(){
    const pendingCount = this.items.filter(it=>it.status==='pending'||it.status==='failed').length;
    const doneCount = this.items.filter(it=>it.status==='done').length;
    const translateBtn = document.getElementById('buffer-translate-btn');
    const saveBtn = document.getElementById('buffer-save-btn');
    translateBtn.textContent = pendingCount>0 ? `翻译全部 (${pendingCount})` : '翻译全部';
    translateBtn.disabled = pendingCount===0;
    saveBtn.textContent = doneCount>0 ? `全部收藏 (${doneCount})` : '全部收藏';
    saveBtn.disabled = doneCount===0;
  }
};

/* ========================================================
   单词管理 WordManager
   - 集中管理已收藏单词（生词本 DB.notes）：查看/排序/搜索/编辑/单删/批量删/清空
   - 导出可打印 HTML 释义表（A4 + @media print 分页/页码/表头重复）与 CSV
   - 与 DB 无缝衔接：删除后同步页面已收藏标记与生词篮状态，不影响选词收藏/悬浮释义
======================================================== */
const WordManager = {
  state: { search:'', sort:'time-desc', selected:new Set(), selectAll:false },
  // 从翻译文本提取词性前缀（n. v. vt. vi. adj. adv. 等），提取不到返回空
  POS_RE: /^\s*(?:(n|v|vt|vi|adj|adv|prep|pron|conj|num|art|aux|int|abbr|det|modal|pl)\.?)[\s·:：]*(.*)$/i,
  posOf(trans){
    if(!trans) return { pos:'', rest:'' };
    const m = String(trans).match(this.POS_RE);
    if(m) return { pos:(m[1].toLowerCase()==='v'?'v.':m[1].toLowerCase()+'.'), rest:m[2].trim() };
    return { pos:'', rest:String(trans).trim() };
  },
  noteTime(n){ const t = parseInt(String((n && n.id)||'').replace(/^\D+/,''), 10); return (t>0?t:((n && n.createdAt)||0)) || 0; },
  docTitleOf(note){
    if(!note || !note.documentId) return '';
    const d = DB.getDoc(note.documentId);
    return d ? (d.title || d.name || '') : '';
  },
  fmtDate(ts){ if(!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
  escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  // 面板 HTML（可复用，子弹窗确认后恢复面板）
  panelHtml(){
    return `
      <div class="wm-panel" id="wm-panel">
        <div class="wm-toolbar">
          <input type="text" class="wm-search" id="wm-search" placeholder="搜索单词 / 释义 / 语境..." oninput="WordManager.onSearch(this.value)">
          <select class="wm-select" id="wm-sort" onchange="WordManager.onSort(this.value)">
            <option value="time-desc">按收藏时间 新→旧</option>
            <option value="time-asc">按收藏时间 旧→新</option>
            <option value="alpha-asc">按字母 A→Z</option>
            <option value="alpha-desc">按字母 Z→A</option>
          </select>
          <span class="wm-count" id="wm-count"></span>
          <button class="wm-btn" onclick="WordManager.exportHtml()">⬇ 导出HTML</button>
          <button class="wm-btn" onclick="WordManager.exportCsv()">⬇ 导出CSV</button>
          <button class="wm-btn" onclick="WordManager.printPreview()">🖨 打印释义表</button>
          <button class="wm-btn wm-btn-danger" onclick="WordManager.clearAll()">清空全部</button>
        </div>
        <div class="wm-toolbar" style="border-bottom:none;padding-bottom:0;">
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;">
            <input type="checkbox" class="wm-check" id="wm-check-all" onchange="WordManager.toggleAll(this.checked)"> 全选
          </label>
          <button class="wm-btn wm-btn-danger" id="wm-del-selected" onclick="WordManager.deleteSelected()">删除选中 (<span id="wm-sel-count">0</span>)</button>
          <span class="wm-count">仅删除生词本记录，不影响文档原文</span>
        </div>
        <div class="wm-table-wrap" id="wm-table-wrap">
          <table class="wm-table" id="wm-table">
            <thead>
              <tr>
                <th style="width:32px;"></th>
                <th style="width:52px;">序号</th>
                <th style="width:170px;">单词</th>
                <th style="width:64px;">词性</th>
                <th>中文释义</th>
                <th style="width:140px;">来源文档</th>
                <th style="width:52px;">例句</th>
                <th style="width:80px;">收藏时间</th>
                <th style="width:116px;">操作</th>
              </tr>
            </thead>
            <tbody id="wm-tbody"></tbody>
          </table>
          <div class="wm-empty" id="wm-empty" style="display:none;"></div>
        </div>
      </div>`;
  },
  // 打开管理面板
  open(){
    this.state.search=''; this.state.sort='time-desc'; this.state.selected=new Set(); this.state.selectAll=false;
    const box = document.getElementById('modal-box');
    box.classList.add('modal-lg');
    Modal.show('📖 单词管理', this.panelHtml(), [
      {text:'关闭', class:'btn', action:()=>{ box.classList.remove('modal-lg'); Modal.hide(); }}
    ]);
    this.render();
    setTimeout(()=>document.getElementById('wm-search')?.focus(), 100);
  },
  // 恢复面板（从面板内子弹窗返回时重建内容，保留筛选/排序/勾选状态）
  restorePanel(){
    const box = document.getElementById('modal-box');
    box.classList.add('modal-lg');
    Modal.show('📖 单词管理', this.panelHtml(), [
      {text:'关闭', class:'btn', action:()=>{ box.classList.remove('modal-lg'); Modal.hide(); }}
    ]);
    const s = document.getElementById('wm-sort'); if(s) s.value = this.state.sort;
    const q = document.getElementById('wm-search'); if(q) q.value = this.state.search;
    this.render();
  },
  getFiltered(){
    let notes = (DB.getAllNotes() || []).slice();
    const q = this.state.search.trim().toLowerCase();
    if(q){
      notes = notes.filter(n => (n.word||'').toLowerCase().includes(q) || (n.translation||'').toLowerCase().includes(q) || (n.context||'').toLowerCase().includes(q));
    }
    const s = this.state.sort;
    notes.sort((a,b)=>{
      if(s==='alpha-asc' || s==='alpha-desc'){
        const c = String(a.word||'').localeCompare(String(b.word||''), 'en');
        return s==='alpha-desc' ? -c : c;
      }
      const ta = this.noteTime(a), tb = this.noteTime(b);
      return s==='time-asc' ? ta-tb : tb-ta;
    });
    return notes;
  },
  render(){
    const notes = this.getFiltered();
    const tbody = document.getElementById('wm-tbody');
    const empty = document.getElementById('wm-empty');
    const table = document.getElementById('wm-table');
    const count = document.getElementById('wm-count');
    const total = (DB.getAllNotes() || []).length;
    if(!tbody) return;
    if(notes.length===0){
      table.style.display='none'; empty.style.display='block';
      empty.innerHTML = (total===0)
        ? '生词本为空<br>阅读时点击单词 → 查词 → 「收藏到生词本」，即可在此集中管理'
        : '没有匹配的单词，试试其他关键词';
      count.textContent = `共 ${total} 条，筛选结果 0 条`;
    }else{
      table.style.display=''; empty.style.display='none';
      tbody.innerHTML = notes.map((n, idx)=>{
        const p = this.posOf(n.translation);
        const docTitle = this.docTitleOf(n);
        const isPhrase = (n.type==='phrase');
        const typeLabel = isPhrase ? '词组' : '单词';
        const checked = this.state.selected.has(n.id);
        const exCount = (n.examples && n.examples.length) || 0;
        const safeId = this.escHtml(n.id).replace(/'/g, "\\'");
        return `<tr class="${checked?'selected':''}">
          <td><input type="checkbox" class="wm-check" ${checked?'checked':''} onchange="WordManager.toggleOne('${safeId}', this.checked)"></td>
          <td>${idx+1}</td>
          <td><span class="wm-word">${this.escHtml(n.word||'')}</span> <span class="wm-type-tag ${isPhrase?'phrase':'word'}">${typeLabel}</span></td>
          <td>${p.pos?`<span class="wm-pos">${this.escHtml(p.pos)}</span>`:'<span class="wm-pos empty">—</span>'}</td>
          <td class="wm-trans">${p.rest?this.escHtml(p.rest):'<span style="color:var(--text-3);">(无释义)</span>'}</td>
          <td class="wm-src">${docTitle?this.escHtml(docTitle):'—'}</td>
          <td>${exCount}</td>
          <td style="white-space:nowrap;font-size:12px;color:var(--text-3);">${this.fmtDate(this.noteTime(n))}</td>
          <td class="wm-row-actions">
            <button onclick="WordManager.editNote('${safeId}')">编辑</button>
            <button class="wm-del" onclick="WordManager.deleteOne('${safeId}')">删除</button>
          </td>
        </tr>`;
      }).join('');
      count.textContent = `共 ${total} 条，当前显示 ${notes.length} 条`;
    }
    this.updateSelUI();
  },
  onSearch(v){ this.state.search = v; this.render(); },
  onSort(v){ this.state.sort = v; this.render(); },
  toggleAll(checked){
    this.state.selectAll = checked;
    this.state.selected = checked ? new Set(this.getFiltered().map(n=>n.id)) : new Set();
    this.render();
  },
  toggleOne(id, checked){
    if(checked) this.state.selected.add(id); else this.state.selected.delete(id);
    this.render();
  },
  updateSelUI(){
    const selCount = this.state.selected.size;
    const selEl = document.getElementById('wm-sel-count');
    const delBtn = document.getElementById('wm-del-selected');
    const allEl = document.getElementById('wm-check-all');
    if(selEl) selEl.textContent = selCount;
    if(delBtn) delBtn.disabled = selCount===0;
    if(allEl) allEl.checked = this.state.selectAll;
  },
  // 删除后同步页面：刷新已收藏标记 + 生词篮状态（不影响原文与悬浮释义）
  syncViews(){
    if(window.ReaderView && ReaderView.refreshSavedMarks) ReaderView.refreshSavedMarks();
    if(window.BufferView && BufferView.items){
      let changed = false;
      BufferView.items.forEach(it=>{
        if(it.status==='saved' && !DB.findNote(it.text)){
          it.status = it.translation ? 'done' : 'pending';
          changed = true;
        }
      });
      if(changed && BufferView.render) BufferView.render();
    }
  },
  deleteOne(id){
    const n = (DB.getAllNotes()||[]).find(x=>x.id===id);
    if(!n){ Toast.show('记录不存在'); return; }
    Modal.show('删除单词', `<p>确定删除「<b>${this.escHtml(n.word)}</b>」的收藏记录吗？</p><p style="color:var(--text-3);font-size:13px;margin-top:8px;">仅删除生词本记录，不影响文档原文与悬浮释义触发。</p>`, [
      {text:'取消', class:'btn', action:()=>{ Modal.hide(); this.restorePanel(); }},
      {text:'删除', class:'btn btn-danger', action:()=>{
        DB.deleteNote(id);
        this.state.selected.delete(id);
        Modal.hide(); this.restorePanel();
        this.syncViews();
        Toast.show('已删除');
      }}
    ]);
  },
  deleteSelected(){
    const ids = Array.from(this.state.selected);
    if(ids.length===0) return;
    Modal.show('批量删除', `<p>确定删除选中的 <b>${ids.length}</b> 条单词记录吗？</p><p style="color:var(--text-3);font-size:13px;margin-top:8px;">仅删除生词本记录，不影响文档原文。</p>`, [
      {text:'取消', class:'btn', action:()=>{ Modal.hide(); this.restorePanel(); }},
      {text:'删除', class:'btn btn-danger', action:()=>{
        ids.forEach(id=>DB.deleteNote(id));
        this.state.selected = new Set(); this.state.selectAll=false;
        Modal.hide(); this.restorePanel();
        this.syncViews();
        Toast.show(`已删除 ${ids.length} 条记录`);
      }}
    ]);
  },
  clearAll(){
    const total = (DB.getAllNotes() || []).length;
    if(total===0){ Toast.show('生词本为空'); return; }
    Modal.show('清空生词本', `<p>确定清空全部 <b>${total}</b> 条生词记录吗？</p><p style="color:var(--danger);font-size:13px;margin-top:8px;">此操作不可恢复，仅影响生词本，不影响文档原文。</p>`, [
      {text:'取消', class:'btn', action:()=>{ Modal.hide(); this.restorePanel(); }},
      {text:'清空全部', class:'btn btn-danger', action:()=>{
        DB.data.notes = [];
        DB.save();
        this.state.selected = new Set(); this.state.selectAll=false;
        Modal.hide(); this.restorePanel();
        this.syncViews();
        Toast.show('已清空生词本');
      }}
    ]);
  },
  // 编辑释义
  editNote(id){
    const n = (DB.getAllNotes()||[]).find(x=>x.id===id);
    if(!n) return;
    Modal.show('编辑释义', `
      <div style="font-size:15px;font-weight:600;color:var(--primary);margin-bottom:12px;word-break:break-word;">${this.escHtml(n.word)}</div>
      <textarea class="modal-input" id="wm-edit-trans" rows="4" style="margin-bottom:8px;resize:vertical;">${this.escHtml(n.translation||'')}</textarea>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">语境：${this.escHtml(n.context||'(无)')}</div>
    `, [
      {text:'取消', class:'btn', action:()=>{ Modal.hide(); this.restorePanel(); }},
      {text:'保存', class:'btn btn-primary', action:()=>{
        const trans = document.getElementById('wm-edit-trans').value.trim();
        const note = (DB.getAllNotes()||[]).find(x=>x.id===id);
        if(note){ note.translation = trans; DB.save(); }
        Modal.hide(); this.restorePanel();
        this.syncViews();
        Toast.show('已保存');
      }}
    ]);
    setTimeout(()=>document.getElementById('wm-edit-trans')?.focus(),100);
  },
  // ===== 导出 / 打印 =====
  currentNotesForExport(){ return this.getFiltered(); },
  buildRows(){
    return this.currentNotesForExport().map((n, idx)=>{
      const p = this.posOf(n.translation);
      const docTitle = this.docTitleOf(n);
      const exs = (n.examples || []).map(e=>e && e.sentence).filter(Boolean);
      return {
        idx: idx+1, word: n.word||'', pos: p.pos, trans: p.rest || n.translation || '',
        doc: docTitle, type: (n.type==='phrase'?'词组':'单词'), examples: exs,
        date: this.fmtDate(this.noteTime(n))
      };
    });
  },
  buildExportHtml(opts){
    const o = Object.assign({ includeSource:true, includeExamples:false, landscape:false, includePhrase:true }, opts || {});
    let rows = this.buildRows();
    if(!o.includePhrase) rows = rows.filter(r=>r.type!=='词组');
    let ths = '<th style="width:42px;">序号</th><th>单词</th><th style="width:50px;">词性</th><th>中文释义</th>';
    if(o.includeSource) ths += '<th style="width:110px;">来源文档</th>';
    if(o.includeExamples) ths += '<th>例句</th>';
    const trs = rows.map(r=>{
      let tds = `<td style="text-align:center;">${r.idx}</td><td class="w">${this.escHtml(r.word)}</td><td class="pos">${r.pos?this.escHtml(r.pos):'—'}</td><td>${this.escHtml(r.trans)}</td>`;
      if(o.includeSource) tds += `<td class="src">${this.escHtml(r.doc)||'—'}</td>`;
      if(o.includeExamples) tds += `<td class="ex">${r.examples.length?this.escHtml(r.examples.join(' / ')):'—'}</td>`;
      return `<tr>${tds}</tr>`;
    }).join('');
    const css = `
      @page { size: A4 ${o.landscape?'landscape':'portrait'}; margin: 14mm 10mm 16mm; }
      *{box-sizing:border-box;}
      body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#222;margin:0;padding:0;line-height:1.5;}
      .doc-head{text-align:center;margin-bottom:12px;}
      .doc-head h1{font-size:18px;margin:0 0 4px;}
      .doc-head p{font-size:11px;color:#555;margin:0;}
      table{width:100%;border-collapse:collapse;font-size:11px;}
      th{background:#f0f2f5;font-weight:600;text-align:left;}
      th,td{border:1px solid #888;padding:4px 6px;vertical-align:top;}
      thead{display:table-header-group;}
      tr{page-break-inside:avoid;}
      .w{font-weight:600;color:#1a3f8f;white-space:nowrap;}
      .pos{text-align:center;white-space:nowrap;color:#555;}
      .src{color:#555;font-size:10px;}
      .ex{color:#333;}
      .no-print{text-align:center;padding:14px 0 8px;}
      .no-print .btn{display:inline-block;padding:8px 18px;border:1px solid #4f6df5;border-radius:6px;background:#4f6df5;color:#fff;font-size:13px;text-decoration:none;}
      .print-footer{display:none;}
      @media print {
        .no-print{display:none;}
        .print-footer{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#666;}
        .print-footer::after{content:" — " counter(page) " —";}
      }`;
    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生词本释义表</title>
<style>${css}</style>
</head>
<body>
  <div class="no-print"><a class="btn" href="javascript:window.print()">🖨 打印 / 另存为 PDF</a></div>
  <div class="doc-head">
    <h1>生词本释义表</h1>
    <p>共 ${rows.length} 条 · 生成于 ${new Date().toLocaleString('zh-CN')}</p>
  </div>
  <table>
    <thead><tr>${ths}</tr></thead>
    <tbody>${trs}</tbody>
  </table>
  <div class="print-footer"></div>
</body>
</html>`;
  },
  download(filename, content, mime){
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
  },
  today(){
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  },
  exportHtml(){
    this.showExportOptions((opts)=>{
      const html = this.buildExportHtml(opts);
      const fn = `生词本释义表_${this.today()}.html`;
      this.download(fn, html, 'text/html;charset=utf-8');
      Toast.show(`已导出 ${fn}`);
    });
  },
  exportCsv(){
    const rows = this.buildRows();
    if(rows.length===0){ Toast.show('没有可导出的单词'); return; }
    const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
    const lines = ['序号,单词,词性,中文释义,来源文档,类型,例句'];
    rows.forEach(r=>{
      lines.push([r.idx, esc(r.word), esc(r.pos), esc(r.trans), esc(r.doc), r.type, esc(r.examples.join(' / '))].join(','));
    });
    const fn = `生词本释义表_${this.today()}.csv`;
    this.download(fn, '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    Toast.show(`已导出 ${fn}（${rows.length} 条）`);
  },
  printPreview(){
    this.showExportOptions((opts)=>{
      const html = this.buildExportHtml(opts);
      const w = window.open('', '_blank');
      if(!w){ Toast.show('浏览器拦截了新窗口，请允许弹窗后重试'); return; }
      w.document.open();
      w.document.write(html);
      w.document.close();
      w.onload = ()=>{ setTimeout(()=>{ w.focus(); w.print(); }, 300); };
    });
  },
  // 导出/打印选项：包含来源/例句/词组/纸张方向；完成后恢复管理面板
  showExportOptions(cb){
    const n = this.currentNotesForExport().length;
    Modal.show('导出 / 打印释义表', `
      <p style="font-size:13px;color:var(--text-2);margin-bottom:14px;">将导出当前筛选结果（${n} 条）。默认不包含例句，打印更紧凑。</p>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="wm-opt-source" checked> 包含来源文档列
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="wm-opt-examples"> 包含例句列
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="wm-opt-phrase" checked> 包含词组条目
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px;cursor:pointer;">
        <input type="checkbox" id="wm-opt-landscape"> A4 横向
      </label>
    `, [
      {text:'取消', class:'btn', action:()=>{ Modal.hide(); this.restorePanel(); }},
      {text:'确定', class:'btn btn-primary', action:()=>{
        const opts = {
          includeSource: document.getElementById('wm-opt-source').checked,
          includeExamples: document.getElementById('wm-opt-examples').checked,
          includePhrase: document.getElementById('wm-opt-phrase').checked,
          landscape: document.getElementById('wm-opt-landscape').checked
        };
        Modal.hide(); this.restorePanel();
        cb(opts);
      }}
    ]);
  }
};

/* ========================================================
   弹窗 Modal
======================================================== */
const Modal = {
  show(title, html, buttons){
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    let btnHtml = '';
    if(buttons && buttons.length){
      btnHtml = '<div class="modal-actions">'+buttons.map((b,i)=>`<button class="${b.class}" id="modal-btn-${i}">${b.text}</button>`).join('')+'</div>';
    }
    box.innerHTML = (title?`<h3>${title}</h3>`:'') + html + btnHtml;
    overlay.classList.add('active');
    // 绑定按钮
    if(buttons){
      buttons.forEach((b,i)=>{
        const el = document.getElementById('modal-btn-'+i);
        if(el) el.onclick = b.action;
      });
    }
    // 点击遮罩关闭
    overlay.onclick = (e)=>{ if(e.target===overlay) this.hide(); };
    // 输入框回车触发主按钮（最后一个按钮）
    if(buttons && buttons.length){
      box.querySelectorAll('input.modal-input, textarea.tm-edit').forEach(inp=>{
        inp.addEventListener('keydown', (e)=>{
          if(e.key==='Enter' && !e.shiftKey){
            e.preventDefault();
            const primaryBtn = document.getElementById('modal-btn-'+(buttons.length-1));
            if(primaryBtn) primaryBtn.click();
          }
        });
      });
    }
  },
  hide(){
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('active');
    document.getElementById('modal-box').classList.remove('modal-lg');
  }
};

/* ========================================================
   Toast 提示
======================================================== */
const Toast = {
  timer:null,
  show(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>el.classList.remove('show'), 2500);
  }
};

/* ========================================================
   AI聊天面板 AIChatPanel（仿Trae风格）
========================================================*/
const AIChatPanel = {
  isOpen: false,
  messages: [],
  isStreaming: false,
  contextSelection: '', // 当前选中的文本

  toggle(){
    if(this.isOpen) this.close(); else this.open();
  },
  open(){
    this.isOpen = true;
    document.getElementById('ai-panel').classList.add('open');
    document.getElementById('ai-orb').style.display = 'none';
    this.updateStatus();
    if(this.messages.length === 0){
      const config = DB.data.settings.aiConfig || {};
      const apiKey = config.apiKey?.trim();
      const welcome = apiKey
        ? '你好！AI已连接，可以帮你查词翻译、解释文本、总结要点。有什么我可以帮你的吗？'
        : '你好！当前为离线模式，请在首页点击"⚙️ 设置"配置硅基流动 API Key 后使用真实AI。';
      this.addAssistantMessage(welcome, false);
    }
    document.getElementById('ai-input')?.focus();
  },
  updateStatus(){
    const config = DB.data.settings.aiConfig || {};
    const apiKey = config.apiKey?.trim();
    const statusEl = document.getElementById('ai-panel-status');
    if(!statusEl) return;
    if(apiKey){
      statusEl.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>真实AI已连接';
      statusEl.classList.remove('offline');
    }else{
      statusEl.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>离线模式';
      statusEl.classList.add('offline');
    }
  },
  close(){
    this.isOpen = false;
    document.getElementById('ai-panel').classList.remove('open');
    document.getElementById('ai-orb').style.display = 'flex';
  },
  send(){
    const input = document.getElementById('ai-input');
    const text = input.value.trim();
    if(!text || this.isStreaming) return;
    input.value = '';
    this.addUserMessage(text);
    this.processQuery(text);
  },
  quickAction(type){
    const sel = this.getSelectionText();
    let query = '';
    switch(type){
      case 'explain': query = sel ? `请解释：${sel}` : '请选中文本后再点击此按钮'; break;
      case 'translate': query = sel ? `请翻译：${sel}` : '请选中文本后再点击此按钮'; break;
      case 'summarize': query = '请总结当前文档的要点'; break;
    }
    if(!sel && (type==='explain' || type==='translate')){
      this.addUserMessage(query);
      this.addAssistantMessage('请先在阅读区选中文本，然后再点击此按钮，我会为你进行分析。');
      return;
    }
    this.addUserMessage(query);
    this.processQuery(query);
  },
  explainSelection(){
    const sel = this.getSelectionText();
    if(!sel){ Toast.show('请先选中需要解释的文本'); return; }
    if(!this.isOpen) this.open();
    const query = `请解释：${sel}`;
    this.addUserMessage(query);
    this.processQuery(query);
  },
  explainContextMenu(){
    this.hideContextMenu();
    const sel = this.contextSelection || this.getSelectionText();
    if(!sel){ Toast.show('请先选中需要解释的文本'); return; }
    if(!this.isOpen) this.open();
    const query = `请解释：${sel}`;
    this.addUserMessage(query);
    this.processQuery(query);
  },
  translateContextMenu(){
    this.hideContextMenu();
    const sel = this.contextSelection || this.getSelectionText();
    if(!sel){ Toast.show('请先选中需要翻译的文本'); return; }
    if(!this.isOpen) this.open();
    const query = `请翻译：${sel}`;
    this.addUserMessage(query);
    this.processQuery(query);
  },
  getSelectionText(){
    const selection = window.getSelection();
    return selection ? selection.toString().trim() : '';
  },
  addUserMessage(text){
    this.messages.push({ role:'user', text });
    this.renderMessages();
  },
  addAssistantMessage(text, stream=false){
    this.messages.push({ role:'assistant', text, streaming: stream });
    this.renderMessages();
  },
  renderMessages(){
    const container = document.getElementById('ai-messages');
    container.innerHTML = this.messages.map((msg, idx) => {
      if(msg.role === 'user'){
        return `<div class="ai-msg user">${HomeView.esc(msg.text)}</div>`;
      }else{
        return `<div class="ai-msg assistant" id="ai-msg-${idx}">${this.renderMarkdown(msg.text)}</div>`;
      }
    }).join('');
    container.scrollTop = container.scrollHeight;
  },
  renderMarkdown(text){
    if(!text) return '';
    let html = HomeView.esc(text);
    // 代码块
    html = html.replace(/```([\s\S]*?)```/g, '<div class="ai-code-block">$1</div>');
    // 行内代码
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 加粗
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // 无序列表
    html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    // 换行
    html = html.replace(/\n/g, '<br>');
    return html;
  },
  async processQuery(query){
    this.isStreaming = true;
    // 显示思考中动画
    this.addAssistantMessage('', true);
    const msgIdx = this.messages.length - 1;
    const container = document.getElementById('ai-messages');
    const msgEl = document.getElementById('ai-msg-' + msgIdx);
    if(msgEl) msgEl.innerHTML = '<div class="ai-thinking-dots"><span></span><span></span><span></span></div>';

    // 检查是否有API配置
    const config = DB.data.settings.aiConfig || {};
    const apiKey = config.apiKey?.trim();
    
    if(apiKey){
      try{
        // 调用真实API
        await this.callRealAPI(query, msgIdx, config);
        this.isStreaming = false;
        return;
      }catch(e){
        console.error('AI API调用失败:', e);
        el.innerHTML = `<div class="ai-error-message">❌ API调用失败：${e.message}<br><small>请检查设置中的API Key是否正确</small></div>`;
        this.messages[msgIdx].text = `API调用失败：${e.message}`;
        this.isStreaming = false;
        return;
      }
    }

    // 无API配置，使用模拟响应
    // 判断查询类型
    const lowerQ = query.toLowerCase();
    let response = '';
    let thinking = '';

    if(lowerQ.includes('翻译') || lowerQ.includes('translate')){
      // 翻译请求
      const textToTrans = query.replace(/^(请)?翻译[：:]\s*/i, '').replace(/^please translate[：:]\s*/i, '');
      thinking = `正在分析文本：${textToTrans.substring(0,50)}...\n识别语言：英文 → 中文\n调用翻译API...`;
      try{
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTrans)}&langpair=en|zh-CN`;
        const resp = await fetch(url);
        const data = await resp.json();
        const trans = data.responseData?.translatedText || '(翻译失败)';
        response = `**翻译结果：**\n\n${trans}\n\n---\n💡 以上为机器翻译结果，专业文档建议结合语境理解。`;
      }catch(e){
        response = '翻译请求失败，请检查网络连接后重试。';
      }
    }else if(lowerQ.includes('解释') || lowerQ.includes('explain')){
      const textToExplain = query.replace(/^(请)?解释[：:]\s*/i, '').replace(/^please explain[：:]\s*/i, '');
      thinking = `正在分析文本含义...\n生成解释...`;
      response = `**解释：**\n\n${textToExplain}\n\n这段文本的主要含义如下：\n\n该内容出现在当前文档的语境中，需要结合上下文理解。\n\n---\n💡 如需更详细的解释，请提供更多上下文。`;
    }else if(lowerQ.includes('总结') || lowerQ.includes('summarize')){
      thinking = `正在分析文档结构...\n提取关键段落...\n生成总结...`;
      const doc = ReaderView.currentDoc;
      const paras = doc?.paragraphs || [];
      let summaryParts = [];
      if(paras.length){
        summaryParts.push(`本文共 ${paras.length} 个段落。`);
      }
      response = `**文档总结：** ${doc?.name || '当前文档'}\n\n` + summaryParts.join('\n\n') + `\n\n---\n💡 共 ${paras.length} 段，可进一步询问具体章节的详细内容。`;
    }else{
      // 通用问答
      thinking = `正在理解问题...\n检索文档上下文...\n生成回答...`;
      const doc = ReaderView.currentDoc;
      response = `关于你的问题"${query}"：\n\n基于当前文档"${doc?.name || '未知'}"的上下文，我来尝试回答。\n\n这是一个通用性问题。如果你有具体的文档段落需要分析，可以选中文本后使用"解释选中文本"或"翻译选中文本"功能获取更精准的回答。\n\n---\n💡 你也可以尝试：\n- 📋 总结全文\n- 选中文字后点击快捷按钮`;
    }

    // 模拟流式输出
    await this.streamResponse(msgIdx, response, thinking);
    this.isStreaming = false;
  },
  async streamResponse(msgIdx, fullText, thinking){
    const el = document.getElementById('ai-msg-' + msgIdx);
    if(!el) return;

    // 先显示折叠的思考过程
    let fullHtml = '';
    if(thinking){
      const thinkingId = 'ai-think-' + msgIdx;
      fullHtml += `<div class="ai-thinking-fold" id="${thinkingId}">
        <div class="ai-thinking-fold-header" onclick="this.parentElement.classList.toggle('expanded')">▶ 思考过程</div>
        <div class="ai-thinking-fold-body">${this.renderMarkdown(thinking)}</div>
      </div>`;
    }

    // 逐步输出正文
    const contentEl = document.createElement('span');
    contentEl.className = 'ai-stream-content';
    el.innerHTML = fullHtml;
    el.appendChild(contentEl);

    let charIdx = 0;
    const speed = 20; // ms per char
    return new Promise(resolve => {
      const type = () => {
        if(charIdx < fullText.length){
          contentEl.innerHTML = this.renderMarkdown(fullText.substring(0, charIdx + 1));
          charIdx++;
          const container = document.getElementById('ai-messages');
          container.scrollTop = container.scrollHeight;
          setTimeout(type, speed);
        }else{
          // 流式输出完成，添加结论摘要
          this.messages[msgIdx].text = fullText;
          this.messages[msgIdx].streaming = false;
          // 提取结论
          const conclusion = this.extractConclusion(fullText);
          if(conclusion){
            const concEl = document.createElement('div');
            concEl.className = 'ai-conclusion';
            concEl.textContent = '📌 ' + conclusion;
            el.appendChild(concEl);
          }
          resolve();
        }
      };
      type();
    });
  },
  extractConclusion(text){
    // 简单提取：取最后一句或总结性内容
    const lines = text.split('\n').filter(l => l.trim());
    for(let i = lines.length - 1; i >= 0; i--){
      const line = lines[i].replace(/\*\*/g, '').replace(/^[▪•-]\s*/, '').trim();
      if(line.length > 10 && line.length < 120 && !line.startsWith('---') && !line.startsWith('💡')){
        return line;
      }
    }
    return '';
  },
  hideContextMenu(){
    const menu = document.getElementById('context-menu');
    if(menu) menu.classList.remove('show');
  },

  async callRealAPI(query, msgIdx, config){
    const el = document.getElementById('ai-msg-' + msgIdx);
    if(!el) return;

    try{
      const helperConfig = AIHelper.getConfig();
      const endpoint = AIHelper.getChatEndpoint();
      const headers = AIHelper.getHeaders();
      
      const requestBody = AIHelper.buildRequestBody(
        [{role:'user', content: query}],
        {
          model: helperConfig.model,
          temperature: helperConfig.temperature,
          maxTokens: helperConfig.maxTokens,
          stream: helperConfig.streaming
        }
      );
      
      const response = await fetch(endpoint, {
        method: 'POST',
        headers,
        body: JSON.stringify(requestBody)
      });

      if(!response.ok){
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || err.message || '请求失败');
      }

      if(helperConfig.streaming){
        el.innerHTML = '<span class="ai-stream-content"></span>';
        const contentEl = el.querySelector('.ai-stream-content');
        let fullText = '';

        for await (const delta of AIHelper.parseStream(response)){
          fullText += delta;
          contentEl.innerHTML = this.renderMarkdown(fullText);
          const container = document.getElementById('ai-messages');
          container.scrollTop = container.scrollHeight;
        }
        
        this.messages[msgIdx].text = fullText;
        this.messages[msgIdx].streaming = false;

        const userMsg = this.messages[msgIdx - 1]?.text || '';
        if(this.isTranslationMessage(userMsg, fullText)){
          const actionsEl = document.createElement('div');
          actionsEl.className = 'ai-message-actions';
          actionsEl.innerHTML = `<button class="btn btn-sm" onclick="AIChatPanel.saveTranslationAsNote(${msgIdx})">📥 收藏到生词本</button>`;
          el.appendChild(actionsEl);
        }
      }else{
        const aiText = await AIHelper.getFullResponse(response);
        
        el.innerHTML = this.renderMarkdown(aiText);
        this.messages[msgIdx].text = aiText;
        this.messages[msgIdx].streaming = false;

        const userMsg = this.messages[msgIdx - 1]?.text || '';
        if(this.isTranslationMessage(userMsg, aiText)){
          const actionsEl = document.createElement('div');
          actionsEl.className = 'ai-message-actions';
          actionsEl.innerHTML = `<button class="btn btn-sm" onclick="AIChatPanel.saveTranslationAsNote(${msgIdx})">📥 收藏到生词本</button>`;
          el.appendChild(actionsEl);
        }
      }
    }catch(e){
      el.innerHTML = `<span style="color:var(--danger)">❌ 请求失败: ${e.message}</span>`;
      this.messages[msgIdx].text = '请求失败: ' + e.message;
      this.messages[msgIdx].streaming = false;
    }
  },

  // 判断是否为翻译消息
  isTranslationMessage(userMessage, aiResponse){
    const transKeywords = ['翻译', 'translate', '意思是', 'what does', 'how to say'];
    return transKeywords.some(kw => userMessage.toLowerCase().includes(kw));
  },

  // 收藏翻译到笔记（弹出翻译卡片）
  saveTranslationAsNote(msgIdx){
    const msg = this.messages[msgIdx];
    if(!msg) return;

    const userMsg = this.messages[msgIdx - 1]?.text || '';
    const originalText = userMsg.replace(/^(翻译|请翻译|translate)[:：\s]*/i, '').trim();
    const translation = msg.text;

    const existing = DB.findNote(originalText);
    const isSaved = !!existing;
    const wordCount = originalText.split(/\s+/).length;
    const type = wordCount > 1 ? 'phrase' : 'word';
    const context = ReaderView.currentDoc && ReaderView.getContextForWord ? 
      ReaderView.getContextForWord(originalText.split(/\s+/)[0]) : '';

    Modal.show(isSaved ? '翻译详情' : 'AI翻译结果', `
      <div class="translate-modal" id="ai-translate-modal">
        <div class="tm-word" style="color:var(--primary);">${HomeView.esc(originalText)}</div>
        <div class="tm-status" id="ai-tm-status">${isSaved ? '已收藏' : 'AI翻译结果'}</div>
        <textarea class="tm-edit" id="ai-tm-edit" rows="4" placeholder="编辑翻译...">${isSaved ? HomeView.esc(existing.translation) : HomeView.esc(translation)}</textarea>
        <div class="tm-trans" id="ai-tm-trans" style="display:none;">${HomeView.esc(translation)}</div>
        ${context ? `<div style="font-size:12px;color:var(--text-3);margin-top:8px;padding:8px;background:var(--surface-2);border-radius:6px;">语境：${HomeView.esc(context)}</div>` : ''}
        <div style="font-size:11px;color:var(--text-4);margin-top:6px;">类型：${type === 'word' ? '单词' : '词组'}</div>
        <div class="modal-actions" id="ai-tm-actions"></div>
      </div>
    `, []);

    const actions = document.getElementById('ai-tm-actions');
    let btns = `<button class="btn" onclick="Modal.hide()">关闭</button>`;
    if(isSaved){
      btns += `<button class="btn btn-danger" onclick="AIChatPanel.removeTranslationNote('${existing.id}')">删除收藏</button>`;
      btns += `<button class="btn btn-primary" onclick="AIChatPanel.updateTranslationNote('${existing.id}')">保存修改</button>`;
    }else{
      btns += `<button class="btn btn-primary" onclick="AIChatPanel.doSaveTranslation('${HomeView.esc(originalText).replace(/'/g,"\\'")}', '${type}')">收藏到生词本</button>`;
    }
    actions.innerHTML = btns;
  },

  // 执行保存翻译到笔记
  doSaveTranslation(originalText, type){
    const translation = document.getElementById('ai-tm-edit').value.trim();
    if(!translation){
      Toast.show('请输入翻译内容');
      return;
    }
    const context = ReaderView.currentDoc && ReaderView.getContextForWord ? 
      ReaderView.getContextForWord(originalText.split(/\s+/)[0]) : '';
    DB.addNote(originalText, translation, context, ReaderView.currentDocId, type);
    Modal.hide();
    Toast.show('已收藏到生词本');
    ReaderView.refreshSavedMarks();
  },

  // 更新已收藏的翻译
  updateTranslationNote(noteId){
    const translation = document.getElementById('ai-tm-edit').value.trim();
    if(!translation){
      Toast.show('请输入翻译内容');
      return;
    }
    const note = DB.data.notes.find(n => n.id === noteId);
    if(note){
      note.translation = translation;
      DB.save();
      Modal.hide();
      Toast.show('已更新翻译');
      ReaderView.refreshSavedMarks();
    }
  },

  // 删除笔记
  removeTranslationNote(noteId){
    if(confirm('确定要删除这条收藏吗？')){
      DB.data.notes = DB.data.notes.filter(n => n.id !== noteId);
      DB.save();
      Modal.hide();
      Toast.show('已删除生词记录');
      ReaderView.refreshSavedMarks();
    }
  }
};
